[package]
name = "mandible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
description = "mandible: a universal, interactive TUI reference for CLI tools. `mandible git` opens an explorable tree of every command, subcommand, and flag git has, with descriptions."
keywords = ["cli", "tui", "documentation", "reference"]
categories = ["command-line-interface", "command-line-utilities"]
default-run = "mandible"

[[bin]]
name = "mandible"
path = "src/main.rs"

[dependencies]
mandible-core.workspace = true
mandible-extract.workspace = true
mandible-cache.workspace = true
mandible-tui.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossterm.workspace = true
ratatui.workspace = true
rayon.workspace = true

[dev-dependencies]
tempfile.workspace = true
