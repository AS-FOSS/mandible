[package]
name = "mandible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
description = "mandible: a universal, interactive TUI reference for CLI tools. `mandible git` opens an explorable tree of every command, subcommand, and flag git has, with descriptions."
keywords = ["cli", "tui", "documentation", "reference"]
categories = ["command-line-interface", "command-line-utilities"]
default-run = "mandible"

[[bin]]
name = "mandible"
path = "src/main.rs"

[dependencies]
mandible-core.workspace = true
mandible-extract.workspace = true
mandible-tui.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossterm.workspace = true
ratatui.workspace = true
rayon.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Packaging metadata (spec §15).
#
# Completion sources are literal paths under `target/release/completions`,
# written by `scripts/gen_completions.sh` from the built binary's own
# `--completions <shell>`. Run that script between building and packaging;
# both packagers fail loudly here if it was skipped.
#
# They are not globs, and that is the whole point. A glob source makes both
# tools treat the destination as a directory and append the matched path to
# it, so `target/release/build/mandible-*/out/mandible.bash` installed as
# `…/completions/mandible/mandible-<hash>/out/mandible.bash` — a directory
# where every shell looks for a file, in every rpm the project shipped.
# One source file to one destination path cannot express that.
[package.metadata.deb]
maintainer = "Sadig Akhund <sadigaxund@gmail.com>"
copyright = "2026, Sadig Akhund"
# Relative to *this* package's directory, not the workspace root — which is
# where cargo-deb resolves it from, and where the generate-rpm assets below
# already point with `../`. Without the prefix the build failed with
# "Unable to read license file: LICENSE-MIT / note: 'LICENSE-MIT' exists",
# the note being about the workspace root it was not looking in.
license-file = ["../LICENSE-MIT", "0"]
extended-description = """\
mandible is a universal, interactive TUI reference for CLI tools. \
`mandible git` opens an explorable tree of every command, subcommand, and \
flag git has, with descriptions — a reference browser, not a command \
builder."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/mandible", "usr/bin/", "755"],
    ["../packaging/mandible.1", "usr/share/man/man1/", "644"],
    ["../README.md", "usr/share/doc/mandible/README.md", "644"],
    ["target/release/completions/mandible", "usr/share/bash-completion/completions/mandible", "644"],
    # vendor-completions, not site-functions: Debian's zsh carries
    # `/usr/share/zsh/vendor-completions` on its default `fpath` and does not
    # carry `/usr/share/zsh/site-functions` at all, so a file installed under
    # the latter is never found. The rpm below uses site-functions for the
    # mirror-image reason. Measured on ubuntu:24.04 and fedora:latest with
    # `zsh -c 'print -l $fpath'`.
    ["target/release/completions/_mandible", "usr/share/zsh/vendor-completions/_mandible", "644"],
    ["target/release/completions/mandible.fish", "usr/share/fish/vendor_completions.d/mandible.fish", "644"],
]

[package.metadata.generate-rpm]
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/mandible", dest = "/usr/bin/mandible", mode = "755" },
    { source = "../packaging/mandible.1", dest = "/usr/share/man/man1/mandible.1", mode = "644", doc = true },
    { source = "target/release/completions/mandible", dest = "/usr/share/bash-completion/completions/mandible", mode = "644" },
    { source = "target/release/completions/_mandible", dest = "/usr/share/zsh/site-functions/_mandible", mode = "644" },
    { source = "target/release/completions/mandible.fish", dest = "/usr/share/fish/vendor_completions.d/mandible.fish", mode = "644" },
]
