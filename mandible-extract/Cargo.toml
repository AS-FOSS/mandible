[package]
name = "mandible-extract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
description = "The tiered CLI extraction pipeline for mandible: framework identification, per-framework help-text grammars, completion-script parsing, man pages, and native probes, merged behind one ExtractionTier trait. Not independently useful outside the mandible workspace."
keywords = ["cli", "introspection", "mandible"]
categories = ["command-line-interface", "parser-implementations"]

[lib]
name = "mandible_extract"
path = "src/lib.rs"

[features]
default = ["help-text", "completion-script", "native"]
help-text = ["dep:winnow"]
completion-script = ["dep:brush-parser"]
native = []
manpage = ["dep:cc", "dep:bindgen"]

[dependencies]
mandible-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
winnow = { workspace = true, optional = true }
brush-parser = { workspace = true, optional = true }
toml.workspace = true
directories.workspace = true

# Vendored mandoc build (Tier D), off by default (spec §8, §15: default
# features must build with no C toolchain).
cc = { workspace = true, optional = true }
bindgen = { version = "0.70", optional = true }

[target.'cfg(unix)'.dependencies]
# "term" pulls in `nix::pty`, used only by `tests/exec_policy.rs`'s
# `/dev/tty` regression test, which needs a *real* pty to prove the
# session fix (spec §6 rule 6, [M-17]) actually closes the hazard, since
# the sandbox this crate is developed in has no controlling terminal at
# all — see that test's doc comment.
nix = { version = "0.29", default-features = false, features = ["signal", "process", "term"] }
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
insta = { workspace = true, features = ["yaml"] }
