[workspace]
resolver = "2"
members = [
    "mandible-core",
    "mandible-extract",
    "mandible-search",
    "mandible-tui",
    "mandible",
    "xtask",
]

# Strip symbols from release binaries. Measured on 0.3.1 (aarch64): the
# installed binary drops 5.6 MB -> 4.0 MB, and `cargo install`'s transient
# build tree shrinks ~35 MB — a size win, not the fix for building on a
# RAM-backed $TMPDIR (the README's install note covers that).
[profile.release]
strip = "symbols"

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AS-FOSS/mandible"
readme = "README.md"
authors = ["Sadig Akhund <sadigaxund@gmail.com>"]

[workspace.dependencies]
# These versions must be bumped together with `workspace.package.version`
# above. A path dependency needs a version to be publishable at all, and the
# requirement is a caret one — `"0.1.4"` silently covered 0.1.5 through 0.1.7
# and then failed to resolve the moment the workspace reached 0.2.0. Caught by
# a local build; after a tag it would have failed mid-release, with some crates
# already published and unpublishable again.
mandible-core = { path = "mandible-core", version = "0.3.2" }
mandible-extract = { path = "mandible-extract", version = "0.3.2" }
mandible-search = { path = "mandible-search", version = "0.3.2" }
mandible-tui = { path = "mandible-tui", version = "0.3.2" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
smallvec = "1.13"
unicode-width = "0.2"
ratatui = { version = "0.29", features = ["unstable-widget-ref"] }
crossterm = { version = "0.28", features = ["events"] }
nucleo = "0.5"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
winnow = "0.6"
brush-parser = "0.4"
rayon = "1.10"
directories = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = { version = "3.4", default-features = false }
insta = "1.40"
proptest = "1.5"
tempfile = "3.13"
libc = "0.2"
cc = "1.1"
base64 = "0.22"
toml = "0.8"
