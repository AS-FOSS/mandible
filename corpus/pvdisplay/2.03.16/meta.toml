# Maintainer, seed 7, verdict "wrong": "see '--units [Number]r|R|N|... ]'
# i think it trimmed the ending after '[Number]'". Machine
# classification: stratum "low-confidence".
#
# The real row (`help.txt`) is
# `[    --units [Number]r|R|h|H|b|B|s|S|k|K|m|M|g|G|t|T|p|P|e|E ]`. The
# maintainer's own note writes the list as `r|R|N|...`; there is no `N`
# in the captured bytes (VERIFIED against `help.txt`), so this fixture
# asserts the 18 letters that are actually there.
#
# Maintainer, later pass: "pvdisplay - see if that units change did not
# break for flag 'configreport', because I see duplicated placeholders
# and values. similarly '--driverloaded'".
#
# Machine classification: `--configreport` and `--driverloaded` kept the
# full `|`-list as `value_name` (`log|vg|lv|pv|pvseg|seg`, `y|n`) and also
# carried it as `choices`, so the rendered screen printed the list twice.
# `--units [Number]` was never the same defect: its `value_name` is
# `Number` alone, never the list, so nothing duplicated there. Fixed
# (docs/shapes.md S-130): when a flag's own `value_name` is nothing but
# its `choices` rejoined with `|`, the placeholder came from the same
# trailing list and is dropped rather than kept twice. Dropped, not
# replaced with a generic placeholder, since `choices` already carries the
# full enumeration. `must_not_value_name`, the value-name mirror of
# `must_not_describe`, asserts it below.
#
# POSITIONALS reads `COMMON_OPTIONS`, the synopsis's own placeholder for
# lvm's shared option block (`[ COMMON_OPTIONS ]`, expanded in "Common
# options for lvm:" below it) — not a real operand. The real operand,
# `PV|Tag ...`, the line right after `COMMON_OPTIONS` in the synopsis, is
# not extracted as a positional at all. No contract field can assert that
# a recovered positional is a placeholder rather than a real operand
# (the mirror of `must_not_contain_flags`, one kind up, does not exist),
# so this is recorded here in prose.
#
# stderr carries a one-line non-root warning, captured in help.stderr.txt.

[bless]
provenance = "agent"

[tool]
name = "pvdisplay"
version = "2.03.16"                  # pvdisplay --version: "LVM version:
                                     # 2.03.16(2) (2022-05-18)" (dpkg
                                     # package lvm2 2.03.16-3ubuntu3.2)
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); lvm2 2.03.16-3ubuntu3.2"

[[capture]]
argv = ["pvdisplay", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"

[contract]
expected_framework = "generic"

[contract.must_attach_choices]
"--units" = ["r", "R", "h", "H", "b", "B", "s", "S", "k", "K", "m", "M", "g", "G", "t", "T", "p", "P", "e", "E"]
"--configreport" = ["log", "vg", "lv", "pv", "pvseg", "seg"]
"--driverloaded" = ["y", "n"]

[contract.must_not_value_name]
"--configreport" = "log|vg|lv|pv|pvseg|seg"
"--driverloaded" = "y|n"

# Promoted: a docopt bracket row's own trailing bare `|`-separated list
# (`flag_rows::trailing_choice_list`, docs/shapes.md S-120) now attaches
# as `choices` on both paths that read this row (the headed flags block
# and, for a tool-specific option with no such heading, the synopsis
# itself). `--units` keeps its own `value_name: Number` unchanged; the
# choice list is additional structure, not a replacement. `--configreport`
# and `--driverloaded` have no such bracketed placeholder, so the same
# trailing list that became `choices` is dropped from `value_name` rather
# than kept twice (docs/shapes.md S-130).
#
# COMMON_OPTIONS is still the synopsis's own placeholder for lvm's shared
# option block, extracted as the tool's one positional, while the real
# operand PV|Tag is still dropped; no field states that a recovered
# positional is a placeholder rather than a real operand, so this stays
# unasserted, same as before.
