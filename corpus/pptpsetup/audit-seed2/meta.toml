# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "incomplete". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[tool]
name = "pptpsetup"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["pptpsetup", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
# The whole usage block spans multiple lines with no per-flag table at
# all (just a trailing bullet list of prose descriptions in invocation
# order, no flag names repeated). Verified only ONE of the 7 documented
# flags (--create/--server/--domain/--username/--password/--encrypt/
# --start, plus --delete on the second invocation) survives: --username.
# Everything else, including --delete, is dropped entirely.
must_contain_flags = ["--create", "--server", "--delete"]

[xfail]
broken = true
reason = "bad parse"
# Left [xfail] deliberately, re-checked against the bare-block-extent repair
# that promoted `corpus/sg_dd` (`help_text::sections::bare_block_end`). That
# repair does not reach this document and could not: pptpsetup's defect is
# not a block that runs too far, it is that no usage block is ever *opened*.
# `starts_with_usage_prefix` finds no `usage:` anchor anywhere in this file,
# so the synopsis is read as an ordinary heading-plus-content section and
# only the one flag row directly beneath the first line (`--username`)
# survives.
#
# What the fix would be: anchor a usage block on a line that begins with the
# tool's own name and carries flag-shaped tokens.
#
# What it risks, which is why it is not built (spec §13.1e, where this shape
# is recorded as a dissolved singleton): that same predicate also claims
# `vgck`, `vgextend` and `vgrename` — all three labelled `verbatim-fallback`,
# a cross-family fire — and `nfsidmap` (`nfsidmap: Usage: nfsidmap [-vh] …`),
# whose seed-2 verdict is **`correct` by an explicit maintainer decision the
# audit note records as not to be re-litigated. Handing all four a synopsis
# they do not have today re-opens a signed-off verdict as the side effect of
# a different tool's fix, and bounding it needs the full-PATH sweep this
# fixture cannot stand in for.
