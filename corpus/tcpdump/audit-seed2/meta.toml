stdout = "help.txt"

[contract]
expected_framework = "generic"
# "[-AbdDefhHIJKlLnNOpqStuUvxX#]" — a bundle of ~24 single-char boolean
# flags at the start of the synopsis — verified this becomes ONE flag:
# short='A', value_name='bdDefhHIJKlLnNOpqStuUvxX#', value_kind=Required,
# i.e. every letter after the first is read as a single giant required
# value on "-A". None of those bundled letters exists as its own flag;
# "-v" is picked here since no currently-detected flag shares its
# (case-sensitive) first character.
must_contain_flags = ["-v"]

