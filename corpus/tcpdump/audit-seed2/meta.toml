# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "wrong". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[bless]
provenance = "agent-then-human"

[tool]
name = "tcpdump"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["tcpdump", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
# "[-AbdDefhHIJKlLnNOpqStuUvxX#]" is a bundle of 26 single-char boolean
# flags. It used to become ONE flag — short='A' carrying the other 25 as
# value_name='bdDefhHIJKlLnNOpqStuUvxX#' — and the whole bundle is now
# listed member by member below, including tcpdump's real '#' switch. The
# widest cluster in the corpus, so it is the one that pins every branch of
# the rule at once: alphabetized, case-interleaved (hH/lL/uU/xX), and
# carrying a non-alphanumeric member.
must_contain_flags = [
    "-A", "-b", "-d", "-D", "-e", "-f", "-h", "-H", "-I", "-J", "-K", "-l",
    "-L", "-n", "-N", "-O", "-p", "-q", "-S", "-t", "-u", "-U", "-v", "-x",
    "-X", "-#",
]
verdict_scope = ["flags", "subcommands"]
