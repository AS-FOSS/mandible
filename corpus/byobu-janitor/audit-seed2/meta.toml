# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "correct". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[tool]
name = "byobu-janitor"
version = "audit-seed2"
captured_with = "xtask audit"

# `xtask audit fixtures` only ever records the *winning* probe
# (`RecordingProbe::root_help_capture`, xtask/src/misattribution.rs) — the
# one Tier B's fallback chain actually returned text from. For
# byobu-janitor, `--help` produces nothing on this box (verified live:
# `byobu-janitor --help`, exit 0, empty stdout+stderr), so Tier B falls
# through to `-h`, which is *also* empty and is what got captured as
# "help.txt" below. But replaying only the `-h` entry leaves the `--help`
# probe unanswered in the Transcript, which the replay pipeline treats as
# a hard probe failure rather than "tried, got nothing" — short-circuiting
# before it ever reaches the `-h` fallback and producing no root at all,
# unlike the live run this fixture is supposed to freeze. Added below,
# independently reverified live, not guessed.
[[capture]]
argv = ["byobu-janitor", "--help"]
stdout = "help-long.txt"

[[capture]]
argv = ["byobu-janitor", "-h"]
stdout = "help.txt"

[contract]
# SCOPE OF REVIEW: the human reviewer (audit seed 2) judged this fixture
# "correct" on flag accuracy and subcommand/command accuracy only --
# the audit was explicitly scoped to those two dimensions, never to
# prose. The [contract] fields below encode exactly what was judged.
# expected.snap's node/flag *descriptions* were NOT reviewed and are not
# asserted correct; they are the parser's current output, frozen only so
# a future grammar change surfaces the diff for review -- see
# corpus/README.md's lsof cautionary tale (a description-column defect
# that a full, unread --bless committed as "verified"). Do not read a
# match against expected.snap's prose as a correctness claim.
expected_framework = "generic"
min_status = "ok"
min_subcommands = 0

