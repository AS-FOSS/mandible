# Two defects, quoted from the maintainer's own reading of this build's
# screen, each beside the machine classification of what is actually wrong.
#
# Maintainer: "the flag '-lu_cong' got split into '-lu _cong'... Was this
# thing preexisting? if newly introduced, then why was not this detected as
# a regression."
# Machine classification (a): same underscore-stopping family as
# `corpus/icupkg/74.2`'s `--auto_toc_prefix` defect. VERIFIED FACT (`cargo
# run -p xtask -- corpus --show sg_luns/1.45`): the extracted tree carries
# an entity spelled `--lu` (paired with `-L`) with value_name `_cong`; no
# entity is spelled `--lu_cong`. Pre-existing, not a regression: sweep-diff
# only reports what *changed* between two sweeps, so a bug present since the
# grammar was first written is invisible to it, and this fixture is what
# makes it visible.
#
# Maintainer: "why long flags displayed first then short ones? was not it
# supposed to be other way around, also how tf order has changed?"
# Machine classification (b): the raw rows are written `--decode|-d`, long
# spelling first, and mandible keeps the source order of spellings rather
# than imposing one. VERIFIED FACT: every flag entity's `spellings` list in
# the extracted tree has the long spelling first, matching the raw
# `--long|-x` order exactly.
#
# Maintainer, fourth batch, asking again: "did you answer why the long
# flags are parsed before short ones?" The display-order ruling is now
# recorded in `docs/design.md` §16 ("Short spellings before long ones",
# 2026-09-04): the renderer always shows short spellings first and long
# ones after. This is display-side only and does not lose the author's
# intent. The IR keeps source order regardless: a flag entity's
# `spellings` list still has the long spelling first here, matching the
# raw `--long|-x` order, and it is the renderer that reorders for display.
#
# Maintainer, fourth batch: "the description of '--select -s' uses tabs to
# display the information and folding them into single line kind of breaks
# the expressiveness. Do we keep as is? if handle, what can be even done?
# would it handling this not introduce inconsistencies + bad UI flow?"
# Machine classification (c): `--select=SR|-s SR    select report SR (def:
# 0)` is followed by an indented enumerated continuation (`0 -> ...`, `1 ->
# ...`, up to `0x12 -> ...`), and the renderer folds that continuation into
# one paragraph. No text is lost; every line survives inside the collapsed
# description. It is a display question and no ruling answers it.
#
# There is no `[contract]` field for a usage form, so this is stated in
# prose instead. The raw block documents two synopsis forms:
# `sg_luns [--decode] ... DEVICE` and `sg_luns --test=ALUN [...]`, separated
# by a line reading `     or`. That bare separator used to be joined onto
# the end of the first form, so the first form read `... [--version]
# DEVICE or`. It is fixed: a usage line whose only content is the word
# `or`, in any case, with an optional trailing colon, is a form separator
# and contributes no text to either form
# (`mandible-extract/src/help_text/sections/usage.rs`'s
# `is_bare_or_form_separator`, docs/shapes.md S-112).
# VERIFIED FACT (`cargo run -p xtask -- corpus --show sg_luns/1.45`): the
# extracted tree's `usage` list holds two entries, the first now ending
# `... [--version] DEVICE` with no trailing `or`, the second unchanged.
# No `[contract]` field can assert a usage form, so the re-blessed
# `expected.snap` is what freezes that shape.
#
# Re-blessed after that fix; the rest of the tree was read against the raw
# bytes row by row before the original bless and is untouched by this
# change: 13 flags, every one carrying both its spellings in source order
# and its own description, plus the `DEVICE` positional.

[bless]
provenance = "agent"

[tool]
name = "sg_luns"
version = "1.45"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8)"

# sg_luns writes its whole --help response to stderr; stdout is empty.
# help.txt is committed empty (corpus/README.md's own convention, matching
# e.g. corpus/ssh-keygen/9.6p1) rather than omitted, since [[capture]].stdout
# is a required field.
[[capture]]
argv = ["sg_luns", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"

[contract]
# `mandible --doctor sg_luns` reports framework: unidentified, so Tier A'
# found no fingerprint and the generic layout engine handled it.
expected_framework = "generic"

must_contain_flags = ["--lu_cong", "-L", "--decode", "-d", "--maxlen", "--select", "--test"]
must_not_contain_flags = ["--lu"]
must_contain_positionals = ["DEVICE"]

[contract.must_describe]
"--lu_cong" = "decode as if LU_CONG is set"
"-L" = "decode as if LU_CONG is set"

