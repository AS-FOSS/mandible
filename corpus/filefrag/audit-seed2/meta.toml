# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "wrong". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[bless]
provenance = "agent-then-human"

[tool]
name = "filefrag"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["filefrag", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
# "[-BeEksvxX]" is a bundle of 8 single-char flags. It used to become ONE
# entry — short='B' carrying value_name='eEksvxX' — and all eight are now
# their own flag.
#
# The reason this fixture is worth keeping beside tmux's: the same synopsis
# line also carries "[-b{blocksize}[KMG]]", which is glued, synopsis-sourced
# and bundle-shaped in every way except that its value opens with '{'. It
# must stay a single valued flag, and the snapshot asserts that it does.
must_contain_flags = ["-B", "-e", "-E", "-k", "-s", "-v", "-x", "-X"]
verdict_scope = ["flags", "subcommands"]
