# Same capture as cgi-fcgi/2.4.2. The single-dash word `-connect` is read as
# `-c` with the value `onnect`.

[bless]
provenance = "agent"

[tool]
name = "cgi-fcgi"
version = "2.4.2-connect"
platform = "ubuntu-24.04"
captured_with = "mandible 0.4.1"

[[capture]]
argv = ["cgi-fcgi", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
must_contain_flags = ["-connect"]
must_not_contain_flags = ["-c"]

[xfail]
broken = true
reason = "the usage word -connect is read as -c with the value onnect; a single-dash word in a synopsis with no row of its own needs evidence that it is one multi-letter option"
