# Fixed (docs/shapes.md S-137). Each invocation form's own usage line now
# reaches `usage` as its own entry, and its option rows carry the prose
# sentence above it as their group instead of the usage line itself.
# `sections::looks_like_invocation_form_head` admits a head naming more
# than one flag, which `stanza_description_above` (S-012) required only
# one of before. `grammar::bracket_flag_row_content` also now tolerates a
# trailing parenthetical remark (`[ --type linear ] (implied)`), or
# `--type` would still be missing.

[bless]
provenance = "agent"

[tool]
name = "lvcreate"
version = "2.03.16"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); lvm2 2.03.16(2) (2022-05-18)"

[[capture]]
argv = ["lvcreate", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"

[contract]
expected_framework = "generic"
min_status = "low-confidence"
must_contain_flags = ["--mirrorlog", "--type", "--extents"]
must_not_contain_usage_text = ["[ --type linear ] (implied)"]
must_usage_forms_min = 17
must_not_contain_flag_group_prefixes = ["lvcreate", "Lvcreate"]
# COMMON_OPTIONS is a placeholder for the two shared option blocks, never
# an operand. It used to reach the tree as a root positional.
must_not_contain_positionals = ["COMMON_OPTIONS"]

[contract.must_attach_choices]
"--mirrorlog" = ["core", "disk"]

[contract.must_flag_group]
"--mirrorlog" = "Create a raid1 or mirror LV."

# docs/shapes.md S-147 follow-up (ruled 2026-09-07 "queue"): thirteen
# invocation forms all reach the tree spelled `--type`, each naming a
# different literal value, either directly (`--type raid`) or via a
# bracket row's own trailing choice list (`raid1|mirror`).
# `must_attach_choices` alone cannot state this claim — it walks the raw,
# unrefilled tree, where `.find()` sees only the first form's own,
# usually-empty `choices`. The claim only means something once the same
# background root-refill the running app always performs
# (`Warmer::submit_root_fill`) folds every form into one bucket, which is
# what `must_choices_after_root_refill` simulates. No form ever names
# `--type`'s value with a capitalised token, so the merged flag carries no
# placeholder at all rather than a fabricated `<type>`.
[contract.must_choices_after_root_refill]
"--type" = ["linear", "striped", "raid1", "mirror", "raid", "raid10", "snapshot", "thin-pool", "cache-pool", "thin", "vdo", "cache", "writecache"]
