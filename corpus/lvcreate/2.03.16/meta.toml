[bless]
provenance = "agent"

[tool]
name = "lvcreate"
version = "2.03.16"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); lvm2 2.03.16(2) (2022-05-18)"

[[capture]]
argv = ["lvcreate", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"

[contract]
expected_framework = "generic"
min_status = "low-confidence"
must_contain_flags = ["--mirrorlog", "--type", "--extents"]
must_not_contain_usage_text = ["lvcreate -s|--snapshot LV"]

[contract.must_attach_choices]
"--mirrorlog" = ["core", "disk"]

[xfail]
broken = true
reason = "lvm2 help is a list of invocation forms. Each form is a prose line, then a usage line, then tab-indented option rows. 1. No root flag group starts with lvcreate or Lvcreate. 2. --mirrorlog sits in a group whose label is the prose line Create a raid1 or mirror LV., or in no group at all. 3. The tree's usage carries more than one form."
