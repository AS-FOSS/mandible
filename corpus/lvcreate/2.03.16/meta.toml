# Fixed (docs/shapes.md S-137). Each invocation form's own usage line now
# reaches `usage` as its own entry, and its option rows carry the prose
# sentence above it as their group instead of the usage line itself.
# `sections::looks_like_invocation_form_head` admits a head naming more
# than one flag, which `stanza_description_above` (S-012) required only
# one of before. `grammar::bracket_flag_row_content` also now tolerates a
# trailing parenthetical remark (`[ --type linear ] (implied)`), or
# `--type` would still be missing.

[bless]
provenance = "agent"

[tool]
name = "lvcreate"
version = "2.03.16"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); lvm2 2.03.16(2) (2022-05-18)"

[[capture]]
argv = ["lvcreate", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"

[contract]
expected_framework = "generic"
min_status = "low-confidence"
must_contain_flags = ["--mirrorlog", "--type", "--extents"]
must_not_contain_usage_text = ["[ --type linear ] (implied)"]
must_usage_forms_min = 17
must_not_contain_flag_group_prefixes = ["lvcreate", "Lvcreate"]

[contract.must_attach_choices]
"--mirrorlog" = ["core", "disk"]

[contract.must_flag_group]
"--mirrorlog" = "Create a raid1 or mirror LV."
