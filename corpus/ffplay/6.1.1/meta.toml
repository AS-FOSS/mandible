# Regression fixture for issue #30's own primary example: ffplay's
# `Main options:` table documents help under four separate physical rows —
# `-L`, `-h topic`, `-? topic`, `-help topic`, `--help topic` — sharing the
# description "show help" (`-L` is a distinct flag, "show license"). Before
# `spellings: Vec<Spelling>` existed, `Entity` (and the `Flag` it replaced)
# could hold at most two spellings, so at most two of the four rows could
# ever land on one entity.
#
# `-h` and `--help` pair via `mandible_core::merge::pair_aliases` (matching
# descriptions, complementary short/long slots) into one two-spelling
# entity. `-?` is short-only and has no complementary long-only row left to
# pair with once `-h`/`--help` are taken, so it stays its own one-spelling
# entity. `-help` is single-dash-long, and `pair_aliases::complementary`
# refuses to treat a single-dash long as the long half of *any* pair (the
# lto-dump incident: a generic description like `[disabled]` repeats across
# many unrelated flags, and admitting a single-dash long into that pairing
# swallowed a real flag under an unrelated one) — so `-help` also stays its
# own one-spelling entity. Three entities where the tool documents one row's
# worth of meaning is the defect; `[contract]` below pins the honest
# residual rather than asserting a merge this fixture's own emission fix
# does not attempt.
#
# `ffplay --help` is enormous (every codec/muxer/filter/bsf's own AVOptions,
# over a thousand rows) because ffmpeg-family tools dump their entire
# per-component option surface under `--help`, not a curated top-level
# list — captured whole regardless, per this project's real-bytes rule.

[bless]
provenance = "agent"

[tool]
name = "ffplay"
version = "6.1.1-3ubuntu5"
platform = "ubuntu-24.04"
captured_with = "mandible 0.5.0"

[[capture]]
argv = ["ffplay", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
min_status = "ok"
must_contain_flags = ["-L", "-h", "-?", "help"]
