# From issue 102 item 4 (wrapped-prose row boundary). The excluded-options
# sentence wraps mid-list onto a line starting with "--null-data (-z), and
# --recursive (-r).", a dash-led word, so the wrap is read as a new row
# rather than a continuation of the previous line.

[bless]
provenance = "agent"

[tool]
name = "zgrep"
version = "1.12"
platform = "ubuntu-24.04"
captured_with = "mandible 0.6.1"

[[capture]]
argv = ["zgrep", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"

# zgrep has neither flag. Both were fabricated because the sentence listing
# unsupported grep options wrapped mid-list onto a line starting with a
# dash-led word, read as a new flag row until docs/shapes.md S-027 fixed it.
must_not_contain_flags = ["--exclude", "--null-data"]

# Maintainer, checking this build by hand: "positionals part is fine, but
# the same bad parse we encountered earlier where all flags are on the same
# line therefore got parsed as synonyms. verdict: wrong". Machine
# classification: wrapped-prose row boundary. The verdict is recorded in
# audit/submissions/sadigaxund/6.toml.
#
# Fleet count: the wrapped-prose-row-boundary detector fires on 21 tools
# (26 flags) across a full-PATH sweep of 2318 tools, 2026-09-03. The number
# IS now quotable: this tool and resolvconf carry the family's first human
# verdicts, the detector fires on both, and it stays silent on all 39
# judged-correct tools that have a fixture (30 on seed 2, 9 on seed 4).
