# Value specs with a comma-list tail lose the tail.

[bless]
provenance = "agent"

[tool]
name = "dnsmasq"
version = "2.91"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); dnsmasq-base 2.91-0ubuntu0.24.04.1"

[[capture]]
argv = ["dnsmasq", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"

[contract.must_value_name]
"--dhcp-range" = "<ipaddr>,..."
"--dhcp-pxe-vendor" = "<vendor>[,...]"
"--shared-network" = "<iface>|<addr>,<addr>"

[xfail]
broken = true
reason = "a value spec's comma tail is dropped: --dhcp-range=<ipaddr>,... renders <ipaddr>, --dhcp-pxe-vendor=<vendor>[,...] renders <vendor>, --shared-network=<iface>|<addr>,<addr> renders <iface>|<addr>. The tail says the value is a comma-separated list, so dropping it loses information (AGENTS.md 3.9). A fix keeps the whole value spec."
