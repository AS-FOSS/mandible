# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "wrong". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[tool]
name = "ssh-keygen"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["ssh-keygen", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
# Among the ~40 combinatorial usage lines, one has a bundled 2-char group:
# "-I certificate_identity -s ca_key [-hU] ..." — verified this becomes
# short='h', value_name='U', value_kind=Required, i.e. "-U" read as a
# required value on "-h" rather than its own flag. No flag currently has
# short=='U'.
#
# This one stays broken **on purpose** after the bundled-short-flag fix, and
# is the fix's documented lower bound. `grammar::MIN_CLUSTER_MEMBERS` is 3,
# so a two-character cluster is left alone: the fleet's two-character
# population is roughly half real collapses (this, `umount`'s `[-hV]`,
# `ssh-agent`'s `[-Dd]`) and half entirely correct parses of genuine
# multi-character single-dash flags (`rpcgen -Ss`, `xxd -ps`, `mandoc -ac`,
# `lessecho`'s seven character-argument flags). Nothing about their shape
# separates the two halves, and under the no-false-positives rule a
# recall gain that can destroy a working tool is not a trade to take. So
# this fixture is the miss, recorded as a miss.
must_contain_flags = ["-U"]

[xfail]
broken = true
reason = "this help text just prints out all the possible combinations together with tools name. kind of got parsed, but i feel like incomplete"
