# The KNOWN WRONG note this file carried is now history: every flag in
# `expected.snap` used to carry
# `group: "When a filename is '-', nano reads data from standard input."`,
# a sentence from nano's preamble that the section scanner promoted to a
# heading because the option table below it happens to be indented one
# column further. `help_text::sections::is_prose_sentence` refuses to let a
# period-terminated single-field sentence name a group, so no flag in this
# snapshot has a `group:` at all now. The note did its job exactly as
# intended — it said the field was unfixed rather than agreed with, and the
# fix showed up as the visible snapshot diff it predicted.
#
# The aligned-spelling-column split this fixture was originally added for is
# unchanged and still asserted below.

[bless]
provenance = "agent"

[tool]
name = "nano"
version = "7.2"
platform = "ubuntu-24.04"
captured_with = "xtask audit"

[[capture]]
argv = ["nano", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
# The regression assertion for the aligned multi-column option table: on
# `main` before this fixture existed, every one of these long spellings was
# read as the first word of its own row's description (or, where the row had
# no description column at all, discarded outright), so none of them reached
# the tree.
must_contain_flags = ["--smarthome", "--backupdir", "--zero", "--stateflags", "--minibar"]
