#    the wrapped synopsis lines spilled into the section scanner where they
#    were read as SECTION HEADERS.
#
# `--del` is the assertion because it is the falsifiable half: it is
# documented nowhere in this tool's output except on a backslash-continued
# usage line, so it can only be in the tree if that line was read whole.
must_contain_flags = ["--del"]
