[bless]
provenance = "agent"

[tool]
name = "ffmpeg"
version = "6.1.1"
platform = "ubuntu-24.04 (aarch64)"
captured_with = "mandible 0.2.2"

# A truncation-confession specimen (spec §6 rule 2b): ffmpeg's own `--help`
# prints its "Getting help:" block, unquoted, inside a flag-table row:
#
#   Getting help:
#       -h      -- print basic options
#       -h long -- print more options
#       -h full -- print all options (including all format and codec
#                  specific options, very long)
#       -h type=name -- print all options for the named
#                  decoder/encoder/demuxer/muxer/filter/bsf/protocol
#       See man ffmpeg for detailed description of the options.
#
# The most complete listed invocation, `-h full`, is probed once, literally
# as written, and the tree is built from that document (S-281). `-h long`
# is never probed when `-h full` is listed, and `-h type=name` is a template
# that is never built. `help-full.txt` is 329 KiB, over corpus/README.md's
# 256 KiB threshold; the full document is the point of this fixture, as
# `curl --help all` is for `corpus/curl/8.5.0-all`.
[[capture]]
argv = ["ffmpeg", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 0

[[capture]]
argv = ["ffmpeg", "-h", "full"]
stdout = "help-full.txt"
exit_code = 0

[contract]
expected_framework = "generic"
min_status = "ok"
min_subcommands = 0
# Spot-checked flags the root `--help` document itself lists, so a
# regression that stops recovering even this "basic options" document is
# still caught, distinct from the confession detection this fixture exists
# to exercise.
#
# `loglevel` and `report` are written **bare**, not as `-loglevel`/`-report`.
# ffmpeg spells its whole CLI as single-dash long options, which the tree
# now records as `long` + `single_dash` (see
# `sections::repair_single_dash_long_options`), and the bare form is what
# `corpus::flag_present` matches against `long` verbatim — the same
# convention the `.bt` fixtures already use for `vv`/`dd`/`kk`. The
# dashed form asserted strictly less than it looks like it does:
# `flag_present` reads a `-x` spec as a *short* flag and truncates to the
# first character, so `-loglevel` only ever asserted "some flag has short
# `l`" — satisfied by the very split (`-l` carrying `"oglevel"`) this
# fixture should have been catching. Bare is the stronger assertion.
must_contain_flags = ["-f", "-c", "-y", "loglevel", "report", "fifo_format", "queue_size"]
