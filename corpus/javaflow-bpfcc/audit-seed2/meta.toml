# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "incomplete". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[bless]
provenance = "agent"

[tool]
name = "javaflow-bpfcc"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["javaflow-bpfcc", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "argparse"
# A second, contract-testable defect in the same capture: every
# "-x VALUE, --longname VALUE" line loses its long form entirely (e.g.
# "-l {java,perl,...}, --language {...}" becomes short='l' only, with a
# garbled value_name carrying a trailing comma and the unclosed brace
# group). --language/--method/--class were all absent until
# `dropped-alias` was fixed. The `{java,perl,...}` choice list is why
# `take_rest_value_token` asks what FOLLOWS a separator rather than merely
# that one is present: six commas sit inside that one placeholder, and a
# rule that stopped at the first would read the alias as `perl`.
must_contain_flags = ["--language", "--method", "--class"]

# The reviewer's OWN finding, assertable at last: `pid` is listed under
# argparse's `positional arguments:` heading and was dropped entirely.
# Repaired by `unparsed-positional` — see this fixture's sibling
# rubyobjnew-bpfcc, which carries the same assertion for two operands from
# a different bcc tool, so the rule has two independent members rather
# than one tool's bytes.
must_contain_positionals = ["pid"]
