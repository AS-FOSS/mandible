[bless]
provenance = "agent"

[tool]
name = "java"
version = "audit-seed"
platform = "ubuntu-24.04"
captured_with = "probe environment, setsid, null stdin"

[[capture]]
argv = ["java", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
must_contain_flags = ["-cp", "-classpath", "--class-path", "-p", "--module-path", "-d", "--describe-module", "-D", "-verbose", "-splash", "-agentlib", "-agentpath", "-javaagent", "-ea", "-enableassertions", "-da", "-disableassertions", "-?", "-h", "-help", "--disable-@files"]
must_not_contain_flags = ["-c", "-v", "-e", "-a", "-s", "-j", "--disable-"]
must_describe_root = ["Arguments following the main class, source file, -jar <jarfile>, -m or --module <module>/<mainclass> are passed as the arguments to main class."]
must_draw = [
  "-D<name>=<value>",
  "-verbose:[class|module|gc|jni]",
  "-splash:<imagepath>",
  "-agentlib:<libname>[=<options>]",
  "-agentpath:<pathname>[=<options>]",
  "-javaagent:<jarpath>[=<options>]",
  "-cp, -classpath, --class-path <class search path",
  "-p, --module-path <module path>",
  "-d, --describe-module <module name>",
  "-?, -h, -help",
  "-ea, -enableassertions[:<packagename>...|:<classname>]",
  "-da, -disableassertions[:<packagename>...|:<classname>]",
  "--disable-@files",
  "@argument files",
]

must_not_contain_usage_text = ["or java", "(to execute a class) or", "(to execute a jar file) or"]

[contract.must_contain_usage_by_path]
"" = [
  "java [options] <mainclass> [args...]",
  "java [options] -jar <jarfile> [args...]",
  "java [options] -m <module>[/<mainclass>] [args...]",
  "java [options] --module <module>[/<mainclass>] [args...]",
  "java [options] <sourcefile> [args]",
]

[contract.must_value_name]
"-D" = "<name>=<value>"
"-verbose" = ":[class|module|gc|jni]"
"-splash" = ":<imagepath>"
"-agentlib" = ":<libname>[=<options>]"

[contract.must_not_value_name]
"-m" = "or"

[contract.must_describe]
"-cp" = "A : separated list of directories, JAR archives, and ZIP archives to search for class files."
"-p" = "A : separated list of elements, each element is a file path to a module or a directory containing modules."
"--upgrade-module-path" = "A : separated list of elements, each element is a file path to a module or a directory containing modules to replace upgradeable modules in the runtime image. Each module is either a modular JAR or an exploded-module directory."
"-d" = "describe a module and exit"
"-ea" = "enable assertions with specified granularity"
"-?" = "print this help message to the error stream"
"--disable-@files" = "prevent further argument file expansion"
"@" = "one or more argument files containing options"
