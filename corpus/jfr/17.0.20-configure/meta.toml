# Excerpt of corpus/jfr/17.0.20: the `jfr help configure` text as the root.
# The bytes come from `jfr help configure`, not `jfr --help`; `argv` stays
# ["jfr", "--help"] only because the corpus runner builds the root from the
# `--help` capture and yields no root for argv ["jfr", "help", "configure"].
# The `option=value` and `event-setting=value` rows and the keys under
# `Options for default.jfc:` (`gc=<off|...>`) are description text of the
# node, as printed: not operands, not flags (maintainer).

[bless]
provenance = "agent"

[tool]
name = "jfr"
version = "17.0.20"
platform = "ubuntu-24.04"
captured_with = "probe environment, setsid, null stdin"

[[capture]]
argv = ["jfr", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
must_contain_flags = ["--interactive", "--verbose", "--input", "--ouput"]
must_not_contain_flags = ["gc", "allocation-profiling", "compiler", "method-profiling", "thread-dump", "exceptions", "memory-leaks", "locking-threshold", "file-threshold", "socket-threshold", "class-loading"]
must_not_contain_positionals = ["option=value", "event-setting=value"]
must_describe_root = [
    "Configures a .jfc file",
    "option=value The option value to modify. For available options, see listed input files below.",
    "event-setting=value The event setting value to modify. Use the form: <event-name>#<setting-name>=<value> To add a new event setting, prefix the event name with '+'.",
    "The whitespace delimiter can be omitted for timespan values, i.e. 20ms. For more information about the settings syntax, see Javadoc of the jdk.jfr package.",
    "Options for default.jfc:",
    "gc=<off|normal|detailed|high|all>",
    "class-loading=<true|false>",
    "To run interactive configuration wizard:",
    "jfr configure --interactive",
]
must_not_describe_root = ["jfr configure --input none +Hello#enabled=true --output minimal.jfc"]

[xfail]
broken = true
reason = "The block under `Example usage:` (five `jfr configure ...` command lines) stays in the root description, which makes it the longest description in the corpus. The EXAMPLES rule (S-071) recognizes an `Examples:` heading and not `Example usage:`, so these lines never reach the EXAMPLES section. The `option=value` rows, the prose and the `Options for default.jfc:` list stay description text as printed."
