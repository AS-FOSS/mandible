# Captured from OpenJDK 17.0.20 on the dev box through the probe
# environment. The root prints `jfr help [<command>] (aliases --help, -h,
# -?)`, so each word its own text attests by invocation is probed as
# `jfr help <word>` (docs/shapes.md S-189, spec section 6 rule 2).

[bless]
provenance = "agent"

[tool]
name = "jfr"
version = "17.0.20"
platform = "ubuntu-24.04"
captured_with = "probe environment, setsid, null stdin"

[[capture]]
argv = ["jfr", "--help"]
stdout = "help.txt"

[[capture]]
argv = ["jfr", "help", "configure"]
stdout = "help-configure.txt"

[[capture]]
argv = ["jfr", "help", "metadata"]
stdout = "help-metadata.txt"

[[capture]]
argv = ["jfr", "help", "summary"]
stdout = "help-summary.txt"

[[capture]]
argv = ["jfr", "help", "assemble"]
stdout = "help-assemble.txt"

[[capture]]
argv = ["jfr", "help", "disassemble"]
stdout = "help-disassemble.txt"

[[capture]]
argv = ["jfr", "help", "version"]
stdout = "help-version.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
min_subcommands = 6
must_not_contain_flags = ["--xml", "--json", "--stack-depth"]
must_not_contain_usage_text = ["jfr print"]

[contract.must_contain_flags_by_path]
metadata = ["--categories", "--events"]
configure = ["--interactive", "--verbose", "--input", "--output"]
disassemble = ["--output", "--max-chunks", "--max-size"]

[xfail]
broken = true
reason = "[S-189] the first invocation block (`jfr print`) is read as the root usage with its flags, so `print` is not a node, and each node summary carries its wrapped synopsis tail ahead of the description; telling the first block of an invocation table from a usage line needs more than a general rule so far"
