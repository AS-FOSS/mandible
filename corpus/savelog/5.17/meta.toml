# Two defects on one capture. The row `-1 .. -9` documents nine
# single-digit flags, and the tree reads one flag `-1` with value `..`.
# The last row `file - log file names` documents the usage line's
# trailing `file ...` operand, and the tree has no positional at all.

[bless]
provenance = "agent"

[tool]
name = "savelog"
version = "5.17"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); debianutils 5.17build1"

[[capture]]
argv = ["savelog", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
must_contain_positionals = ["file..."]
must_contain_flags = ["-1", "-5", "-9"]

[contract.must_not_value_name]
"-1" = ".."

[xfail]
broken = true
reason = "the usage line's trailing file ... operand is missing from the tree, though the last option row documents it as 'file - log file names'. Separately, the '-1 .. -9' row is read as one flag -1 with value '..' where it names nine flags; no second tool spells a numeric flag range this way yet, so that half is below the five-tool bar."
