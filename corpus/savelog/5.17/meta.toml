# The row `-1 .. -9` documents nine single-digit flags, read as nine
# flags with no value (S-181). The last row `file - log file names`
# describes the usage line's trailing `file ...` operand (S-182).

[bless]
provenance = "agent"

[tool]
name = "savelog"
version = "5.17"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); debianutils 5.17build1"

[[capture]]
argv = ["savelog", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
must_contain_positionals = ["file..."]
must_contain_flags = ["-1", "-5", "-9"]

[contract.must_not_value_name]
"-1" = ".."

[contract.must_describe]
"-9" = "compression strength or memory usage (default: 9, except for xz)"
