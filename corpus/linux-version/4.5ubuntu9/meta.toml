# The usage forms print the program as a path, `/usr/bin/linux-version
# compare ...`; the verbs are subcommands all the same (docs/shapes.md S-240).

[bless]
provenance = "agent"

[tool]
name = "linux-version"
version = "4.5ubuntu9"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2; linux-base 4.5ubuntu9+24.04.2"

[[capture]]
argv = ["linux-version", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
min_subcommands = 3

[contract.must_contain_flags_by_path]
sort = ["--reverse"]
list = ["--paths"]

[contract.must_contain_positionals_by_path]
compare = ["OP"]

[xfail]
broken = true
reason = "[S-240] the usage forms open with the path /usr/bin/linux-version, not the bare tool name, so compare, sort and list are not read as subcommands and --reverse, --paths sit on the root"
