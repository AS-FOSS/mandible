# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# originally reviewed under seed 2 as "correct". That verdict was itself
# wrong and has been amended in audit/2.toml to "wrong" — see that file's
# `tmux` entry's `[[amendments]]` for the full record. This fixture is
# hand-edited to match, per corpus/README.md's "passing -> xfail" lifecycle
# rule (an explicit meta.toml edit, justified in the amending commit): the
# `[contract]` below no longer claims a verdict_scope, because there is no
# longer a correctness claim to scope.

[tool]
name = "tmux"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["tmux", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "BSD-terse"
# "[-2CDlNuVv]" — a bundle of 8 single-char boolean flags — becomes ONE
# entry: short='2', value_name='CDlNuVv', value_kind=Required, i.e. every
# letter after the first is swallowed as a single required value on "-2".
# The same bundled-short-flag collapse judged `wrong` on tcpdump, filefrag,
# ssh-keygen and xfs_io in the same seed-2 review. None of the other seven
# bundled letters exists as its own flag right now.
must_contain_flags = ["-C", "-D", "-l", "-N", "-u", "-V", "-v"]

[xfail]
broken = true
reason = "bundled-short-flag collapse ([-2CDlNuVv] parses as one flag '-2' with a required value 'CDlNuVv'), the same defect judged wrong on tcpdump/filefrag/ssh-keygen/xfs_io in the same review; the original 'correct' verdict was a reviewer inconsistency caught in post-review reconciliation, amended in audit/2.toml"
