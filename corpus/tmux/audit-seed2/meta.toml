# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# originally reviewed under seed 2 as "correct". That verdict was itself
# wrong and has been amended in audit/2.toml to "wrong" — see that file's
# `tmux` entry's `[[amendments]]` for the full record.
#
# Promoted out of `[xfail]`: `grammar::parse_bundled_shorts` now reads
# `[-2CDlNuVv]` as the eight bundled boolean switches it is, and the
# correctness claim is back — so `verdict_scope` is recorded again.

[bless]
provenance = "agent-then-human"

[tool]
name = "tmux"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["tmux", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "BSD-terse"
# "[-2CDlNuVv]" is a bundle of 8 single-char boolean flags, and all eight
# are now their own flag. The listed seven are the ones the collapse used to
# destroy ("-2" survived it, carrying value_name='CDlNuVv'). The five
# value-taking short flags on the same physical line — -c, -f, -L, -S, -T —
# still carry their values, which is the property that makes this fixture a
# false-positive guard as well as a recall one.
must_contain_flags = ["-C", "-D", "-l", "-N", "-u", "-V", "-v"]
verdict_scope = ["flags", "subcommands"]
