# `git archive -h` (exit 129), stored as a root capture so the contract can read its flags.
[bless]
provenance = "agent"

[tool]
name = "git-archive"
version = "2.43.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.3"

[[capture]]
argv = ["git-archive", "--help"]
stdout = "help.txt"
exit_code = 129

[contract]
expected_framework = "generic"
min_status = "ok"
must_contain_flags = ["--list", "--format", "-NUM"]
must_describe = { "-NUM" = "set compression level" }
