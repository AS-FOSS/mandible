# Excerpt of corpus/dmsetup/1.02.185 (the command table, trimmed).
# Raw: `[-n|--notable|--table {<table>|<table_file>}]` is two flags, `-n|--notable`
# and `--table` with a brace value. `stats <command> [<options>] [<device>...]`
# has an optional `<options>` operand ahead of the devices.
# `stats` keeps `[<options>]` (S-060).

[bless]
provenance = "agent"

[tool]
name = "dmsetup"
version = "1.02.185"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.1"

[[capture]]
argv = ["dmsetup", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
verdict_scope = ["flags", "subcommands"]

[contract.must_contain_flags_by_path]
create = ["--notable", "--table", "--major", "--uuid"]

[contract.must_keep_separate_by_path]
create = [["-n", "--table"], ["--notable", "--table"]]

[contract.must_contain_positionals_by_path]
stats = ["command", "options", "device..."]
