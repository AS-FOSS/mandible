# Same capture as corpus/dmsetup/1.02.185. Per-subcommand flags and operands
# of the one usage block. Still unfixed: create folds -n|--notable|--table
# {<table>|<table_file>} into one flag (an alias run followed by a value does
# not say which spelling takes it), and stats' [<options>] is read as the
# generic options placeholder, so it is no operand.

[bless]
provenance = "agent"

[tool]
name = "dmsetup"
version = "1.02.185"
platform = "ubuntu-24.04"
captured_with = "copied from corpus/dmsetup/1.02.185"

[[capture]]
argv = ["dmsetup", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"

[contract]
expected_framework = "generic"

[contract.must_contain_flags_by_path]
create = ["--major", "--minor", "--notable", "--table"]
resume = ["--addnodeonresume", "--addnodeoncreate"]

[contract.must_contain_positionals_by_path]
create = ["dev_name"]
remove = ["device..."]
suspend = ["device..."]
resume = ["device..."]
wipe_table = ["device..."]
rename = ["device", "new_name_or_uuid"]
