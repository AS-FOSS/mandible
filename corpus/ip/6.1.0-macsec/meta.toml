# `ip macsec help` prints twelve verb forms and a `where` legend of `NAME := text`
# lines. Each legend line describes the placeholder it names.

[bless]
provenance = "agent"

[tool]
name = "ip"
version = "6.1.0-macsec"
platform = "ubuntu-24.04"
captured_with = "mandible 0.9.0"

[[capture]]
argv = ["ip", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 255

[[capture]]
argv = ["ip", "macsec", "--help"]
stdout = "macsec-flag.txt"
stderr = "macsec-flag.stderr.txt"
exit_code = 255

[[capture]]
argv = ["ip", "macsec", "help"]
stdout = "macsec-help.txt"
stderr = "macsec-help.stderr.txt"
exit_code = 255

[contract]
expected_framework = "generic"
min_subcommands = 30

[contract.must_contain_positionals_by_path]
macsec = ["OPTS", "ID", "KEY", "SCI", "SALT"]
"macsec add" = ["DEV"]

[contract.must_describe_positional_by_path]
macsec = { OPTS = "[ pn <u32> | xpn <u64> ] [ salt SALT ] [ ssci <u32> ] [ on | off ]", ID = "128-bit hex string", KEY = "128-bit or 256-bit hex string", SCI = "{ sci <u64> | port { 1..2^16-1 } address <lladdr> }", SALT = "96-bit hex string" }

[contract.must_not_describe_positional_by_path]
macsec = { OPTS = ":=", ID = ":=", KEY = ":=", SCI = ":=", SALT = ":=" }
