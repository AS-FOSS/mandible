[bless]
provenance = "agent"

[tool]
name = "ip"
version = "6.1.0-objects"
platform = "ubuntu-24.04"
captured_with = "mandible 0.4.2"

[[capture]]
argv = ["ip", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 255

[contract]
expected_framework = "generic"
min_subcommands = 30
must_not_contain_positionals = ["OBJECT"]
