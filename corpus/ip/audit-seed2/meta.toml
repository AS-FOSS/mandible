# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "wrong". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[bless]
provenance = "agent"

[tool]
name = "ip"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["ip", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 255

[contract]
expected_framework = "generic"
# `OPTIONS := { -V[ersion] | -s[tatistics] | -d[etails] | ... }` is one
# packed synopsis line, not a flag table — verified the current tree only
# recovers 8 of ip's ~24 documented options (h, f, 4, l, o, r, c, b), each
# with a mangled `value_name` bleeding text from the next `|`-separated
# alternative, and several — -V, -s, -d, -p, and others — are absent
# entirely. -V/-s/-d are picked here because no other currently-detected
# flag shares their first letter, so this genuinely tests their absence
# rather than coincidentally matching a mangled neighbor.
must_contain_flags = ["-V", "-s", "-d"]

[xfail]
broken = true
reason = "new formatting/framework where author kind of programmatically puts flag combinations into OPTIONS or OBJECT"
