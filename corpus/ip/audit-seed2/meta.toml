# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "wrong". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[bless]
provenance = "agent"

[tool]
name = "ip"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["ip", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 255

[contract]
expected_framework = "generic"
# `OPTIONS := { -V[ersion] | -s[tatistics] | -d[etails] | ... }` is one
# packed synopsis line, not a flag table — verified the current tree only
# recovers 8 of ip's ~24 documented options (h, f, 4, l, o, r, c, b), each
# with a mangled `value_name` bleeding text from the next `|`-separated
# alternative, and several — -V, -s, -d, -p, and others — are absent
# entirely. -V/-s/-d are picked here because no other currently-detected
# flag shares their first letter, so this genuinely tests their absence
# rather than coincidentally matching a mangled neighbor.
#
# Update (flags-on-heading-line fix): `-V` is now recovered — the
# heading/first-row line above is split by `split_shared_heading_row`'s
# new BNF-operator clause, same as `corpus/ip/6.1.0` — so this contract
# now fails on `-s`/`-d` only, still correctly `[xfail]`. `-s` and `-d`
# stay unrecovered by design: they are not the *first* token of their own
# physical line, only later members of `-V`'s `|`-alternation, and
# splitting an alternation into multiple flags is a different, explicitly
# out-of-scope family (the maintainer's `-l[oops]`-style note).
must_contain_flags = ["-V", "-s", "-d"]

[xfail]
broken = true
reason = "new formatting/framework where author kind of programmatically puts flag combinations into OPTIONS or OBJECT; -V is now recovered by the flags-on-heading-line fix, -s/-d remain because they are alternation members, not their own physical-line flag row"
