# Regression fixture for the invented-value half of the "ip -V[ersion]"
# defect this PR fixes. `ip`'s `OPTIONS := { -V[ersion] | -s[tatistics] |
# ... }` line spells each flag's abbreviation with the rest of the word it
# stands for in a trailing bracket. Before `grammar::
# strip_short_abbrev_suffix` existed, `try_value`'s `[VALUE]` arm read that
# bracket as a fabricated *optional value* — `-h[uman-readable]` came out
# as `-h` taking an optional value literally named `"uman-readable"`, a
# value `ip` does not document at all, on a flag that takes none. `-h`,
# `-f`, `-4`, `-l` and `-o` are the flags from this document that reach
# the parser as their own row and are now boolean, exactly as `ip`
# documents them. `-c[olor]}` (the block's very last alternative, with the
# `OPTIONS := { ... }` group's own closing `}` glued on with nothing
# between it and the bracket) is the same shape one step further:
# stripping `[olor]` used to leave the stray `}` to fall into the ordinary
# value grammar, so `-c` briefly went from a merely-doubtful
# `value_name: "olor"` (pre-fix) to an outright `value_name: "}"`,
# `Required` — caught by this fixture's own bless-and-review step, not by
# the fleet sweep. `strip_short_abbrev_suffix` now also drops stray
# trailing `}`/`)`/`]` immediately after the bracket it closes, and `-c`
# is boolean, exactly as `-a[ll]` one line above it in the same block.
#
# Honest residual, deliberately not claimed here: `-V`, `-s` and `-d`
# still never reach the flag list at all — a separate, already-tracked
# defect (see `corpus/ip/audit-seed2`, `[xfail]`: the multi-line
# `OPTIONS := { ... }` block's own *opening* physical line is consumed as
# heading text and never scanned for entries, dropping every flag written
# on it). This fixture does not assert their presence, and does not
# reopen or narrow that xfail. `-r` also still carries a mangled
# `value_name` from an unrelated defect (a two-letter abbreviation prefix,
# `-rc[vbuf]`/`-br[ief]`/`-ts[hort]`) — out of this fixture's scope for the
# same reason.

[bless]
provenance = "agent"

[tool]
name = "ip"
version = "6.1.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.4.1"

[[capture]]
argv = ["ip", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 255

[contract]
expected_framework = "generic"
min_status = "verbatim"
must_contain_flags = ["-h", "-f", "-4", "-l", "-o", "-c"]
