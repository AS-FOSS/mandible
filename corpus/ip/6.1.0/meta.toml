# Regression fixture for the invented-value half of the "ip -V[ersion]"
# defect this PR fixes. `ip`'s `OPTIONS := { -V[ersion] | -s[tatistics] |
# ... }` line spells each flag's abbreviation with the rest of the word it
# stands for in a trailing bracket. Before `grammar::
# strip_short_abbrev_suffix` existed, `try_value`'s `[VALUE]` arm read that
# bracket as a fabricated *optional value* — `-h[uman-readable]` came out
# as `-h` taking an optional value literally named `"uman-readable"`, a
# value `ip` does not document at all, on a flag that takes none. `-h`,
# `-f`, `-4`, `-l` and `-o` are the flags from this document that reach
# the parser as their own row and are now boolean, exactly as `ip`
# documents them. `-c[olor]}` (the block's very last alternative, with the
# `OPTIONS := { ... }` group's own closing `}` glued on with nothing
# between it and the bracket) is the same shape one step further:
# stripping `[olor]` used to leave the stray `}` to fall into the ordinary
# value grammar, so `-c` briefly went from a merely-doubtful
# `value_name: "olor"` (pre-fix) to an outright `value_name: "}"`,
# `Required` — caught by this fixture's own bless-and-review step, not by
# the fleet sweep. `strip_short_abbrev_suffix` now also drops stray
# trailing `}`/`)`/`]` immediately after the bracket it closes, and `-c`
# is boolean, exactly as `-a[ll]` one line above it in the same block.
#
# Update (flags-on-heading-line fix, `split_shared_heading_row` in
# `mandible-extract/src/help_text/sections.rs`): the residual noted below
# — `-V`, `-s` and `-d` never reaching the flag list — is now half fixed.
# `OPTIONS := { -V[ersion] | -s[tatistics] | -d[etails] | -r[esolve] |` is
# the block's *opening* physical line: its heading ("OPTIONS", stated as
# BNF via `:=`) and its first table row (`-V[ersion] | ...`) shared one
# physical line, and the section scanner promoted the whole line to a
# heading string, exactly the `uconv`/`zipinfo` defect
# `split_shared_heading_row` already existed to fix — except that
# function's clause 3 required a plain multi-space column gap right after
# the colon, and here the colon is immediately followed by `=` (`:=`),
# leaving a zero-space "gap" that clause never matched. Recognizing the
# BNF operator (and the `{` it may wrap its row in) as an alternative
# clause 3 now splits this line the same way, and `-V` is recovered as
# its own flag — every other flag in the block also gains a clean
# `group: "OPTIONS :"` instead of inheriting the entire swallowed line as
# their group text. `-s` and `-d` remain in `-V`'s own `description` text
# (`| -s[tatistics] | -d[etails] | -r[esolve] |`), not as separate flags:
# this document never puts more than one flag as the *start* of a
# physical line, and expanding a `|`-alternation into multiple flags is
# the `-l[oops]`-style family the maintainer explicitly held out of this
# fix (see the PR description). `corpus/ip/audit-seed2`'s `[xfail]` is
# updated by this same PR to reflect that `-V` is no longer among its
# missing flags, but stays `[xfail]` — `-s` and `-d` are still missing,
# by design.
#
# The rest of this fixture's original note still applies unchanged: `-r`
# still carries a mangled `value_name` from an unrelated defect (a
# two-letter abbreviation prefix, `-rc[vbuf]`/`-br[ief]`/`-ts[hort]`) —
# out of this fixture's scope.

[bless]
provenance = "agent"

[tool]
name = "ip"
version = "6.1.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.4.2"

[[capture]]
argv = ["ip", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 255

[contract]
expected_framework = "generic"
min_status = "verbatim"
must_contain_flags = ["-V", "-h", "-f", "-4", "-l", "-o", "-c"]
