# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "wrong". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[bless]
provenance = "agent"

[tool]
name = "jdeprscan"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["jdeprscan", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
# Lines with 3 alternate spellings ("-? -h --help") kept only 2 of 3 —
# not because the grammar dropped `-h` (it never did; `expected.snap` has
# always carried all three spellings on this entity), but because
# `xtask::corpus::flag_present` checked presence through
# `Entity::short`/`Entity::long`, which each return only the *first*
# short-shaped or long-shaped spelling on an entity. With spellings
# `[-?,  -h, --help]`, `Entity::short()` returned `'?'` and `-h` read as
# absent no matter how many times the check ran. Promoted once
# `flag_present` was fixed to search every spelling (round 7, the ffplay
# `-h, -?, -help, --help` adjacency fold) — the same accessor-only-
# returns-one gap that fold's own contract check hit.
#
# The other half was FIXED as of the aligned-spelling-column split: lines
# with 2 alternates ("-l    --list", "-v    --verbose") used to drop the
# long form entirely, keeping only the short. They now carry
# short='l'/long='list' and short='v'/long='verbose', so "--list" and
# "--verbose" below pass too.
must_contain_flags = ["-h", "--list", "--verbose"]
