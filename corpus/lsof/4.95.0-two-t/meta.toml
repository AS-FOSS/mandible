# Excerpt of corpus/lsof/4.95.0 (the options table through the -i row).
# Raw: `  -T disable TCP/TPI info` in the three-column table, and later in the
# same table `  -T fqs TCP/TPI Fl,Q,St (s) info`. The second row has a value
# and a description of its own, so it keeps both. S-031. A contract names a flag by spelling and
# resolves the first `-T`, so expected.snap pins the second row's description.

[bless]
provenance = "agent"

[tool]
name = "lsof"
version = "4.95.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.1"

[[capture]]
argv = ["lsof", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
must_contain_flags = ["-T", "-p", "-S", "-g"]

[contract.must_value_name]
"-T" = "fqs"

[contract.must_describe]
"-T" = "disable TCP/TPI info"
