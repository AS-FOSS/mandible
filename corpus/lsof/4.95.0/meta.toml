[tool]
name = "lsof"
version = "4.95.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.2.2"

# lsof's own option parser doesn't recognize long flags at all: `lsof
# --help` sees `--help` as a run of short options (`-h`, then `-e` wanting
# an argument, which it finds in the next characters, `lp`), prints two
# "illegal option"/"not followed by a file system path" errors to stderr,
# and then — because lsof always dumps its usage message on any option
# error — the *same* usage synopsis and options table `lsof -h` prints
# cleanly. Both streams are captured byte-exact, warts included: this is
# genuinely what `mandible`'s real probe (`InertArgv::HelpLongForPath`,
# always `--help` first) sends and receives, and the corpus's job is to be
# a truthful net for the real pipeline, not a tidied-up version of it.
# stdout is empty (lsof writes everything here to stderr); `help.txt`
# exists as a zero-byte file because `[[capture]]`'s `stdout` key is not
# optional.
[[capture]]
argv = ["lsof", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
# lsof's `--help`/`-h` output is hand-rolled C, not generated by any
# framework this project fingerprints.
expected_framework = "generic"
min_status = "ok"
min_subcommands = 0
# The regression this fixture exists to guard: lsof's usage synopsis wraps
# across three physical lines, but unlike git's hanging-indent wrap, every
# continuation line sits at *the same* column as the `usage:` marker
# itself (both indented by exactly one space). `f5f1183` joined wrapped
# usage lines using indentation alone ("more indented than the block's
# base indent continues the entry"), which read lsof's same-indent
# continuations as the block having already ended — silently dropping
# them, and every flag documented only in them, before they ever reached
# the usage-synopsis flag grammar. Measured (`xtask coverage --tools
# lsof`): 27 -> 21 flags, six lost.
#
# Most of what the continuation lines carry is *also* recovered from the
# two-column options table below by an independent route (its own row
# scanner, `Source::HelpText`), so dropping the continuations alone
# doesn't remove those from the merged, deduplicated tree — only the ones
# with no such row-scanner counterpart actually disappear. Checked against
# the real merged output (`expected.snap`, `provenance.sources`):
# `-L`/`-M`/`-o`/`-r`/`-S`/`-w` are exactly the six flags recovered *only*
# via `Source::HelpTextSynopsis` (the usage-block grammar) that also come
# from a continuation line rather than the marker line — matching the
# measured 27 -> 21 exactly — so this fails again if the continuation
# lines are ever dropped by a future change.
must_contain_flags = ["-L", "-M", "-o", "-r", "-S", "-w"]
