# Sibling of corpus/lsof/4.95.0 for the three-column option table.
# Raw: `-c c  cmd c ^c /c/[bix]  +c w  COMMAND width (9)    +d s  dir s files`,
# `-d s  select by FD set   +D D  dir D tree *SLOW?*   +|-e s  exempt s *RISKY*`,
# `-Z Z  context [Z] -- end option scan`, `-p s   exclude(^)|select PIDs`,
# `-S [t] t second stat timeout (15)` (column two of the -p row's line),
# `+m [m] use|create mount supplement` (first column empty, under the -L row).
# Each cell is its own entity with its own value placeholder (-c c, +c w, -K [i],
# -Z Z, -S [t]); `+X` cells and the bare `--` cell are cells like any other.
# -T, -i and -s each appear twice in the raw text with different meanings
# (-T disable vs -T fqs), so the doubled entities are real. The second -T row
# (`-T fqs TCP/TPI Fl,Q,St (s) info`) is a single-cell row read by the ordinary
# splitter, which keeps `fqs` and still drops the rest; no contract field can
# address the second entity of a repeated spelling.

[bless]
provenance = "agent"

[tool]
name = "lsof"
version = "4.95.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.1"

# Same bytes as corpus/lsof/4.95.0 (stdout empty, the table is on stderr).
[[capture]]
argv = ["lsof", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
must_contain_flags = ["+c", "+d", "+D", "+E", "+m", "--"]

[contract.must_value_name]
"+c" = "w"
"+d" = "s"
"+D" = "D"
"-S" = "t"
"-c" = "c"
"-d" = "s"
"-K" = "i"
"-Z" = "Z"

[contract.must_describe]
"+c" = "COMMAND width"
"+m" = "use|create mount supplement"
"-c" = "cmd c ^c /c/[bix]"
"-d" = "select by FD set"
"-Z" = "context [Z]"
"--" = "end option scan"
"-S" = "second stat timeout"

[contract.must_not_describe]
"-p" = "second stat timeout"
"-Z" = "end option scan"
"-c" = "c cmd"
