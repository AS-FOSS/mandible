# Sibling of corpus/lsof/4.95.0 for the three-column option table.
# Raw: `-c c  cmd c ^c /c/[bix]  +c w  COMMAND width (9)    +d s  dir s files`,
# `-d s  select by FD set   +D D  dir D tree *SLOW?*   +|-e s  exempt s *RISKY*`,
# `-Z Z  context [Z] -- end option scan`, `-p s   exclude(^)|select PIDs`,
# `-S [t] t second stat timeout (15)` (column two of the -p row's line),
# `-T fqs TCP/TPI Fl,Q,St (s) info`, `+m [m] use|create mount supplement`.
# v0.8.1 tree: -c reads its description as `c cmd c ^c /c/[bix]`, -d as
# `s select by FD set`, -K as `[i] list|(i)gn tasKs`, -Z as `Z context [Z] -- end option scan`
# (the `--` row folds into -Z; the `--` entity from the synopsis has no text),
# -p absorbs `-S [t] t second stat timeout (15)`, the second -T (fqs) has no description,
# and +c +d +D +E +m reach nothing. -T, -i and -s each appear twice in the raw
# text with different meanings (-T disable vs -T fqs), so the doubled entities are real.

[bless]
provenance = "agent"

[tool]
name = "lsof"
version = "4.95.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.1"

# Same bytes as corpus/lsof/4.95.0 (stdout empty, the table is on stderr).
[[capture]]
argv = ["lsof", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
must_contain_flags = ["+c", "+d", "+D", "+E", "+m", "--"]

[contract.must_value_name]
"-c" = "c"
"-d" = "s"
"-K" = "i"
"-Z" = "Z"

[contract.must_describe]
"-c" = "cmd c ^c /c/[bix]"
"-d" = "select by FD set"
"-Z" = "context [Z]"
"--" = "end option scan"
"-S" = "second stat timeout"

[contract.must_not_describe]
"-p" = "second stat timeout"
"-Z" = "end option scan"
"-c" = "c cmd"

[xfail]
broken = true
reason = "[S-036] in the packed multi-column rows a column whose cell starts with +, `--` or a bracketed placeholder is not recognised as a cell: +c, +d, +D, +E and +m are lost, `--` is folded into -Z's description, -S's cell lands in -p's description, and for -c, -d, -K and -Z the value placeholder stays in the description instead of value_name. A fix needs the column detector to count +X and `--` cells as flag-shaped (the +-led ones need S-086's sigil rule) and the placeholder split to run per cell; the second -T row (`-T fqs TCP/TPI Fl,Q,St (s) info`) also loses its description and no contract field can address the second entity of a repeated spelling."
