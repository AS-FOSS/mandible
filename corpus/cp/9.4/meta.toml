# From issue 102 item 2. The backup-control block's enclosing sentence
# literally names `--backup`, which is the case #99 already proves, so this
# fixture is the control for automake's unproven morphological variant.

[bless]
provenance = "agent"

[tool]
name = "cp"
version = "9.4"
platform = "ubuntu-24.04"
captured_with = "mandible 0.6.1"

[[capture]]
argv = ["cp", "--help"]
stdout = "help.txt"

[contract]
must_describe_root = ["Mandatory arguments to long options are mandatory for short options too."]

[contract.must_attach_choices]
"--backup" = ["none", "numbered", "existing", "simple"]

[xfail]
broken = true
reason = "[S-280] The sentence 'Mandatory arguments to long options are mandatory for short options too.' heads the option table and is dropped as a group label; it belongs at the end of the root description."
