[bless]
provenance = "agent"

[tool]
name = "curl"
version = "8.5.0"
platform = "ubuntu-24.04 (aarch64)"
captured_with = "mandible 0.2.2"

# The matched pair to `corpus/curl/8.5.0/` — same root 915-byte summary
# capture, same confession, but this fixture *also* captures the advertised
# `--help all` follow-up, so `HelpTextTier`'s confession-aware probe
# (spec §6 rule 2b) actually finds it in the transcript, follows it, and
# the tree ends up built from the full 258-flag document instead of the
# 12-flag summary. The contrast between the two fixtures is the point: the
# same tool, the same root bytes, `incomplete` when the expansion isn't
# available and `ok` when it is.
#
# `help-all.txt` is ~14.6 KiB — over corpus/README.md's few-KiB norm but
# comfortably under its 256 KiB justification threshold, and it earns its
# size: 258 flags is what makes this fixture stress column detection the
# way the README's own size-hygiene note calls out ("`curl --help all` is
# legitimate").
[[capture]]
argv = ["curl", "--help"]
stdout = "help.txt"
exit_code = 0

[[capture]]
argv = ["curl", "--help", "all"]
stdout = "help-all.txt"
exit_code = 0

[contract]
expected_framework = "generic"
min_status = "ok"
min_subcommands = 0
# A spread of flags from across the expanded document: early, middle and
# late in the file, so a regression that recovers only part of the 258-flag
# table (a column-detection bug that truncates) still fails this contract.
# The dotted names belong to the long name: `--http0.9`, `--tlsv1.3`.
must_contain_flags = [
    "--abstract-unix-socket",
    "--anyauth",
    "--capath",
    "--data",
    "--http0.9",
    "--http1.0",
    "--http1.1",
    "--fail",
    "--tlsv1",
    "--tlsv1.0",
    "--tlsv1.3",
    "--trace",
    "--variable",
    "--xattr",
]
must_draw = ["--http0.9 Allow HTTP 0.9 responses", "-0, --http1.0 Use HTTP 1.0", "-1, --tlsv1 Use TLSv1.0 or greater", "--tlsv1.3 Use TLSv1.3 or greater"]

[xfail]
broken = true
reason = "[S-274] a `.digits` run glued to a long name is read as the flag's value: `--http0.9` is `--http0` valued `.9`."
