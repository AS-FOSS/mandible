# From issue 102 item 1. `-C` and `-CC` are adjacent rows both described
# "[disabled]", a description repeated 505 times in this one document.
#
# Promoted: the real tree already keeps `-C` and `-CC` as two separate
# entities (`cargo run -p xtask -- corpus --show lto-dump/13.3.0`). The
# collapse this fixture reported was `entity_matches_flag_spec`'s own bug
# (`xtask/src/corpus/contract.rs`): a single-dash query used to match by
# its first letter alone, so `-C` and `-CC` always resolved to the same
# entity regardless of what the tree actually held. Fixed alongside
# docs/shapes.md S-116/S-118, which produce real multi-character
# single-dash spellings a first-letter-only query could never address.

[bless]
provenance = "agent"

[tool]
name = "lto-dump"
version = "13.3.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.6.1"

[[capture]]
argv = ["lto-dump", "--help"]
stdout = "help.txt"

[contract]
must_keep_separate = [["-C", "-CC"]]
