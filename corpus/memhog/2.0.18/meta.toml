# `memhog` ships in the `numactl` package (2.0.18-1ubuntu0.24.04.1 on this
# build); its `--help` exits 1 with everything on stdout, no blank line
# anywhere and no `usage:` label. Maintainer-audited: "yeah this one needs
# full revision". Fixed; see docs/shapes.md S-165 (the root-description
# swallow), S-175 (the fabricated placeholder), S-176 (the positional
# recovery), and S-172 for the already-shipped `-rNUM` guard this fixture
# also exercises.

[bless]
provenance = "agent"

[tool]
name = "memhog"
version = "2.0.18"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); numactl 2.0.18-1ubuntu0.24.04.1"

# memhog --help exits 1.
[[capture]]
argv = ["memhog", "--help"]
stdout = "help.txt"
exit_code = 1

[contract]
# `mandible --doctor memhog` reports framework: unidentified, so Tier A'
# found no fingerprint and the generic layout engine handled it.
expected_framework = "generic"

# Line 1's required positional, dropped entirely today.
must_contain_positionals = ["size"]

[contract.must_describe]
"-f" = "mmap is backed by FILE"
"-r" = "repeat memset NUM times"
"-H" = "disable transparent hugepages"

[contract.must_value_name]
"-f" = "FILE"
