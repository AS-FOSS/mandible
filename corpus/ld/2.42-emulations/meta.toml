[bless]
provenance = "agent"

[tool]
name = "ld"
version = "2.42"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.1"

# Excerpt of the 2.42 capture: the per-emulation headings
# (`aarch64linux:`, `aarch64elf:`, `aarch64elf32:`), each printing the same
# rows. A row after a flag's nested choice table (`full (default): ...`)
# stays under its heading (S-188).

[[capture]]
argv = ["ld", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
min_status = "ok"
must_contain_flags = ["--no-apply-dynamic-relocs", "--fix-cortex-a53-843419"]

[contract.must_one_row_in_group]
"aarch64linux:" = ["--no-apply-dynamic-relocs", "--fix-cortex-a53-843419"]
"aarch64elf:" = ["--no-apply-dynamic-relocs"]
"aarch64elf32:" = ["--no-apply-dynamic-relocs"]
