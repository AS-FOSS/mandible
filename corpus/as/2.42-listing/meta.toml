# Variant of corpus/as/2.42 (issue 102 item 5). The `=FILE` row closing the
# `-a[sub-option...]` table is the flag's value form, not a choice: its text
# stays with the flag's description.

[bless]
provenance = "agent"

[tool]
name = "as"
version = "2.42"
platform = "ubuntu-24.04"
captured_with = "mandible 0.6.1"

[[capture]]
argv = ["as", "--help"]
stdout = "help.txt"

[contract]
must_attach_choices = { "-a" = ["c", "s"] }

[contract.must_not_attach_choices]
"-a" = ["FILE"]

[contract.must_describe]
"-a" = "list to FILE (must be last sub-option)"

[xfail]
broken = true
reason = "the =FILE row of the -a sub-option table becomes a choice named FILE with no description; the = and the text are lost"
issue = "https://github.com/AS-FOSS/mandible/issues/102"
