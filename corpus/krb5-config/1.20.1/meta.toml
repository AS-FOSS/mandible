# Every option row is wrapped in brackets, `[--help]   Help`.

[bless]
provenance = "agent"

[tool]
name = "krb5-config"
version = "1.20.1"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.3"

[[capture]]
argv = ["krb5-config", "--help"]
stdout = "help.txt"

[contract]
min_status = "ok"
must_contain_flags = ["--help", "--all", "--libs", "--cflags"]
must_describe = { "--exec-prefix" = "Kerberos installed exec_prefix" }
