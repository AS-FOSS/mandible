# From issue 102 item 2 (choices-block ownership beyond literal matches).
# "Warning categories include:" belongs to `-W, --warnings=CATEGORY`: the
# heading names the plural of the flag's value placeholder (S-203).

[bless]
provenance = "agent"

[tool]
name = "automake"
version = "1.16.5"
platform = "ubuntu-24.04"
captured_with = "mandible 0.6.1"

[[capture]]
argv = ["automake", "--help"]
stdout = "help.txt"

[contract]

[contract.must_attach_choices]
"--warnings" = ["cross", "gnu", "obsolete", "override", "portability", "syntax"]

[contract.must_not_attach_choices]
"--force-missing" = ["cross", "gnu", "obsolete", "override", "portability", "syntax"]
