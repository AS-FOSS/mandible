[bless]
provenance = "agent"

[tool]
name = "mksquashfs"
version = "4.6.1"
platform = "ubuntu-24.04 (aarch64)"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8)"

# mksquashfs writes its whole response to stderr; stdout is empty. `help.txt`
# is committed empty (corpus/README.md's own convention, matching
# corpus/jinfo/17.0.20) rather than omitted, since `[[capture]].stdout` is a
# required field.
[[capture]]
argv = ["mksquashfs", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
min_status = "ok"
# The defect, stated positively: these ten rows should each be their own
# single-dash spelling. Today they are not, so this fails until fixed.
must_contain_flags = [
  "-noI", "-noId", "-noD", "-noF", "-noX",
  "-noInodeCompression", "-noIdTableCompression", "-noDataCompression",
  "-noFragmentCompression", "-noXattrCompression",
]
# The defect, stated negatively: all ten collapse onto short `-n` today.
must_not_contain_flags = ["-n"]

[xfail]
broken = true
reason = "-noI, -noId, -noD, -noF, -noX and their five -no*Compression aliases truncate to short -n with a swallowed value; repair_single_dash_long_options refuses any reconstructed token carrying an uppercase letter, its only signal against the GCC/Clang glued-value convention (-DMACRO)"

# glued-uppercase-shared-prefix (xtask/src/detector/glued_uppercase_shared_prefix.rs,
# atlas S-139): a candidate discriminator (a swallowed name sharing its
# lowercase-led prefix with a sibling row in the same table) was measured on
# a full-PATH sweep, 2026-09-06. It moved 2 tools, mksquashfs and sqfstar,
# zero losses, with the gcc/clang/g++ glued-value convention staying
# byte-identical. Below the five-tool floor AGENTS.md §3.1 requires. Not
# shipped; the fixture stays xfail with the count here. No labelled member
# of this family exists in any audit seed, so the detector's recall is not
# calibratable; its four self-checks are the only standing evidence.
