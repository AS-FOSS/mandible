[bless]
provenance = "agent"

[tool]
name = "mksquashfs"
version = "4.6.1"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); squashfs-tools 4.6.1-1build1"

# mksquashfs writes its whole response to stderr and stdout is empty.
# `help.txt` is committed empty, the shape `corpus/jinfo/17.0.20` uses,
# since `[[capture]].stdout` is a required field.
[[capture]]
argv = ["mksquashfs", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
# Ten rows the tool writes as single-dash long options, each its own
# spelling, and the short `-n` it never documents (docs/shapes.md S-139).
# Both pass now.
must_contain_flags = [
  "-noI", "-noId", "-noD", "-noF", "-noX",
  "-noInodeCompression", "-noIdTableCompression", "-noDataCompression",
  "-noFragmentCompression", "-noXattrCompression",
]
must_not_contain_flags = ["-n"]
# The operand the unread synopsis holds (docs/shapes.md S-142). Fails.
must_contain_positionals = ["FILESYSTEM"]

[xfail]
broken = true
reason = "S-139 is fixed and its two assertions pass. S-142 is open: SYNTAX: glued to the program name with no space is never recognized as a usage marker, so the two-line synopsis is read as description prose and no positional is recovered from it. Measured 2 genuine tools for the glued label and 1 for the open-bracket continuation at column zero, both below the five-tool bar, so nothing ships for it."
