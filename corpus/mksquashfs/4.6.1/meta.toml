[bless]
provenance = "agent"

[tool]
name = "mksquashfs"
version = "4.6.1"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); squashfs-tools 4.6.1-1build1"

# mksquashfs writes its whole response to stderr and stdout is empty.
# `help.txt` is committed empty, the shape `corpus/jinfo/17.0.20` uses,
# since `[[capture]].stdout` is a required field.
[[capture]]
argv = ["mksquashfs", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 1

[contract]
expected_framework = "generic"
# Ten rows the tool writes as single-dash long options, each its own
# spelling, and the short `-n` it never documents (docs/shapes.md S-139,
# folded into the table rule S-145). The single-dash-long table rule's
# own targets: `-pf`/`-ef` (S-139's length floor refused their
# one-character swallowed tail) and `-Xhelp`/`-Xstrategy`/`-Xhc`/`-Xbcj`
# (S-117's case gate refused their uppercase-led name). All pass now.
must_contain_flags = [
  "-noI", "-noId", "-noD", "-noF", "-noX",
  "-noInodeCompression", "-noIdTableCompression", "-noDataCompression",
  "-noFragmentCompression", "-noXattrCompression",
  "-pf", "-ef", "-Xhelp", "-Xstrategy", "-Xhc", "-Xbcj",
]
must_not_contain_flags = ["-n"]
# [S-142] FILESYSTEM, once the glued `SYNTAX:` label and the column-zero
# open-bracket continuation are both read. [S-171] source, the numbered
# `source1 source2 ...` pair ahead of FILESYSTEM that
# `recover_primary_tail_operands` (S-136) never reaches, since its own
# tail-only path only runs when the per-line loop found nothing at all.
must_contain_positionals = ["source", "FILESYSTEM"]
must_usage_forms_min = 1

# Tab-separated value placeholders the table rule keeps (docs/shapes.md
# S-145): `-b <block_size>`'s own kind, now also read off a swallowed
# single-dash long spelling instead of dropped.
[contract.must_value_name]
"-mem" = "<size>"
"-comp" = "<comp>"
"-mkfs-time" = "<time>"

# One row under each of the ten `Xxx options:` headings, and one under
# each of the five compressor sub-labels, gzip included in source order
# (docs/shapes.md S-146).
[contract.must_flag_group]
"-noI" = "Filesystem compression options:"
"-tar" = "Filesystem build options:"
"-pf" = "Filesystem filter options:"
"-no-xattrs" = "Filesystem extended attribute (xattrs) options:"
"-quiet" = "Mksquashfs runtime options:"
"-noappend" = "Filesystem append options:"
"-action" = "Filesystem actions options:"
"-ignore-zeros" = "Tar file only options:"
"-nopad" = "Expert options (these may make the filesystem unmountable):"
"-Xhelp" = "Miscellaneous options:"
"-Xwindow-size" = "gzip (default)"
"-Xalgorithm" = "lzo"
"-Xhc" = "lz4"
"-Xbcj" = "xz"
"-Xcompression-level" = "zstd"
