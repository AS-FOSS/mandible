[bless]
provenance = "agent"

[tool]
name = "python3"
version = "3.12"
platform = "ubuntu-24.04 (aarch64)"
captured_with = "mandible 0.9.0 --report"

[[capture]]
argv = ["python3", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
must_contain_flags = ["-b", "-B", "-c", "-m"]
must_not_describe_root = ["Options (and corresponding", "issue warnings about converting"]

[contract.must_flag_group]
"-b" = "Options (and corresponding environment variables):"

[xfail]
broken = true
reason = "[S-282] The flag block under 'Options (and corresponding environment variables):' is read a second time as the root description; python prints no description."
