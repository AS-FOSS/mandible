# jarsigner prints every option as a bracketed row, `[-keystore <url>]   keystore
# location`, one per paragraph. Only -verify (from the usage form) reaches the tree.

[bless]
provenance = "agent"

[tool]
name = "jarsigner"
version = "21.0.12"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.3"

[[capture]]
argv = ["jarsigner", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
must_contain_flags = ["-keystore", "-storepass", "-sigfile", "-signedjar", "-tsa", "-providerArg", "-verbose", "-certs", "-conf"]
must_describe = { "-keystore" = "keystore location", "-sigfile" = "name of .SF/.DSA file", "-providerArg" = "configure argument for -providerClass" }
must_not_describe = { "-addprovider" = "providerArg", "-providerClass" = "providerArg" }

[xfail]
broken = true
reason = "[S-248] the nested `[-providerArg <arg>]` line stays inside the descriptions of -addprovider and -providerClass instead of being its own flag row"
