# snap's root help is a compact "Group: a, b, c" summary and ends "For a short summary of
# all commands, run 'snap help --all'"; `snap help --all` is the full command list
# (docs/shapes.md S-214).

[bless]
provenance = "agent"

[tool]
name = "snap"
version = "2.77.1"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8)"

[[capture]]
argv = ["snap", "--help"]
stdout = "help.txt"

[[capture]]
argv = ["snap", "help", "--all"]
stdout = "help-all.txt"

[contract]
expected_framework = "generic"
min_subcommands = 67

