[bless]
provenance = "agent"

[tool]
name = "cd"
version = "user"
platform = "maintainer"
captured_with = "mandible 0.8.3"

[[capture]]
argv = ["cd", "--help"]
stdout = "help.txt"
exit_code = 0


[contract]
min_status = "low-confidence"
must_contain_positionals = ["dir"]
must_contain_flags = ["-L", "-P", "-e", "-@"]
must_describe_root = [
    "Change the shell working directory.",
    "The variable CDPATH defines the search path",
    "The default is to follow symbolic links, as if `-L' were specified.",
    "back to a slash or the beginning of DIR.\n\nExit Status:",
]
