[bless]
provenance = "agent"

[tool]
name = "find"
version = "4.9.0-prose"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2"

[[capture]]
argv = ["find", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
must_describe_root = ["Default path is the current directory; default expression is -print."]

[xfail]
broken = true
reason = "prose after the usage block and a blank line (before the first heading) is dropped from the root description; relocated by the root-description rule (r18 item 10e)"
