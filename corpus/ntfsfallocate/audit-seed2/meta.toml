# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "correct", amended to "incomplete" in
# post-review reconciliation (see audit/2.toml). See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[tool]
name = "ntfsfallocate"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["ntfsfallocate", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"

[contract]
# SCOPE OF REVIEW: see corpus/README.md's "verdict_scope" section --
# this fixture was promoted from the seed-2 audit, whose "correct"
# verdict covers exactly the dimensions verdict_scope lists below, never
# prose. expected.snap freezes descriptions too, but they were not part
# of that review.
verdict_scope = ["flags", "subcommands"]
expected_framework = "generic"
min_status = "ok"
min_subcommands = 0
# "vv" is bare, so it matches `Flag::long` exactly: the repaired shape
# of the "-vv  Very verbose execution" row, which used to parse as
# short='v' carrying a required value "v" and lost the flag entirely.
must_contain_flags = ["-f", "-n", "-l", "-o", "-v", "vv"]
