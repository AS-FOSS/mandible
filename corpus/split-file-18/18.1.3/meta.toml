# The capitalized-contraction specimen for `find_dash_token_separator_gap`
# (the `ar --target=BFDNAME`/`--output=DIRNAME` description-loss fix,
# landed alongside the argfile sigil flag, spec issue #93's PR).
#
# `--no-leading-lines - Don't preserve line numbers (default)` is the same
# underlying defect shape as `ar`'s own rows — a single-space `-`-separated
# description with no aligned column, no `=`/`:` token, and no bracketed
# placeholder — but it exercises a wrinkle none of the `ar`-family fixtures
# do: the description starts with a *capitalized* word ("Don't"), so
# `find_sentence_start_gap`'s existing fallback looks like it should already
# catch this. It doesn't: `starts_a_sentence` requires every character after
# the first to be plain ASCII lowercase, and the apostrophe in "Don't" fails
# that check, so this row fell through exactly the same ungapped path the
# `ar` rows did, for a different reason. Without this fixture, that specific
# wrinkle is guarded by nothing — a regression that broke it would move no
# `ar`-family snapshot and pass every existing test.
#
# No schema field here asserts a flag's *description text* directly (only
# presence — `must_contain_flags` and its siblings). `--no-leading-lines`'s
# recovered description is therefore pinned by `expected.snap` alone,
# descriptive rather than normative — the same gap
# `must_contain_positionals`'s own doc comment in `xtask/src/corpus.rs`
# names for `corpus/javaflow-bpfcc/audit-seed2`, recorded here rather than
# silently worked around.

[bless]
provenance = "agent"

[tool]
name = "split-file-18"
version = "18.1.3"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8)"

[[capture]]
argv = ["split-file-18", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
must_contain_flags = ["--leading-lines", "--no-leading-lines", "--help", "--version"]
