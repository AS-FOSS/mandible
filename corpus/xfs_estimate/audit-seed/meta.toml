[bless]
provenance = "agent"

[tool]
name = "xfs_estimate"
version = "audit-seed"
platform = "ubuntu-24.04"
captured_with = "probe environment, setsid, null stdin"

[[capture]]
argv = ["xfs_estimate", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
must_draw = ["-b blocksize (fundamental filesystem blocksize)", "-v prints more verbose messages"]
must_contain_flags = ["-v", "-V", "-h"]

[contract.must_not_value_name]
"-v" = "prints more verbose messages"

[contract.must_describe]
"-b" = "(fundamental filesystem blocksize)"
"-v" = "prints more verbose messages"
"-h" = "prints this usage message"

[contract.must_value_name]
"-b" = "blocksize"
"-i" = "logsize"
"-e" = "logsize"

[xfail]
broken = true
reason = "[S-262] a one-space row keeps its first word as the value and drops the rest; the sentence after one space is the description"
