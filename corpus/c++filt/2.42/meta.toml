# Every option row is wrapped in brackets, `[-p|--no-params]   desc`; one row mistypes
# its opener as `]-r|...]` and one has no description.

[bless]
provenance = "agent"

[tool]
name = "c++filt"
version = "2.42"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.3"

[[capture]]
argv = ["c++filt", "--help"]
stdout = "help.txt"

[contract]
min_status = "ok"
must_contain_flags = ["--strip-underscore", "--no-recurse-limit", "--format", "--version", "@"]
must_describe = { "--no-recurse-limit" = "Disable a limit on recursion whilst demangling" }
