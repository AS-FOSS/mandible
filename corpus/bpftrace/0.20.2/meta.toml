# The first specimen of the environment-section recognizer: a wide
# column-gap separator under an explicit `ENVIRONMENT:` heading, and the
# type specimen the `in_ignorable_section` guard in `sections/mod.rs`
# exists for — this tool's own `EXAMPLES:` block writes each example as
# "the tool's own name, then a bare flag token, then a one-line
# description", the identical shape to a real stanza head, and without
# that guard it fabricated flags from the example invocations.

[bless]
provenance = "agent"

[tool]
name = "bpftrace"
version = "0.20.2"
platform = "ubuntu-24.04"
captured_with = "xtask audit"

[[capture]]
argv = ["bpftrace", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 0

[contract]
expected_framework = "generic"
# The whole `ENVIRONMENT:` table, all seventeen rows.
must_contain_env_vars = [
    "BPFTRACE_BTF", "BPFTRACE_CACHE_USER_SYMBOLS", "BPFTRACE_CPP_DEMANGLE",
    "BPFTRACE_DEBUG_OUTPUT", "BPFTRACE_KERNEL_BUILD", "BPFTRACE_KERNEL_SOURCE",
    "BPFTRACE_LOG_SIZE", "BPFTRACE_MAX_BPF_PROGS", "BPFTRACE_MAX_CAT_BYTES",
    "BPFTRACE_MAX_MAP_KEYS", "BPFTRACE_MAX_PROBES", "BPFTRACE_MAX_STRLEN",
    "BPFTRACE_MAX_TYPE_RES_ITERATIONS", "BPFTRACE_PERF_RB_PAGES",
    "BPFTRACE_STACK_MODE", "BPFTRACE_STR_TRUNC_TRAILER", "BPFTRACE_VMLINUX",
]
# The regression guard beside the fixture's own subject: the `OPTIONS:` and
# `TROUBLESHOOTING OPTIONS:` blocks above the environment section, plus one
# flag from each. If a future change to `in_ignorable_section` or to the
# environment-heading recognizer's placement in `parse_body` ever let the
# `EXAMPLES:` block below the environment section leak flags again, or let
# the environment section swallow the real flags above it, this is what
# would catch it.
must_contain_flags = ["--help", "--unsafe", "--emit-elf", "--emit-llvm"]
