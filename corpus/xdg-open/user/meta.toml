[bless]
provenance = "agent"

[tool]
name = "xdg-open"
version = "user"
platform = "maintainer"
captured_with = "mandible 0.8.3"

[[capture]]
argv = ["xdg-open", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
must_contain_flags = ["--help", "--manual", "--version"]
must_contain_positionals = ["file", "URL"]
must_describe_root = ["opens a file or URL in the user's preferred application"]
must_not_describe_root = ["Synopsis"]

[xfail]
broken = true
reason = "the root description reads \"Synopsis\" (a heading word at column 0) while the real one, the indented lead lines before it, is dropped (r18 item 10b)"
