[bless]
provenance = "agent"

[tool]
name = "jstack"
version = "17"
platform = "ubuntu-24.04"
captured_with = "mandible 0.9.0"

[[capture]]
argv = ["jstack", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
min_status = "ok"
must_contain_flags = ["-l", "-e", "-?", "-h", "--help", "-help"]
must_describe = { "-help" = "to print this help message" }
must_not_describe = { "-?" = "-help" }

[xfail]
broken = true
reason = "[S-190] The row `-? -h --help -help to print this help message` is one flag with four spellings. The same row with spaces for pipes; the run of spellings stops before `-help`, which stays in the description. A fix keeps the whole run when the spellings are separated by single spaces and the run is followed by prose, and starts the description at `to print`."
