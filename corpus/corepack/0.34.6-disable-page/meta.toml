# The text of `corepack disable --help` (ANSI escapes included, as the tool
# prints it with no TTY), fed as the only capture so the subcommand page's
# own parse is pinned before probing reaches it (see 0.34.6-subcommands).
# The recorded argv is the root's, so the replay serves the page; the real
# argv is `corepack disable --help`.

[bless]
provenance = "agent"

[tool]
name = "corepack"
version = "0.34.6-disable-page"
platform = "ubuntu-24.04"
captured_with = "probe environment, null stdin, no TTY, ANSI kept"

[[capture]]
argv = ["corepack", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
must_contain_flags = ["--install-directory"]

[contract.must_describe]
"--install-directory" = "Where the shims are located"

[contract.must_flag_group]
"--install-directory" = ""
