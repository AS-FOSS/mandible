[bless]
provenance = "agent"

[tool]
name = "corepack"
version = "0.34.6"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8)"

[[capture]]
argv = ["corepack", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
must_not_contain_positionals = ["disable"]
min_subcommands = 6
must_not_contain_flags = ["--install-directory"]
must_not_contain_usage_text = ["Remove the Corepack shims"]
must_not_describe_root = ["Remove the Corepack shims"]

[xfail]
broken = true
reason = "the first command row (`corepack disable [--install-directory #0] ...`) is taken as the usage form: its description is folded into usage, `disable` is missing from the subcommands, and the row's flag becomes a root flag"
