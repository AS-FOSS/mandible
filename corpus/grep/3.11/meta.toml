# The lead description holds an `Example: grep ...` row. It belongs to the node's
# examples, not to its prose.
[bless]
provenance = "agent"

[tool]
name = "grep"
version = "3.11"
platform = "ubuntu-24.04 (aarch64)"
captured_with = "grep --help"

[[capture]]
argv = ["grep", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
must_contain_flags = ["--regexp", "--ignore-case", "--recursive"]
