[bless]
provenance = "agent"

[tool]
name = "msgexec"
version = "audit-seed"
platform = "ubuntu-24.04"
captured_with = "mandible --report, setsid, null stdin"

[[capture]]
argv = ["msgexec", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
must_contain_positionals = ["COMMAND", "COMMAND-OPTION"]

[xfail]
broken = true
reason = "The usage operand [COMMAND-OPTION], which extends the COMMAND placeholder before it, is dropped as if it were the OPTION placeholder; it must be an operand."
