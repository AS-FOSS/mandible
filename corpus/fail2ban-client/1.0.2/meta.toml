[bless]
provenance = "agent"

[tool]
name = "fail2ban-client"
version = "1.0.2"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); Fail2Ban v1.0.2"

[[capture]]
argv = ["fail2ban-client", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
must_not_contain_flags = ["--with-time"]

[xfail]
broken = true
reason = "1. A description continuation line that begins with a dash is read as a flag row. Line 229 ends with ' and line 230 begins with --with-time' at the description column, so the tree carries a flag --with-time valued ', and the row above it is promoted to a section heading. No root flag group starts with Get <JAIL>. 2. The Command: section holds 95 rows of multi-word command patterns (set loglevel <LEVEL>, get <JAIL> banip [<SEP>|--with-time], reload [--restart] [--unban] <JAIL>) under ten centered ALL-CAPS group labels (BASIC, LOGGING, DATABASE, JAIL CONTROL and six more). emit_subcommands now reads a command-pattern row's leading word as the name and the rest as a usage line, and try_push_subcommand merges a repeated leading word's own usage onto one node instead of dropping every row past the first, moving 7 tools fleet-wide (busctl, hostnamectl, localectl, networkctl, resolvectl, timedatectl and one more) with zero sweep-diff losses. This fixture stays blocked: bare_block_end sets a bare-word block's baseline indent from its own first line, and each group label sits far deeper than the rows beneath it, so a block opening on BASIC/LOGGING/etc. ends before reaching a single real row. That defect, and paragraph 1's, both still block every row here. The command-pattern-table detector (atlas S-141, xtask/src/command_pattern_table.rs) counts 11 tools/124 rows on a full-PATH sweep after the fix."
