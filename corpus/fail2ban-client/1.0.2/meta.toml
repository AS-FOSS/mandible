[bless]
provenance = "agent"

[tool]
name = "fail2ban-client"
version = "1.0.2"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); Fail2Ban v1.0.2"

[[capture]]
argv = ["fail2ban-client", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
must_not_contain_flags = ["--with-time"]
min_subcommands = 14
# docs/shapes.md S-141: round 8's nine fabricated command names, cut from
# wrapped description lines by the old per-token name rule. None may ever
# reappear.
must_not_contain_subcommands = [
    "logtarget", "persistent", "of", "list", "files",
    "filter", "for", "back", "failures",
]
