[bless]
provenance = "agent"

[tool]
name = "lvmdump"
version = "audit-seed"
platform = "ubuntu-24.04"
captured_with = "probe environment, setsid, null stdin"

[[capture]]
argv = ["lvmdump", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
must_contain_flags = ["-h", "-a"]

[contract.must_not_value_name]
"-h" = "print this message"
