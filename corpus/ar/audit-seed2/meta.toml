# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "wrong". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.
#
# Maintainer: "-M is fine". Maintainer, reading the raw usage line: "I see
# much more that was not parsed: ar [emulation options] [-]{dmpqrstx}
# [abcDfilMNoOPsSTuvV] [--plugin <name>] [member-name] [count] archive-file
# file...". Machine classification: the operation letters d/m/p/q/r/s/t/x
# are subcommand nodes from the ` commands:` section, the modifier letters
# are Modifier entities from ` command specific modifiers:`, and --plugin
# is a flag, and all three already reach the tree. What is missing is the
# first usage line's four trailing operands: member-name, count,
# archive-file, file. Family: multi-operand usage tail, because the
# tail-operand repair recovers one trailing operand only.
#
# The fixture was flipped to xfail to record that gap and is promoted again
# now that all four operands reach the tree. The second usage line spells
# the tool as a full path, so it used to join the first line and hide the
# operands behind it; both forms are separate entries in the snapshot now.

[bless]
provenance = "agent"

[tool]
name = "ar"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["ar", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
# Promoted: the ` commands:` table now reaches the tree in full. All 8
# binutils operation letters (d/m/p/q/r/s/t/x) are recovered — the five
# spelled with bracketed modifier groups (`m[ab]`, `q[f]`, `r[ab][f][u]`,
# `t[O][v]`, `x[o]`) name the command before the brackets. 8 is the real
# count, not a conservative floor.
min_subcommands = 8
# The four long flags in ` generic modifiers:` plus ` optional:`'s
# `--plugin`. These are pinned because recovering the command table nearly
# cost them: that section opens with eight `[c]`/`[l <text> ]`/`@<file>`
# rows before its first `--`-led row, and while the whole block was being
# swallowed into the usage string they survived only because the usage
# block happened to end exactly at `--target`. They are the regression
# this fixture exists to catch.
must_contain_flags = ["--target", "--output", "--record-libdeps", "--thin", "--plugin"]
# Both modifier tables in full: ten under ` command specific modifiers:`
# and seven under ` generic modifiers:`. Case is significant — this tool
# documents `[D]` and `[U]` beside `[d]`/`[u]` as different things. Before
# modifiers were a kind, every one of these rows was dropped: the first
# table's heading contains the word "command", so its rows went to the
# subcommand path and failed the name-shape test one by one.
must_contain_modifiers = [
    "a", "b", "D", "U", "N", "f", "P", "o", "O", "u",
    "c", "s", "l", "S", "T", "v", "V",
]
# The first usage line's four trailing operands, dropped entirely. See the
# header comment above.
must_contain_positionals = ["member-name", "count", "archive-file", "file"]
