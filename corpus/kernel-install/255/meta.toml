[bless]
provenance = "agent"

[tool]
name = "kernel-install"
version = "255"
platform = "ubuntu-24.04 (aarch64)"
captured_with = "mandible 0.9.0 --report"

[[capture]]
argv = ["kernel-install", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
min_subcommands = 5
must_describe_root = ["Add and remove kernel and initrd images to and from /boot/"]
must_not_contain_positionals = ["KERNEL-VERSION", "KERNEL-IMAGE", "INITRD"]
must_not_contain_usage_text = ["Add and remove kernel"]

[contract.must_contain_positionals_by_path]
add = ["KERNEL-VERSION", "KERNEL-IMAGE", "INITRD..."]
inspect = ["KERNEL-VERSION", "KERNEL-IMAGE", "INITRD..."]
remove = ["KERNEL-VERSION"]

[contract.must_not_contain_positionals_by_path]
add-all = ["KERNEL-VERSION"]
list = ["KERNEL-VERSION"]

[xfail]
broken = true
reason = "[S-283] Verbs named after [OPTIONS...] in the usage forms (add, add-all, remove, inspect, list) are not read as commands; the description sentence is read as usage and the verbs' operands land on the root."
