[tool]
name = "opensnoop.bt"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["opensnoop.bt", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"

[contract]
expected_framework = "generic"
# Same bpftrace-delegated help text as killsnoop.bt (byte-identical
# OPTIONS and TROUBLESHOOTING OPTIONS blocks). "-vv"/"-dd"/"-kk" used to
# parse as short='v'/value_name='v' and so on — the second letter read as
# a spurious required value instead of as part of the flag's own spelling,
# which is what the [xfail] this fixture carried was about. They are now
# whole single-dash long options: long=="vv", single_dash==true, no value.
# The bare specs below match `Flag::long` exactly (unlike a "-vv"-style
# spec, which would only check the first character and spuriously match
# the real, separate "-v"/"-d" flags). "-v"/"-d"/"-k" are asserted
# alongside them because the repair must not consume the boolean it reads
# as its evidence.
must_contain_flags = ["vv", "dd", "kk", "-v", "-d", "-k"]

