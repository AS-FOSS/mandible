# Generated by hand from `audit/queue-captures/uconv/0.stdout` (the frozen
# seed-5 capture), for the defect that seed's reviewer reported against this
# tool: "since the flag '-h' was in front of 'Options:' it got swallowed
# into the section header" (`audit/submissions/sadigaxund/5.toml`, verdict "wrong").

[bless]
provenance = "agent"

[tool]
name = "uconv"
version = "audit-seed5"
platform = "ubuntu-24.04"
captured_with = "xtask audit"

[[capture]]
argv = ["uconv", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
# Deliberately thin, because the defect this fixture exists for has no
# `[contract]` field that can express it and saying so beats asserting
# something else. `--help` was in the tree before the fix too — recovered
# from the usage synopsis, with no description and
# `sources: [help-text-synopsis]` — so `must_contain_flags = ["--help"]`
# would have passed on the broken parse. What changed is *which* row it came
# from, and that lives only in `expected.snap`: the first entry there is now
# `short: 'h' / long: help / description: print this message /
# sources: [help-text]`, recovered from the option-table row that shares
# `uconv`'s physical `Options:` line, and no flag in the file carries a
# `group:` any more (every one used to carry the whole line
# `Options:  -h, --help                    print this message`).
must_contain_flags = ["--help"]
