# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "correct". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[tool]
name = "tclsh"
version = "audit-seed2"
captured_with = "xtask audit"

# `xtask audit fixtures` only ever records the *winning* probe
# (`RecordingProbe::root_help_capture`, xtask/src/misattribution.rs) — the
# one Tier B's fallback chain actually returned text from. For tclsh,
# `--help` produces nothing on this box (verified live: `tclsh --help`,
# exit 0, empty stdout+stderr), so Tier B falls through to `-h`, which is
# *also* empty and is what got captured as "help.txt" below. But replaying
# only the `-h` entry leaves the `--help` probe unanswered in the
# Transcript, which the replay pipeline treats as a hard probe failure
# rather than "tried, got nothing" — short-circuiting before it ever
# reaches the `-h` fallback and producing no root at all, unlike the live
# run this fixture is supposed to freeze. Added below, independently
# reverified live, not guessed.
[[capture]]
argv = ["tclsh", "--help"]
stdout = "help-long.txt"

[[capture]]
argv = ["tclsh", "-h"]
stdout = "help.txt"

[contract]
# SCOPE OF REVIEW: see corpus/README.md's "verdict_scope" section --
# this fixture was promoted from the seed-2 audit, whose "correct"
# verdict covers exactly the dimensions verdict_scope lists below, never
# prose. expected.snap freezes descriptions too, but they were not part
# of that review.
verdict_scope = ["flags", "subcommands"]
expected_framework = "generic"
min_status = "ok"
min_subcommands = 0
