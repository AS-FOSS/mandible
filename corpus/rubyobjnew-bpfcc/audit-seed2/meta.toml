# The reviewer's OWN finding, assertable at last: `pid` and `interval` are
# listed under argparse's `positional arguments:` heading and were dropped
# entirely. Repaired by `unparsed-positional` — the framework's declared
# block is now read for names and descriptions, with the synopsis consulted
# only for `[interval]`'s optionality. This fixture is the two-member
# evidence that the block rule is a shape and not one tool: javaflow-bpfcc
# carries the identical assertion for its own single `pid`, from a
# different bcc tool's independently generated help.
must_contain_positionals = ["pid", "interval"]
