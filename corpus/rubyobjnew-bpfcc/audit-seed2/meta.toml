[bless]
provenance = "agent"

[tool]
name = "rubyobjnew-bpfcc"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["rubyobjnew-bpfcc", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "argparse"
# Same same-line-long-form-drop defect as javaflow-bpfcc's identical
# argparse style: "-l {c,java,ruby,tcl}, --language {...}" becomes
# short='l' only, garbled value_name with trailing comma. --language/
# --top-count/--top-size were all absent until `dropped-alias` was fixed.
