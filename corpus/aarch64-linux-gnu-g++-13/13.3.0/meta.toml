# Maintainer, seed 7, verdict "incomplete": "1. See flags like this: -Wa,
# <options>, -Wp, <options>, -W1,<options>They got converted and merged
# intosingle '-W a,<options> Pass comma-separated...'The same goes for
# '-X'2. Moreover, see '-###' which got parsed into '-# ##'3. this tool
# also exposes '-v --help' combination which add much more tools. so we
# should come back to it after this is fixed."
#
# All three reported defects are fixed: `-Wa,<options>`/`-Wp,<options>`/
# `-Wl,<options>` each parse as their own entity (docs/shapes.md S-116),
# `-###` parses as its own boolean spelling (S-118), and
# `-Xassembler`/`-Xpreprocessor`/`-Xlinker` each parse as their own entity
# with value `<arg>` (S-117). `-v --help` still exposes more flags; design
# §6 admits only one probe per node, so a second probe shaped by a flag's
# own output stays out of scope and unasserted.
#
# Two residuals stay unasserted, no contract field expresses either: the
# `--help=` row's choice list renders as a value name containing the full
# `{common|optimizers|...}` block (no field asserts value-name bracket
# shape, only substring content); the root description reads the
# `Options:` heading (no field states what the root description must not
# be).

[bless]
provenance = "agent"

[tool]
name = "aarch64-linux-gnu-g++-13"
version = "13.3.0"                   # `aarch64-linux-gnu-g++-13 --version`:
                                     # "aarch64-linux-gnu-g++-13 (Ubuntu
                                     # 13.3.0-6ubuntu2~24.04.1) 13.3.0"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); g++-13-aarch64-linux-gnu 13.3.0-6ubuntu2~24.04.1"

[[capture]]
argv = ["aarch64-linux-gnu-g++-13", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"

must_contain_flags = ["-Wa", "-Wp", "-Wl", "-###"]

must_keep_separate = [
  ["-Wa", "-Wp", "-Wl"],
  ["-Xassembler", "-Xpreprocessor", "-Xlinker"],
]

[contract.must_value_name]
# `-Wa`/`-Wp`/`-Wl` require the comma the tool itself prints
# (`-Wa,<options>`, never `-Wa <options>`): the value name keeps that
# comma as its own leading character (docs/shapes.md S-116) so a
# renderer can draw the row without implying a space-separated
# invocation the tool refuses.
"-Wa" = ",<options>"
"-Wp" = ",<options>"
"-Wl" = ",<options>"
"-Xassembler" = "<arg>"
"-Xpreprocessor" = "<arg>"
"-Xlinker" = "<arg>"

[contract.must_describe]
"-Wa" = "assembler"
"-Wp" = "preprocessor"
"-Wl" = "linker"
"-Xassembler" = "assembler"
"-Xpreprocessor" = "preprocessor"
"-Xlinker" = "linker"
"-###" = "Like -v but options quoted"
