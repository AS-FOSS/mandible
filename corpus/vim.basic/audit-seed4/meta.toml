# An agent generated this fixture; only a human may change the value
# below (corpus/README.md's `[bless]` section).
[bless]
provenance = "agent"

[tool]
name = "vim.basic"
version = "audit-seed4"
captured_with = "xtask audit"

[[capture]]
argv = ["vim.basic", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"

# The operand the tail-operand repair recovered. `Usage: vim [arguments]
# [file ..]` documents one repeated operand and the tree carried none.
# Passing; the `...` suffix holds the repetition marker too.
must_contain_positionals = ["file..."]

# Maintainer: "a flag with just '+' and '+<num>'" is not parsed.
# Maintainer: "'--' ... its not parsed".
# Machine classification: plus-prefixed option, and end-of-options marker
# dropped. Both rows sit in the same `Arguments:` block as 43 rows that do
# parse. `+<lnum>` is not asserted by spelling: `Spelling::name` carries no
# brackets, so a correct parse spells it `+` and puts `lnum` in the value,
# which the `must_value_name` entry below asserts instead.
must_contain_flags = ["+", "--", "--help"]

# Maintainer: "'-V[N][fname]' got parsed into just '-V [N]' which lost
# fname". Machine classification: second optional value dropped. The tree
# carries `-V` with value name `N`.
#
# Maintainer: "'-r (with file name)' got parsed into '-r (with'". Machine
# classification: parenthetical qualifier read as value. The tree carries a
# second `-r` whose value name is `(with`, so `file name)` reaches nothing.
#
# Maintainer: "even worse for '-q' where it did not even get a
# placeholder". Machine classification: usage-alternative operand dropped.
# `or: vim [arguments] -q [errorfile]` gives `-q` with no value at all.
#
# The `+` entry is the second half of the plus-prefixed row above.
[contract.must_value_name]
"-V" = "fname"
"-r" = "file name"
"-q" = "errorfile"
"+" = "lnum"

# Maintainer: "the flag '-t tag' got parsed from usage line finely,
# however, it did not carry on the description of that flag." Machine
# classification: usage-alternative description dropped. `-t` and `-q` both
# reach the tree from `help-text-synopsis` with no description, while the
# usage line states one for each.
[contract.must_describe]
"-t" = "edit file where tag is defined"
"-q" = "edit file with first error"

[xfail]
broken = true
reason = "six defects in one document. A `+`-prefixed option is not recognized at all, so the `+` and `+<lnum>` rows reach nothing. The end-of-options marker `--` is dropped the same way. `-V[N][fname]` keeps only the first bracketed value and loses `fname`. `-r (with file name)` reads the parenthetical qualifier as a value and truncates it to `(with`, so `file name)` is rendered nowhere. `-h  or  --help` is read as one flag `-h` whose description begins `or --help`, so the `--help` spelling never becomes an alias. The usage alternatives `-t tag` and `-q [errorfile]` reach the tree without their own descriptions, and `-q` without its operand."

