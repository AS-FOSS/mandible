[bless]
provenance = "agent"

[tool]
name = "vim.basic"
version = "audit-seed4"
captured_with = "xtask audit"

[[capture]]
argv = ["vim.basic", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"

# The operand the tail-operand repair recovered. `Usage: vim [arguments]
# [file ..]` documents one repeated operand and the tree carried none.
# Passing; the `...` suffix holds the repetition marker too.
must_contain_positionals = ["file..."]

# Maintainer: "a flag with just '+' and '+<num>'" is not parsed.
# Maintainer: "'--' ... its not parsed".
# Machine classification: plus-prefixed option, and end-of-options marker
# dropped. Both rows sit in the same `Arguments:` block as 43 rows that do
# parse. `+<lnum>` is not asserted by spelling: `Spelling::name` carries no
# brackets, so a correct parse spells it `+` and puts `lnum` in the value,
# which the `must_value_name` entry below asserts instead.
must_contain_flags = ["+", "--", "--help"]

# Maintainer: "'-V[N][fname]' got parsed into just '-V [N]' which lost
# fname". Machine classification: second optional value dropped (atlas
# S-097). Fixed: `-V` now carries the value name `[N][fname]`, the source
# spelling of the glued run, brackets included.
#
# Maintainer, later, re-reading this build's screen: "is this parse
# correct: original = '-V[N][fname]', got parsed into '-V[N fname]'?"
# Ruling (docs/design.md §16, 2026-09-04): a glued optional-group value
# keeps its source spelling. Folding the two glued groups `[N]` and
# `[fname]` into one space-joined name `N fname` loses the bracket
# structure while keeping the words, so `-V` must carry the value name
# `[N][fname]`, not `N fname`.
#
# Maintainer: "'-r (with file name)' got parsed into '-r (with'". Machine
# classification: parenthetical qualifier read as value (atlas S-098).
# Fixed: the second `-r` now carries the value name `file name`.
#
# Maintainer: "even worse for '-q' where it did not even get a
# placeholder". Machine classification: usage-alternative operand dropped
# (atlas S-100). Fixed: `-q` now carries the value name `errorfile`. Its
# missing description is a separate, still-open half of the same shape.
#
# The `+` entry is the second half of the plus-prefixed row above.
[contract.must_value_name]
"-V" = "[N][fname]"
"-r" = "file name"
"-q" = "errorfile"
"+" = "lnum"

# Maintainer: "the flag '-t tag' got parsed from usage line finely,
# however, it did not carry on the description of that flag." Machine
# classification: usage-alternative description dropped. `-t` and `-q` both
# reach the tree from `help-text-synopsis` with no description, while the
# usage line states one for each.
[contract.must_describe]
"-t" = "edit file where tag is defined"
"-q" = "edit file with first error"

[xfail]
broken = true
reason = "one defect remains. The usage alternatives `-t tag` and `-q [errorfile]` reach the tree without their own descriptions. Fixed: the end-of-options marker `--` (`mandible-extract/src/help_text/grammar.rs`'s `try_bare_sigil`), the parenthetical qualifier on `-r` (`sections/emit.rs`'s `repair_parenthetical_value`), the second bracketed value on `-V` (`grammar.rs`'s `try_value`), `-q`'s usage-line operand (`sections/usage.rs`'s `extract_usage_flags`), the `or`-joined alias on `-h` (`grammar.rs`'s `strip_or_alias_separator`), and the `+`-led option row `+`/`+<lnum>` (`flag_rows.rs`'s neighbor-gated `scan_flags_block` admission, docs/shapes.md S-095), all generic-parser repairs, 2026-09-03."

