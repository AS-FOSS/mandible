# Two more defects, from the maintainer's later reading of this build's
# screen. No `[contract]` field can assert a usage form today, so both live
# as prose here.
#
# Maintainer: "regarding usage line, why is every line getting appended
# with the tool's name?"
# Machine classification: the raw block is `Usage: vim [arguments]
# [file ..]` then `   or: vim [arguments] -`. The renderer prefixes the
# resolved binary name `vim.basic` to each form. The strip of the help
# text's own program word fails because the binary is `vim.basic` and the
# help text says `vim`, so the strip never matches and the prefix is added
# on top of the un-stripped original.
#
# Maintainer: "there is an indentation mismatch where first row 'edit
# specified...' is a bit closer to the left, while other three are
# aligned."
# Machine classification: the `or:` continuation marker on rows 2 to 4 is
# never stripped. The four extra characters of `or: ` are what make those
# rows sit further right than row 1.

# What a reader sees on screen for the two `+` rows, checked on my own
# 110x150 pty capture of this build and recorded rather than left for the
# next reader to find. The replayed tree here is right: two entities, both
# spelled `+`, one with the description "Start at end of file" and no
# value, one with the value `<lnum>` and the description "Start at line
# <lnum>". The running TUI shows one row, `+<lnum>` carrying "Start at end
# of file". `mandible_core::merge::merge_entities` buckets an entity by
# `(kind, spelling)`, so the two rows collide on the key `(Flag, "+")` and
# fold, keeping the first description beside the second value name. This is
# docs/shapes.md S-102, which already names this tool, and it is the same
# collision corpus/jinfo/17.0.20 records for its three `-flag` rows. Before
# the plus-prefixed fix neither row reached any surface at all, so the fix
# adds one row and the fold still hides "Start at line <lnum>". A fixture
# replay never runs the merge, so no `[contract]` field here can state it.
