[bless]
provenance = "agent"

[tool]
name = "less"
version = "590"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); less 590"

[[capture]]
argv = ["less", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
must_contain_flags = ["--search-skip-screen", "--clear-screen", "--quit-at-eof", "--buffers", "--file-size", "--wheel-lines"]

must_not_contain_flags = ["-_", "--_", "-<"]
must_draw = ["-b, --buffers=[N]", "-x, --tabs=[N[,...]]"]

[contract.must_value_name]
"-b" = "N"
"--wheel-lines" = "N"
"--rscroll" = "C"

[contract.must_describe]
"--wheel-lines" = "Each click of the mouse wheel moves N lines."
"--search-skip-screen" = "Search skips current screen."
