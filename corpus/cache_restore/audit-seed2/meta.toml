# FIXED. Every option here is spelled `{-h|--help}` (curly braces, not the
# usual `[-h|--help]`), and that used to defeat flag detection completely:
# the tree had zero flags at all, because `looks_like_flag_start` required a
# leading '-' and so no row here ever began an entry. It now accepts a
# brace-delimited group of bare flag spellings, and all eight rows parse —
# including the three single-member ones (`{--metadata-version}`,
# `{--omit-clean-shutdown}`, `{--debug-override-metadata-version}`), which
# the fleet detector deliberately does not count but the grammar does read.
# "Options:" still leaks into the root description; that is a separate
# defect this contract does not assert either way.
must_contain_flags = ["--help", "--version", "--input", "--output"]
