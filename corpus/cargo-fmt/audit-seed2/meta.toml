# Generated by `xtask audit fixtures` (corpus/README.md's workflow) —
# reviewed under seed 2, verdict "correct". See that file's own
# review-any-fixture-for-machine-specific-content note before committing.

[bless]
provenance = "agent-then-human"

[tool]
name = "cargo-fmt"
version = "audit-seed2"
captured_with = "xtask audit"

[[capture]]
argv = ["cargo-fmt", "--help"]
stdout = "help.txt"

[contract]
# SCOPE OF REVIEW: see corpus/README.md's "verdict_scope" section --
# this fixture was promoted from the seed-2 audit, whose "correct"
# verdict covers exactly the dimensions verdict_scope lists below, never
# prose. expected.snap freezes descriptions too, but they were not part
# of that review.
verdict_scope = ["flags", "subcommands"]
# Not "clap (v3/v4)": clap identification is artifact-based (Tier A′ step
# 1, scanning the compiled binary's own bytes — see
# `mandible-extract/src/framework/mod.rs`), and the corpus replay runner
# has no real binary on disk to scan (`xtask/src/corpus.rs`'s
# `resolved_tool` fabricates a path under `/corpus-replay/` that
# deliberately never resolves). A live probe of the real `cargo-fmt`
# binary does identify clap (confirmed via `mandible --doctor cargo-fmt`
# during this review); this frozen fixture only exercises the generic
# layout engine, same convention as `corpus/zoxide`'s own fixture.
expected_framework = "generic"
min_status = "ok"
min_subcommands = 0
must_contain_flags = ["--quiet", "--verbose", "--version", "--package", "--manifest-path"]
