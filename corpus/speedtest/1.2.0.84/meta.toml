# The `Valid units for [-u] flag:` block lists four values on the auto-scaled
# line; today only three reach -u's choices and `auto-binary-bits` is lost.

[bless]
provenance = "agent"

[tool]
name = "speedtest"
version = "1.2.0.84"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.3"

[[capture]]
argv = ["speedtest", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
must_attach_choices = { "--unit" = ["bps", "Gbps", "GiB/s", "auto-binary-bits", "auto-binary-bytes", "auto-decimal-bits", "auto-decimal-bytes"] }
