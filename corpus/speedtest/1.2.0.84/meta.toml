# The `Valid units for [-u] flag:` block lists the values of -u; the `Valid output formats:`
# line lists the values of -f, which its description points to ("see below for valid formats").

[bless]
provenance = "agent"

[tool]
name = "speedtest"
version = "1.2.0.84"
platform = "ubuntu-24.04"
captured_with = "mandible 0.8.3"

[[capture]]
argv = ["speedtest", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
must_attach_choices = { "--format" = ["human-readable", "csv", "tsv", "json", "jsonl", "json-pretty"], "--unit" = ["bps", "Gbps", "GiB/s", "auto-binary-bits", "auto-binary-bytes", "auto-decimal-bits", "auto-decimal-bytes"] }

[contract.must_describe]
"--format" = "use bytes as the unit of measure with max precision"
