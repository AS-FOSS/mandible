[bless]
provenance = "agent"

[tool]
name = "git"
version = "2.43.0-stash"
platform = "ubuntu-24.04"
captured_with = "mandible 0.9.0"

[[capture]]
argv = ["git", "--help"]
stdout = "help.txt"

[[capture]]
argv = ["git", "help", "-a"]
stdout = "help-a.txt"

[[capture]]
argv = ["git", "help", "-g"]
stdout = "help-g.txt"

[[capture]]
argv = ["git", "stash", "--help"]
stdout = "stash-help.txt"

[[capture]]
argv = ["git", "stash", "-h"]
stdout = "stash-h.txt"
exit_code = 129

[contract]
expected_framework = "generic"
min_status = "ok"
min_subcommands = 100

[contract.must_not_contain_positionals_by_path]
stash = ["diff-options", "commit"]

[contract.must_contain_positionals_by_path]
"stash show" = ["diff-options", "stash"]
"stash store" = ["commit"]
