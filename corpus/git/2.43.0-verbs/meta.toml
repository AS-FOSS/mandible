[[capture]]
argv = ["git", "citool", "--help"]
stdout = "citool-help.txt"
exit_code = 1

[[capture]]
argv = ["git", "citool", "-h"]
stdout = "citool-h.txt"
exit_code = 1

[[capture]]
argv = ["git", "gui", "--help"]
stdout = "gui-help.txt"
exit_code = 1

[[capture]]
argv = ["git", "gui", "-h"]
stdout = "gui-h.txt"
exit_code = 1

[contract]
expected_framework = "generic"
min_status = "ok"
min_subcommands = 100

[contract.must_contain_flags_by_path]
"bisect start" = ["--no-checkout", "--first-parent", "--term-new", "--term-bad", "--term-old", "--term-good"]
"bisect terms" = ["--term-good", "--term-bad"]
"remote add" = ["--mirror"]
"stash save" = ["--patch"]
"stash drop" = ["--quiet"]
"worktree add" = ["--detach"]
"bundle create" = ["--version"]
"commit-graph write" = ["--append"]
"reflog expire" = ["--stale-fix"]

[contract.must_contain_positionals_by_path]
"bisect run" = ["cmd"]
"bisect good" = ["rev"]
"bisect bad" = ["rev"]
"bisect replay" = ["logfile"]
"remote rename" = ["old", "new"]
"worktree move" = ["worktree", "new-path"]
