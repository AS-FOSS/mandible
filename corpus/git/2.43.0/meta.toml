[tool]
name = "git"
version = "2.43.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.2.2"

[[capture]]
argv = ["git", "--help"]
stdout = "help.txt"
exit_code = 0

# [M-16]: `git restore --help` execs `man` and renders GIT-RESTORE(1) rather
# than printing help; the man-page banner check degrades that to verbatim,
# and `help_text::probe_help_text` falls back to `git restore -h`, whose
# ordinary option table the generic grammar reads directly. Both captures
# are here so the fallback itself replays with zero subprocesses, not just
# its end result — `restore`'s recovered flags depend on both bytes being
# exactly what a real capture produced.
[[capture]]
argv = ["git", "restore", "--help"]
stdout = "restore-help.txt"
exit_code = 0

[[capture]]
argv = ["git", "restore", "-h"]
stdout = "restore-h.txt"
exit_code = 0

[contract]
# git's root `--help` is hand-rolled C, not generated by any framework this
# project fingerprints — Tier A′ finds nothing, so Tier B falls back to the
# generic layout parser (spec §7 Tier B step 2).
expected_framework = "generic"
min_status = "ok"
# `git --help` lists 22 real subcommands across its "start a working area"
# / "work on the current change" / ... groups. 20 is a coarse floor, not
# the exact count (spec's contract is deliberately not an exact-count
# check — a new git release adding one more listed command must not fail
# this fixture).
min_subcommands = 20
# NOT `must_contain_flags = ["--paginate", "--git-dir"]`, deliberately.
# git publishes these only in its usage synopsis (`[-p | --paginate | ...]`
# and `[--git-dir=<path>]`), never under a flag heading, so the generic
# parser's `Options:`-style block scanner still has nothing to read there
# and root flags are still empty — a real, separate, still-open gap
# (recovering flag specs straight out of a usage synopsis line), not one
# of the three defects this revision fixes. Asserting it here would either
# block promotion on an unrelated bug or silently drop the check the day
# someone "fixes" it by fabricating a flag from prose. `restore`'s flags
# below are the actual regression net for this revision's fixes.
#
# `restore` is where all three fixes are visible: its `-h` capture (added
# this revision, per [M-16] below) has 16 real flag rows, 8 of which are
# git's `--[no-]foo` negatable-boolean convention. Before this revision
# `--[no-]foo` matched neither `try_short` nor `try_long`, so a flag with a
# short spelling rendered bare (`-S` with no long name) and a long-only one
# (`--[no-]ignore-unmerged`) was dropped entirely. `-2, --ours` has no
# `[no-]` and needs none of this revision's fixes — the control case that
# confirms the diagnosis.
[contract.must_contain_flags_by_path]
restore = [
  "-s", "--source",             # short+long, had a value spec (regression risk for grammar.rs's try_value ordering)
  "-S", "--staged",              # short existed before; long was silently dropped
  "--ignore-unmerged",           # long-only; the whole row was dropped before (short.is_none() && long.is_none())
  "-2", "--ours",                # the control case: no `[no-]`, worked before and must keep working
]

# Promoted from `[xfail]`: the two `extract_positionals` defects this
# fixture held open (greedy bracket match on `<name>=<value>`; flag
# arguments — `-C <path>`, `-c <name>=<value>` — read as positionals) are
# both fixed, and a third, related defect found alongside them
# (`--[no-]name`, git's negatable-boolean convention, unparseable by both
# `try_short` and `try_long`) is fixed too — see the commit that promoted
# this fixture for the full writeup.
