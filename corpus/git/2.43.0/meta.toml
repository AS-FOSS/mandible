[tool]
name = "git"
version = "2.43.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.2.2"

[[capture]]
argv = ["git", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
# git's root `--help` is hand-rolled C, not generated by any framework this
# project fingerprints — Tier A′ finds nothing, so Tier B falls back to the
# generic layout parser (spec §7 Tier B step 2).
expected_framework = "generic"
min_status = "ok"
# `git --help` lists 22 real subcommands across its "start a working area"
# / "work on the current change" / ... groups. 20 is a coarse floor, not
# the exact count (spec's contract is deliberately not an exact-count
# check — a new git release adding one more listed command must not fail
# this fixture).
min_subcommands = 20
# git publishes these only in its usage synopsis (`[-p | --paginate | ...]`
# and `[--git-dir=<path>]`), never under a flag heading — the generic
# parser's `Options:`-style block scanner has nothing to read there, so
# today it extracts zero root flags. This is the deeper gap the fixture
# exists to hold open; see [xfail].reason.
must_contain_flags = ["--paginate", "--git-dir"]

[xfail]
broken = true
reason = """
Two real, currently-unfixed defects in help_text::sections::extract_positionals, both visible in expected root positionals:

1. Greedy bracket match: the usage token `<name>=<value>` (from `-c <name>=<value>`) is reduced by stripping exactly one leading '<' and one trailing '>', which lands on the outermost/last '>' rather than the first one closing `<name>`. The result is a positional literally named `name>=<value` instead of being recognized as a flag's value placeholder at all.

2. Flag arguments read as positionals: extract_positionals scans every usage-line token for bracket/uppercase shape with no awareness of what precedes it, so `-C <path>` and `-c <name>=<value>` (both option values) contribute `path` and `name>=<value` to `positionals` alongside the two real positionals, `command` and `args`.

Consequence of the same fallback: git's root flags (`--paginate`, `--git-dir`, ...) live only in the usage synopsis, never under a flag heading, so the generic parser also extracts zero root flags — see [contract].must_contain_flags.
"""
# No issue filed yet — `issue` is optional in the schema; this fixture is
# itself the reproducible backlog entry (corpus/README.md's step 5).
