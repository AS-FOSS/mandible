[tool]
name = "git"
version = "2.43.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.2.2"

[[capture]]
argv = ["git", "--help"]
stdout = "help.txt"
exit_code = 0

# [M-16]: `git restore --help` execs `man` and renders GIT-RESTORE(1) rather
# than printing help; the man-page banner check degrades that to verbatim,
# and `help_text::probe_help_text` falls back to `git restore -h`, whose
# ordinary option table the generic grammar reads directly. Both captures
# are here so the fallback itself replays with zero subprocesses, not just
# its end result — `restore`'s recovered flags depend on both bytes being
# exactly what a real capture produced.
[[capture]]
argv = ["git", "restore", "--help"]
stdout = "restore-help.txt"
exit_code = 0

[[capture]]
argv = ["git", "restore", "-h"]
stdout = "restore-h.txt"
exit_code = 0

[contract]
# git's root `--help` is hand-rolled C, not generated by any framework this
# project fingerprints — Tier A′ finds nothing, so Tier B falls back to the
# generic layout parser (spec §7 Tier B step 2).
expected_framework = "generic"
# [M-15] promoted this fixture: the usage-synopsis flag grammar now
# recovers 18 flags at the root (`-v/--version`, `-C <path>`, the
# `-p | --paginate | -P | --no-pager` group unpaired per spec's
# conservative-pairing rule, `--git-dir=<path>`, ...) — see
# `must_contain_flags` below for the executable check that used to be the
# open demand.
#
# `min_status` moved from `"ok"` down to `"low-confidence"`, and this is
# the metric trap the work order warned about, arriving by a second route.
# A synopsis carries spellings and value shapes, never prose (spec §7 Tier
# B: never fabricate a description from neighbouring text), so all 18 of
# these flags are — correctly — undescribed. Once merged with `restore`'s
# 16 real, fully-described flags (recovered via the [M-16] `-h` fallback
# below), the tree's overall %described falls to 16/34 ≈ 47%, under
# `status.rs`'s 50% "ok" floor. That is [M-15]'s exact finding about the
# coverage harness's aggregate — "finding usage-only flags adds to the
# denominator only" — reproduced at single-fixture granularity: recovering
# real, previously-invisible structure that is honestly undescribable by
# construction *lowers* a metric built to reward description coverage.
# Loosening this floor is not "removing a failing assertion to force a
# promotion" (the thing a previous revision did and had to revert) — every
# other field below is unchanged and still gates real regressions; only the
# floor value moved, to the value the tool's own bytes now honestly produce.
min_status = "low-confidence"
# `git --help` lists 22 real subcommands across its "start a working area"
# / "work on the current change" / ... groups. 20 is a coarse floor, not
# the exact count (spec's contract is deliberately not an exact-count
# check — a new git release adding one more listed command must not fail
# this fixture).
min_subcommands = 20
# [M-15]'s headline demand, now executable rather than aspirational: git
# publishes these only in its usage synopsis, never under a flag heading,
# so before the usage-synopsis flag grammar landed the generic parser's
# block scanner found nothing and root flags were always empty — 378 of
# 1,895 `ok` tools fleet-wide carried this same shape. `--paginate` comes
# from the four-way `[-p | --paginate | -P | --no-pager]` group (emitted
# unpaired, per spec's conservative-pairing rule: never guess which short
# goes with which long across more than one of each); `--git-dir` comes
# from `--git-dir=<path>`, a required-value long flag with no alternation
# at all.
must_contain_flags = ["--paginate", "--git-dir"]

[contract.must_contain_flags_by_path]
restore = [
  "-s", "--source",             # short+long, had a value spec (regression risk for grammar.rs's try_value ordering)
  "-S", "--staged",              # short existed before; long was silently dropped
  "--ignore-unmerged",           # long-only; the whole row was dropped before (short.is_none() && long.is_none())
  "-2", "--ours",                # the control case: no `[no-]`, worked before and must keep working
]

# Promoted ([M-15]): every contract assertion above now passes against the
# real usage-synopsis flag grammar, so this fixture is no longer `[xfail]`.
# The two `extract_positionals` defects this fixture originally held open
# (greedy bracket match on `<name>=<value>`; flag arguments — `-C <path>`,
# `-c <name>=<value>` — read as positionals) were fixed earlier, as was a
# third found alongside them (`--[no-]name`, git's negatable-boolean
# convention). Those three, plus the usage-synopsis flags this promotion
# adds, are all now locked in by `expected.snap` and by
# `must_contain_flags`/`must_contain_flags_by_path` above.
