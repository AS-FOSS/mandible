[tool]
name = "git"
version = "2.43.0"
platform = "ubuntu-24.04"
captured_with = "mandible 0.2.2"

[[capture]]
argv = ["git", "--help"]
stdout = "help.txt"
exit_code = 0

# [M-16]: `git restore --help` execs `man` and renders GIT-RESTORE(1) rather
# than printing help; the man-page banner check degrades that to verbatim,
# and `help_text::probe_help_text` falls back to `git restore -h`, whose
# ordinary option table the generic grammar reads directly. Both captures
# are here so the fallback itself replays with zero subprocesses, not just
# its end result — `restore`'s recovered flags depend on both bytes being
# exactly what a real capture produced.
[[capture]]
argv = ["git", "restore", "--help"]
stdout = "restore-help.txt"
exit_code = 0

[[capture]]
argv = ["git", "restore", "-h"]
stdout = "restore-h.txt"
exit_code = 0

[contract]
# git's root `--help` is hand-rolled C, not generated by any framework this
# project fingerprints — Tier A′ finds nothing, so Tier B falls back to the
# generic layout parser (spec §7 Tier B step 2).
expected_framework = "generic"
min_status = "ok"
# `git --help` lists 22 real subcommands across its "start a working area"
# / "work on the current change" / ... groups. 20 is a coarse floor, not
# the exact count (spec's contract is deliberately not an exact-count
# check — a new git release adding one more listed command must not fail
# this fixture).
min_subcommands = 20
# The still-open demand, kept deliberately failing. git publishes these
# only in its usage synopsis (`[-p | --paginate | ...]`, `[--git-dir=<path>]`),
# never under a flag heading, so the generic parser's block scanner finds
# nothing and root flags are still empty. That is [M-15]'s headline finding
# — 378 of 1,895 `ok` tools carry zero flags — and this line is the only
# executable demand that it ever gets fixed.
#
# It is therefore NOT removed to let this fixture go green. A fixture is a
# reproducible backlog entry (corpus/README.md); deleting the failing
# assertion deletes the backlog entry and leaves a prose comment in its
# place, which is exactly the "lessons rot, fixtures don't" failure this
# corpus exists to prevent. The fixture stays `[xfail]` until a usage-
# synopsis flag grammar lands, at which point strict xfail forces it to be
# promoted rather than allowing it to drift.
#
# Note this does not cost the three fixes their ratchet: `expected.snap` is
# present and compared on every run regardless of `[xfail]`, and
# `must_contain_flags_by_path` below asserts `restore`'s recovered flags by
# name. Only this one root-level assertion is outstanding.
must_contain_flags = ["--paginate", "--git-dir"]

[contract.must_contain_flags_by_path]
restore = [
  "-s", "--source",             # short+long, had a value spec (regression risk for grammar.rs's try_value ordering)
  "-S", "--staged",              # short existed before; long was silently dropped
  "--ignore-unmerged",           # long-only; the whole row was dropped before (short.is_none() && long.is_none())
  "-2", "--ours",                # the control case: no `[no-]`, worked before and must keep working
]

# Still `[xfail]`, and narrowed. The two `extract_positionals` defects this
# fixture originally held open (greedy bracket match on `<name>=<value>`;
# flag arguments — `-C <path>`, `-c <name>=<value>` — read as positionals)
# are both fixed, as is a third found alongside them (`--[no-]name`, git's
# negatable-boolean convention, unparseable by both `try_short` and
# `try_long`). Those three are now locked in by `expected.snap` and by
# `must_contain_flags_by_path` above.
#
# What remains is the reason this stays broken: root flags. See
# `must_contain_flags`.
[xfail]
broken = true
reason = """
git's root flags live only in its usage synopsis (`[-p | --paginate | -P | --no-pager]`, `[--git-dir=<path>]`, twelve long options and six short ones), and no tier extracts flag specs from a usage line — help_text::sections::extract_positionals mines that block for positionals only. So `git --help` parses to 22 correctly-grouped subcommands and zero flags, at status `ok`.

This is the silently-missing-structure failure, not the fabrication one: nothing is invented, so no structure-sanity check fires and the tool reports full confidence on an incomplete parse. [M-15] measured the same shape across the fleet — 378 of 1,895 `ok` tools carry zero flags.

Fixing it means a usage-synopsis flag grammar. The synopsis is already isolated (`usage` is kept separately and mined for positionals), and it is naturally resistant to [M-10]: a synopsis token starts with `-`, so prose cannot enter through it.
"""
