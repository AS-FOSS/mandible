[bless]
provenance = "agent"

[tool]
name = "jcmd"
version = "audit-seed"
platform = "ubuntu-24.04"
captured_with = "probe environment, setsid, null stdin"

[[capture]]
argv = ["jcmd", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
must_contain_flags = ["-l", "-f"]

# A row whose description follows the spelling after one space keeps a
# one-word value; the sentence is never the value name.
[contract.must_not_value_name]
"--help" = "print this help message"
