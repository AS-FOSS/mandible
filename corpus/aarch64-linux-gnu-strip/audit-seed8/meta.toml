[bless]
provenance = "agent"

[tool]
name = "aarch64-linux-gnu-strip"
version = "audit-seed8"
platform = "ubuntu-24.04"
captured_with = "xtask audit"

[[capture]]
argv = ["aarch64-linux-gnu-strip", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
must_contain_positionals = ["in-file(s)"]
must_not_contain_positionals = ["option(s)"]

[xfail]
broken = true
reason = "[S-128] The usage line `strip <option(s)> in-file(s)` names the options placeholder `<option(s)>` and the operand `in-file(s)`. A fix keeps the placeholder out of the positionals and keeps `in-file(s)` as an operand named as written."
