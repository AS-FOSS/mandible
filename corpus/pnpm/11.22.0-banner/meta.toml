# Variant of corpus/pnpm/11.22.0-commands plus `pnpm store --help`. Every pnpm page opens with a bare
# `Version 11.22.0` banner line before `Usage:`. That line is the tool's version, not its description:
# the prose the page prints is the description, and the banner is kept after it (docs/shapes.md S-250).

[bless]
provenance = "agent"

[tool]
name = "pnpm"
version = "11.22.0"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8)"

[[capture]]
argv = ["pnpm", "--help"]
stdout = "help.txt"

[[capture]]
argv = ["pnpm", "help", "-a"]
stdout = "help-a.txt"

[[capture]]
argv = ["pnpm", "store", "--help"]
stdout = "store-help.txt"

[contract]
expected_framework = "generic"
min_subcommands = 45
must_contain_flags = ["--recursive"]
# Prose first, banner after it: the substring spans the paragraph break.
must_describe_root = ["use 'pnpm help -a' to list all commands Version 11.22.0"]
