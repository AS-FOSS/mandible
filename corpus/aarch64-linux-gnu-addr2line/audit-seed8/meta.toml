[bless]
provenance = "agent"

[tool]
name = "aarch64-linux-gnu-addr2line"
version = "audit-seed8"
platform = "ubuntu-24.04"
captured_with = "xtask audit"

[[capture]]
argv = ["aarch64-linux-gnu-addr2line", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
must_contain_positionals = ["addr(s)"]
must_not_contain_usage_text = ["Convert addresses", "If no addresses"]
must_describe_root = ["Convert addresses into line number/file name pairs."]
