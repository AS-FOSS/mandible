[bless]
provenance = "agent"

[tool]
name = "nl"
version = "9.4"
platform = "ubuntu-24.04"
captured_with = "mandible 0.9.0"

[[capture]]
argv = ["nl", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
min_status = "ok"
must_contain_flags = ["-b", "--body-numbering", "-f", "-h", "-n"]

[contract.must_attach_choices]
"-b" = ["a", "t", "n", "pBRE"]
"-f" = ["a", "t", "n", "pBRE"]
"-h" = ["a", "t", "n", "pBRE"]
