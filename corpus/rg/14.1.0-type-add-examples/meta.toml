# `--type-add 'src:include:cpp,py,md'` example lines, indented deeper than the
# description and introduced by a line ending in a colon, are description text:
# they open no flag row and the paragraphs after them stay with --type-add.

[bless]
provenance = "agent"

[tool]
name = "rg"
version = "14.1.0"
platform = "ubuntu-24.04"

[[capture]]
argv = ["rg", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
verdict_scope = ["flags"]
must_contain_flags = ["--type-add", "--type-clear", "--multiline-dotall"]

[contract.must_describe]
"--type-add" = "Additional glob rules can still be added to the src type by using this flag again:"
"--multiline-dotall" = "isn't enabled with the -U/--multiline flag."

[contract.must_one_row_in_group]
"FILTER OPTIONS:" = ["--type-add"]
