[bless]
provenance = "agent"

[tool]
name = "rg"
version = "14.1.0"
platform = "ubuntu-24.04"

[[capture]]
argv = ["rg", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "generic"
min_status = "ok"
verdict_scope = ["flags"]
must_contain_flags = ["--colors", "--color"]

# `--colors 'path:none' \` inside the --color description's example block
# stays description text (S-011). Known gap: the wrapped `--vimgrep and
# --json.` line still opens a fabricated --vimgrep row.
[contract.must_describe]
"--colors" = "This flag specifies color settings for use in the output"

[contract.must_one_row_in_group]
"OUTPUT OPTIONS:" = ["--colors"]
