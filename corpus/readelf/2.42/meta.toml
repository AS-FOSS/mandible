[bless]
provenance = "agent"

[tool]
name = "readelf"
version = "2.42"
platform = "ubuntu-24.04 (aarch64)"
captured_with = "mandible 0.9.0 --report"

[[capture]]
argv = ["readelf", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
expected_framework = "generic"
must_describe_root = ["Display information about the contents of ELF format files"]
must_not_contain_usage_text = ["Display information about"]
must_not_contain_positionals = ["ELF"]
must_contain_positionals = ["elf-file(s)"]
