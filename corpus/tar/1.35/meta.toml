[tool]
name = "tar"
version = "1.35"
platform = "ubuntu-24.04"
captured_with = "mandible 0.2.2"

[[capture]]
argv = ["tar", "--help"]
stdout = "help.txt"
exit_code = 0

[contract]
# GNU tar's `--help` is generated by argp/getopt_long, which Tier A′
# fingerprints from the output itself (no `Commands:`-style heading exists
# for tar to trip the phantom-subcommand bug this fixture exists to guard,
# spec §7 Tier B, [M-10]).
expected_framework = "GNU argp/getopt_long"
min_status = "ok"
# [M-10]'s whole failure was inventing subcommands out of wrapped
# description lines and `--format=`-style enum lists; `tar --help` has no
# recognized command heading at all, so the correct count is zero. A floor
# can't express "exactly zero, never more" (a regression that fabricates
# subcommands still satisfies `>= 0`) — that direction is caught by the
# byte-exact `expected.snap` match instead, which is the real ratchet here.
min_subcommands = 0
must_contain_flags = [
    "--create",
    "--extract",
    "--list",
    # Tracker #41. This fixture was green, blessed and contract-gated while
    # missing these three, because the nested `FORMAT is one of the
    # following:` enum under `--format` (indent 4) never dedented before the
    # options table resumed at indent 6 — so three real flags were read as
    # three more values of `FORMAT`. A floor on flag *count* would not have
    # caught it either: the flags were not absent from the tree, they were
    # in the wrong place. Named explicitly so they cannot silently return
    # there. (`--portability`, the fourth flag on tracker #41, is a second
    # *long* alias on `--old-archive`'s row; `Flag` has one `long` slot, so
    # it is the `dropped-alias` family and is deliberately not asserted.)
    "--old-archive",
    "--pax-option",
    "--posix",
]
