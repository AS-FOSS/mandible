# The row `-0 to -9, -11` names a range of compression levels by its two
# ends, plus one more level (S-181). The tree keeps the spellings `-0` and
# `-11` and the range `-0` to `-9`.

[bless]
provenance = "agent"

[tool]
name = "pigz"
version = "2.8"
platform = "ubuntu-24.04"
captured_with = "manual capture per corpus/README.md step 2 (TERM=dumb NO_COLOR=1 COLUMNS=100 LC_ALL=C.UTF-8); pigz 2.8"

[[capture]]
argv = ["pigz", "--help"]
stdout = "help.txt"
stderr = "help.stderr.txt"
exit_code = 0

[contract]
expected_framework = "generic"
must_contain_flags = ["-0", "-11", "--fast", "--best"]

[contract.must_describe]
"-0" = "Compression level (level 11, zopfli, is much slower)"
