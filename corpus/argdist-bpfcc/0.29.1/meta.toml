[bless]
provenance = "agent"

[tool]
name = "argdist-bpfcc"
version = "0.29.1"
platform = "ubuntu-24.04"

[[capture]]
argv = ["argdist-bpfcc", "--help"]
stdout = "help.txt"

[contract]
expected_framework = "argparse"
min_status = "ok"
verdict_scope = ["flags", "descriptions"]
must_contain_flags = ["-H", "-C", "-I"]

# The EXAMPLES block's `argdist -H ... \` and `argdist -p ... \` lines end in
# a backslash, so the `-H` / `-C` lines after them are continuations.
[contract.must_describe]
"-H" = "probe specifier to capture histogram of"
"-C" = "probe specifier to capture count of"

[contract.must_one_row_in_group]
"" = ["-H", "-C"]

# The "Probe specifier syntax:" block and its `Where:` legend (S-210) join the
# node description; they are not choices of -H or -I.
[contract.must_not_attach_choices]
"-H" = ["r", "t"]
"-I" = ["library", "category", "function"]
