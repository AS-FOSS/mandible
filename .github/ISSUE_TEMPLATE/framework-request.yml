name: Add support for a CLI framework
description: A library that generates help text, which mandible does not recognize yet
title: "Support <framework>"
labels:
  - framework
body:
  - type: markdown
    attributes:
      value: |
        One library's help format, once learned, covers every tool built with it.

  - type: input
    id: framework
    attributes:
      label: Which library?
      description: Name, language, and a link if you have one.
      placeholder: Typer (Python), https://typer.tiangolo.com
    validations:
      required: true

  - type: textarea
    id: example-tools
    attributes:
      label: A couple of real tools that use it
      placeholder: |
        httpie
        sqlmodel
    validations:
      required: true

  - type: textarea
    id: sample-help
    attributes:
      label: Help output from one of them
      description: The output of `<tool> --help`, pasted as-is.
      render: console
    validations:
      required: true

  - type: textarea
    id: signals
    attributes:
      label: Anything that identifies it (optional)
      description: A phrase every tool's help prints, like argparse's "show this help message and exit".
    validations:
      required: false
