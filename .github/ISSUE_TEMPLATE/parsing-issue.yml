name: A tool renders wrong
description: mandible shows wrong flags or commands for a tool, or shows fewer than the tool documents
title: "<tool> renders incorrectly"
labels:
  - parsing
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Run `mandible --report <tool>` and paste its
        output below; that is all we need.

  - type: dropdown
    id: failure-kind
    attributes:
      label: What went wrong?
      options:
        - mandible shows something incorrect
        - mandible shows less than the tool documents
        - something else
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Output of `mandible --report <tool>`
      placeholder: paste the whole output here
      render: console
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: One sentence or a screenshot is enough.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 x86_64
    validations:
      required: false
