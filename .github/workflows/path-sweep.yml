name: PATH sweep

# The coverage harness (spec §13.1) over every executable on the runner's
# PATH — the broadest available measurement of "does this work on arbitrary
# tools", and the natural home spec §13.1a describes for a scoreboard that
# should not depend on whatever is installed on a developer's laptop.
#
# Deliberately NOT part of the release gate. It is a report, and it runs
# against ~1,500 arbitrary third-party binaries on a shared 2-core VM, so
# its failures are far more often infrastructure than regression. The gates
# are ci.yml and frameworks.yml.
#
# Runs on pushes to main and weekly, so drift is visible without a human
# remembering to look.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # GitHub's hosted runners have 2 cores and the harness spawns a
  # subprocess per tool. Left unbounded, rayon fans out far enough to make
  # the VM unresponsive and GitHub reclaims it mid-run ("the runner has
  # received a shutdown signal") — which is what killed this sweep
  # entirely before it was sharded, and still killed 3 of 8 shards after.
  RAYON_NUM_THREADS: "2"

jobs:
  path-sweep:
    name: PATH sweep ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The ungated measurement, over everything the runner has — sharded.
      #
      # Unsharded, this step did not merely run slowly: it was killed by
      # SIGTERM after ~96 seconds and produced *nothing*, every run, while
      # `continue-on-error` painted the job green. A step that always dies
      # and never reports is worse than no step, because the green tick
      # says otherwise. Sharding keeps each process small enough to finish.
      #
      # `--shard i/8` slices by stride rather than by contiguous block,
      # because expensive tools cluster alphabetically — a machine with 23
      # `qemu-*-static` binaries at 4 MB each puts them all in one
      # contiguous chunk, and that chunk alone takes longer than the rest
      # combined.
      - name: PATH sweep (shard ${{ matrix.shard }}/8)
        timeout-minutes: 15
        run: |
          cargo build --release --locked --bin xtask
          ./target/release/xtask coverage \
            --shard ${{ matrix.shard }}/8 \
            --format markdown \
            --out shard-${{ matrix.shard }}.md
      - uses: actions/upload-artifact@v4
        with:
          name: path-sweep-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.md
          if-no-files-found: error

  # Merges the shards into one summary. Exact, not approximate: the
  # aggregate footer carries raw `described_flags`/`total_flags` counts
  # alongside the rounded percentage precisely so shards can be recombined
  # without drift (recomputing from the per-row %described column could
  # not be, since that column is rounded to whole percent).
  path-sweep-summary:
    name: PATH sweep summary
    needs: [path-sweep]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: path-sweep-shard-*
          path: shards
          merge-multiple: true
      - name: Combine and report
        run: |
          {
            echo "## PATH sweep"
            echo
            echo "The coverage harness (spec §13.1) over every executable on this"
            echo "runner's \`PATH\`, run in 8 shards. Not a regression gate — the"
            echo "runner image's tool inventory drifts between releases — but it is"
            echo "the broadest available measurement of framework coverage on real"
            echo "software."
            echo
            awk '
              /aggregate:/ {
                for (i = 1; i <= NF; i++) {
                  split($i, kv, "=")
                  if (kv[1] == "no_tier_count")     no_tier   += kv[2]
                  if (kv[1] == "suspicious_count")  suspicious += kv[2]
                  if (kv[1] == "verbatim_count")    verbatim  += kv[2]
                  if (kv[1] == "total")             total     += kv[2]
                  if (kv[1] == "described_flags")   described += kv[2]
                  if (kv[1] == "total_flags")       flags     += kv[2]
                }
              }
              END {
                pct = (flags > 0) ? (described / flags * 100) : 0
                printf "**%d tools**, %.2f%% of %d flags described.\n\n", total, pct, flags
                printf "- no-tier: %d\n- suspicious: %d\n- verbatim: %d\n", no_tier, suspicious, verbatim
              }
            ' shards/*.md
            echo
            echo "<details><summary>Per-tool tables (8 shards)</summary>"
            echo
            cat shards/*.md
            echo
            echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"
