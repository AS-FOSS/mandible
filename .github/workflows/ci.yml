name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: msrv (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-version` in Cargo.toml.
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  # Coverage harness diff (spec §13.1), gated on a *fixed* tool list rather
  # than a full-PATH scan: scanning every executable on PATH is inherently
  # environment-dependent (GitHub's runner image's tool inventory doesn't
  # match this batch's sandbox, so a full-PATH baseline would fail
  # spuriously on inventory differences rather than a real regression).
  # `--tools` pins a dozen tools that are present on ubuntu-latest by
  # default (docker and gh included — both ship on GitHub-hosted runners)
  # and together span every active tier: known-specs+help-text (git,
  # curl, tar), help-text only (ip, openssl, sed, find, less, dd), and
  # native (docker, gh). `coverage-scoreboard.ci.txt` is this fixed set's
  # own baseline — a different file from the full-PATH `coverage-
  # scoreboard.txt`, since the two scans cover different tool sets and
  # aren't comparable.
  coverage:
    name: coverage harness (fixed tool set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo xtask coverage --check
          --out coverage-scoreboard.ci.txt
          --tools git,curl,tar,ip,openssl,sed,find,less,dd,gzip,docker,gh
