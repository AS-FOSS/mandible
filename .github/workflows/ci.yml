name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: msrv (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-version` in Cargo.toml.
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  # coverage-harness diff (spec §13.1): `cargo xtask coverage` and a
  # checked-in scoreboard (coverage-scoreboard.txt) now exist. Left
  # commented out here rather than wired as a blocking gate because the
  # harness scans *every executable on PATH*, which is inherently
  # environment-dependent — the checked-in baseline was generated in this
  # batch's sandbox, not on GitHub's actual ubuntu-latest runner image, so
  # `--check` against it here would very likely fail spuriously on tool
  # inventory differences rather than a real regression. To enable: run
  # `cargo xtask coverage` once on the actual CI runner image, commit the
  # resulting coverage-scoreboard.txt, then uncomment this job.
  # coverage:
  #   name: coverage harness
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: cargo xtask coverage --check
