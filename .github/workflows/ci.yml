name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Prose changes cannot break the build, so they do not run it. Note
      # this is `paths-ignore`, not `paths`: a run is skipped only when
      # *every* changed file matches, so touching a workflow, a manifest or
      # any source file still triggers everything. That also answers the
      # obvious worry about editing a workflow and having nothing verify it.
      #
      # Path filters apply to `push` and `pull_request` only. A release
      # reaches these same jobs through `workflow_call`, which ignores them,
      # so a tag always runs the full suite regardless of what it touched.
      - "**/*.md"
      - "docs/**"
      - "LICENSE-*"
      - "NOTICE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE-*"
      - "NOTICE"
      - ".gitignore"
  # Run it by hand from the Actions tab, which is what you want after
  # changing the workflow itself.
  workflow_dispatch:
  # Callable so the release workflow can gate on exactly these checks
  # rather than maintaining a second, drifting copy of them.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux + macOS are the two supported platforms (spec §16 [M-8]-style
  # honesty: Windows is out of scope for now, see README). macOS is a
  # *real* native runner here, not a cross-compile target — this actually
  # exercises the `cfg(unix)` paths in mandible-extract/src/exec/spawn.rs,
  # mandible-extract/src/resolve.rs, and xtask/src/coverage.rs (executable-
  # bit checks) on Darwin, not just Linux. `mandible-cache` (whose
  # `key.rs` this comment used to cite) was deleted in spec revision 3 —
  # see spec.md §11, "No cache". GitHub's `macos-latest` is Apple Silicon
  # (arm64) as of this writing.
  fmt:
    name: fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: msrv build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-version` in Cargo.toml. 1.88 is not a
          # preference, it is the floor the dependency tree actually
          # imposes: clap_lex and several transitive crates now need
          # Cargo's `edition2024` support (stabilized in 1.85), and
          # brush-parser/darling declare 1.88 themselves. Verified by
          # building against each toolchain, not inferred.
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  # Supply-chain and licence checking. This project runs arbitrary
  # third-party binaries on a user's machine, so its own dependency hygiene
  # has more reach than in most tools. Configuration and the reasoning for
  # each policy choice are in deny.toml.
  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # Coverage harness diff (spec §13.1), gated on a *fixed* tool list rather
  # than a full-PATH scan: scanning every executable on PATH is inherently
  # environment-dependent (GitHub's runner image's tool inventory doesn't
  # match this batch's sandbox, so a full-PATH baseline would fail
  # spuriously on inventory differences rather than a real regression).
  # `--tools` pins a dozen tools that are present on ubuntu-latest by
  # default (docker and gh included — both ship on GitHub-hosted runners)
  # and together span every active tier: help-text for all of them (the
  # only universal tier since the catalog was deleted in spec revision 3)
  # plus native on docker and gh, and they cover a deliberate spread of
  # frameworks — GNU argp (tar, sed, dd), cobra (docker, gh),
  # unidentified-but-parseable (curl, find, less), and stderr-only output
  # (ip, openssl, spec [M-8]). `coverage-scoreboard.ci.txt` is this fixed set's
  # own baseline — a different file from the full-PATH `coverage-
  # scoreboard.txt`, since the two scans cover different tool sets and
  # aren't comparable.
  #
  # Ubuntu-only, deliberately not matrixed: the pinned tool list (docker,
  # gh, gzip, ...) reflects ubuntu-latest's specific preinstalled
  # inventory, not macOS's — a macOS run of this exact list would fail on
  # inventory differences alone, which is precisely the spurious-failure
  # mode this job's fixed list exists to avoid on Linux. A macOS-specific
  # tool list is future work, not a portability bug in the harness itself.
  coverage:
    name: coverage harness (fixed tool set, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo xtask coverage --check
          --out coverage-scoreboard.ci.txt
          --tools git,curl,tar,ip,openssl,sed,find,less,dd,gzip,docker,gh

  # Corpus regression net (spec §13.2, corpus/README.md, xtask/src/corpus.rs):
  # replays every corpus/<tool>/<version>/ fixture through the real tiered
  # extraction pipeline from bytes frozen in the repo.
  #
  # This is a **hard gate**, unlike `path-sweep.yml`'s coverage sweep — read
  # that file's header for the long version of why *it* deliberately isn't
  # one, because the contrast is the point. The short version: the corpus
  # runner spawns zero subprocesses (`Transcript`, not a live `exec`), reads
  # only bytes checked into this repo, and never touches an installed
  # tool's version — nothing here can vary between two runs of the same
  # commit. `path-sweep.yml` measured the alternative directly: two sweeps
  # of *identical* code, on a contended shared VM, had four tools flap
  # purely on timing (`waagent2.0` went `ok` -> `verbatim` as its elapsed
  # time halved between runs, AGENTS.md). That class of flake is
  # structurally impossible here, so a red run is always a real parser
  # change — a `[contract]` violation or a snapshot mismatch — and gating
  # on it costs nothing a human wouldn't want caught before merge.
  #
  # `--format markdown` renders a semantic before/after transition report
  # (status, node/flag counts, and *named* subcommand/flag deltas) instead
  # of a raw `expected.snap` diff, for the same reason `corpus/README.md`
  # frames blessing as something to *review*: a fixture like tar's runs
  # over a thousand YAML lines, and a diff that size gets approved unread,
  # which quietly deletes the ratchet this whole harness exists to build.
  # `tee -a` (not `>>`, which would only ever reach the file) both prints
  # the report to this step's own log and appends it to
  # `$GITHUB_STEP_SUMMARY`; `pipefail` keeps `cargo xtask corpus`'s exit
  # code — not `tee`'s — as the step's result, so a regression still fails
  # the job even though its output was piped.
  #
  # Ubuntu-only, deliberately not matrixed like fmt/clippy/test above: the
  # runner touches no OS-conditional code path (no subprocess, no
  # filesystem probing beyond reading its own fixtures), so a second run on
  # macOS would exercise nothing fmt/clippy/test/msrv's own matrix doesn't
  # already cover.
  corpus:
    name: corpus regression net
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Replay corpus fixtures
        shell: bash
        run: |
          set -o pipefail
          cargo xtask corpus --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
