name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Prose changes cannot break the build, so they do not run it. Note
      # this is `paths-ignore`, not `paths`: a run is skipped only when
      # *every* changed file matches, so touching a workflow, a manifest or
      # any source file still triggers everything. That also answers the
      # obvious worry about editing a workflow and having nothing verify it.
      #
      # Path filters apply to `push` and `pull_request` only. A release
      # reaches these same jobs through `workflow_call`, which ignores them,
      # so a tag always runs the full suite regardless of what it touched.
      - "**/*.md"
      - "docs/**"
      - "LICENSE-*"
      - "NOTICE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE-*"
      - "NOTICE"
      - ".gitignore"
  # Run it by hand from the Actions tab, which is what you want after
  # changing the workflow itself.
  workflow_dispatch:
  # Callable so the release workflow can gate on exactly these checks
  # rather than maintaining a second, drifting copy of them.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux + macOS are the two supported platforms (spec §16 [M-8]-style
  # honesty: Windows is out of scope for now, see README). macOS is a
  # *real* native runner here, not a cross-compile target — this actually
  # exercises the `cfg(unix)` paths in mandible-extract/src/exec/spawn.rs,
  # mandible-extract/src/resolve.rs, and xtask/src/coverage.rs (executable-
  # bit checks) on Darwin, not just Linux. `mandible-cache` (whose
  # `key.rs` this comment used to cite) was deleted in spec revision 3 —
  # see spec.md §11, "No cache". GitHub's `macos-latest` is Apple Silicon
  # (arm64) as of this writing.
  fmt:
    name: fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # cargo-nextest, not `cargo test`: `cargo test`'s human-format output is
  # exactly the thing AGENTS.md §3 now forbids parsing (a `grep -c FAILED`
  # against it false-positived on test *data* that happened to contain the
  # word "FAIL", reporting a confident wrong pass/fail count — twice, in
  # consecutive reports). `cargo nextest run` exists specifically to have a
  # sane machine-readable story (`--message-format libtest-json`, plus a
  # real nonzero exit code on any failure) instead of the ad-hoc text
  # `cargo test` prints for humans. See AGENTS.md §3.3.
  #
  # nextest cannot run doctests (an upstream limitation, not a choice made
  # here), so a separate `cargo test --doc` step covers them — currently
  # zero across the workspace, verified 2026-08-12, so this step is cheap
  # insurance against silently losing doctest coverage if one is ever
  # added, not dead weight today.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      # Ubuntu 24.04 ships `kernel.apparmor_restrict_unprivileged_userns=1`,
      # which blocks the unprivileged user namespaces
      # `exec::containment` builds a sweep's containment out of. Grant the
      # capability rather than relax the assertion: the point of
      # `namespace_support_is_confirmed_on_this_host` is that a host which
      # cannot contain a sweep says so loudly, and a CI job that quietly
      # tolerated the loss would delete exactly the signal that test exists
      # to carry. This provisions what the test demands; it does not lower
      # the bar. Linux-only — macOS has no such sysctl and its
      # `#[cfg(not(target_os = "linux"))]` twins are compiled instead.
      - name: allow unprivileged user namespaces (containment tests)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo nextest run --workspace
      - run: cargo test --doc --workspace

  msrv:
    name: msrv build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-version` in Cargo.toml. 1.88 is not a
          # preference, it is the floor the dependency tree actually
          # imposes: clap_lex and several transitive crates now need
          # Cargo's `edition2024` support (stabilized in 1.85), and
          # brush-parser/darling declare 1.88 themselves. Verified by
          # building against each toolchain, not inferred.
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  # Supply-chain and licence checking. This project runs arbitrary
  # third-party binaries on a user's machine, so its own dependency hygiene
  # has more reach than in most tools. Configuration and the reasoning for
  # each policy choice are in deny.toml.
  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # Coverage harness diff (spec §13.1), gated on a *fixed* tool list rather
  # than a full-PATH scan: scanning every executable on PATH is inherently
  # environment-dependent (GitHub's runner image's tool inventory doesn't
  # match this batch's sandbox, so a full-PATH baseline would fail
  # spuriously on inventory differences rather than a real regression).
  # `--tools` pins a dozen tools that are present on ubuntu-latest by
  # default (docker and gh included — both ship on GitHub-hosted runners)
  # and together span every active tier: help-text for all of them (the
  # only universal tier since the catalog was deleted in spec revision 3)
  # plus native on docker and gh, and they cover a deliberate spread of
  # frameworks — GNU argp (tar, sed, dd), cobra (docker, gh),
  # unidentified-but-parseable (curl, find, less), and stderr-only output
  # (ip, openssl, spec [M-8]). `coverage-scoreboard.ci.txt` is this fixed set's
  # own baseline — a different file from the full-PATH `coverage-
  # scoreboard.txt`, since the two scans cover different tool sets and
  # aren't comparable.
  #
  # Ubuntu-only, deliberately not matrixed: the pinned tool list (docker,
  # gh, gzip, ...) reflects ubuntu-latest's specific preinstalled
  # inventory, not macOS's — a macOS run of this exact list would fail on
  # inventory differences alone, which is precisely the spurious-failure
  # mode this job's fixed list exists to avoid on Linux. A macOS-specific
  # tool list is future work, not a portability bug in the harness itself.
  coverage:
    name: coverage harness (fixed tool set, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo xtask coverage --check
          --out coverage-scoreboard.ci.txt
          --tools git,curl,tar,ip,openssl,sed,find,less,dd,gzip,docker,gh

  # Publishability: package every workspace crate and verify each one builds
  # from its own tarball, exactly as `cargo publish` does at the registry.
  # A crate's tarball can only carry files under the crate root, so an
  # `include_str!` reaching outside it compiles fine from a checkout and
  # fails only at publish time — which is how 0.6.0's binary crate failed to
  # publish after every other gate was green, with the four library crates
  # already on crates.io. `--workspace` verifies against the locally packaged
  # dependencies (cargo ≥ 1.90), so this passes on a PR whose crates are not
  # yet published; the stable toolchain is what the release job publishes
  # with, so this job runs the same one, not the MSRV.
  package:
    name: package (every crate builds from its own tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --locked

  # WS2 part 2: `coverage-scoreboard.ci.txt` is stale against the redefined
  # `pct_flags_with_text` metric (spec §13.1b — the `describable` denominator
  # change), so the `coverage` job right above is red *by design* until it's
  # regenerated. It cannot be regenerated correctly from this repo's own dev
  # box: that baseline captures real `--help` text from real x86-64 binaries
  # (`git`, `docker`, `gh`, ...), and this project's own dev box is aarch64
  # (AGENTS.md environment facts) — a scoreboard built there would silently
  # mix architectures into a baseline that's supposed to be one.
  #
  # This job is the mechanism only. It does **not** overwrite
  # `coverage-scoreboard.ci.txt` in the checkout or commit anything — see
  # AGENTS.md/this task's hard constraint on never writing that file except
  # through an explicit, human-reviewed commit. It computes a fresh
  # scoreboard on the *same* `ubuntu-latest` environment the `coverage` job
  # above actually gates on (deliberately not the pinned container
  # `path-sweep.yml` uses — that pin is scoped to the full-PATH sweep, per
  # WS2 decision 3, and mismatching the baseline's capture environment from
  # the gate's own check environment would just reintroduce the drift this
  # whole task exists to remove), runs `sweep-diff` against the stale
  # checked-in baseline so a reviewer sees exactly what moved, and uploads
  # the fresh file as a downloadable artifact. A human downloads it, renames
  # it to `coverage-scoreboard.ci.txt`, reviews the diff, and commits it
  # deliberately — the same review discipline `corpus/README.md` asks of a
  # blessed snapshot, not an automated overwrite.
  #
  # `workflow_dispatch`-only: nothing about regenerating a baseline belongs
  # on every push or PR — there is no schedule this needs to run on, only a
  # human deciding it's time.
  emit-coverage-baseline:
    name: emit a fresh coverage-scoreboard.ci.txt (manual, artifact only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compute a fresh scoreboard (scratch path — never the checked-in name)
        run: >-
          cargo xtask coverage
          --out coverage-scoreboard.ci.fresh.txt
          --tools git,curl,tar,ip,openssl,sed,find,less,dd,gzip,docker,gh
      - name: Review report — fresh scoreboard against the stale checked-in baseline
        shell: bash
        run: |
          set -o pipefail
          cargo xtask sweep-diff \
            --before coverage-scoreboard.ci.txt \
            --after coverage-scoreboard.ci.fresh.txt \
            --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-scoreboard-ci-fresh
          path: coverage-scoreboard.ci.fresh.txt

  # Corpus regression net (spec §13.2, corpus/README.md, xtask/src/corpus.rs):
  # replays every corpus/<tool>/<version>/ fixture through the real tiered
  # extraction pipeline from bytes frozen in the repo.
  #
  # This is a **hard gate**, unlike `path-sweep.yml`'s coverage sweep — read
  # that file's header for the long version of why *it* deliberately isn't
  # one, because the contrast is the point. The short version: the corpus
  # runner spawns zero subprocesses (`Transcript`, not a live `exec`), reads
  # only bytes checked into this repo, and never touches an installed
  # tool's version — nothing here can vary between two runs of the same
  # commit. `path-sweep.yml` measured the alternative directly: two sweeps
  # of *identical* code, on a contended shared VM, had four tools flap
  # purely on timing (`waagent2.0` went `ok` -> `verbatim` as its elapsed
  # time halved between runs, AGENTS.md). That class of flake is
  # structurally impossible here, so a red run is always a real parser
  # change — a `[contract]` violation or a snapshot mismatch — and gating
  # on it costs nothing a human wouldn't want caught before merge.
  #
  # `--format markdown` renders a semantic before/after transition report
  # (status, node/flag counts, and *named* subcommand/flag deltas) instead
  # of a raw `expected.snap` diff, for the same reason `corpus/README.md`
  # frames blessing as something to *review*: a fixture like tar's runs
  # over a thousand YAML lines, and a diff that size gets approved unread,
  # which quietly deletes the ratchet this whole harness exists to build.
  # `tee -a` (not `>>`, which would only ever reach the file) both prints
  # the report to this step's own log and appends it to
  # `$GITHUB_STEP_SUMMARY`; `pipefail` keeps `cargo xtask corpus`'s exit
  # code — not `tee`'s — as the step's result, so a regression still fails
  # the job even though its output was piped.
  #
  # Ubuntu-only, deliberately not matrixed like fmt/clippy/test above: the
  # runner touches no OS-conditional code path (no subprocess, no
  # filesystem probing beyond reading its own fixtures), so a second run on
  # macOS would exercise nothing fmt/clippy/test/msrv's own matrix doesn't
  # already cover.
  corpus:
    name: corpus regression net
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--baseline-dir` below needs the PR's base-ref `corpus/` tree to
          # diff against, and the default shallow (depth-1, HEAD-only)
          # checkout doesn't carry any history to find it in. Only
          # `pull_request` events have a base ref to compare against at all;
          # `push`/`workflow_call` runs get the ordinary shallow checkout and
          # the population step below is skipped for them (see its own
          # `if`), same as today.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Populates `--baseline-dir` (`corpus::contract_weakened_lines`'s doc
      # comment names exactly this as "the intended" way to wire it) so the
      # `CONTRACT WEAKENED` detector is actually live in CI instead of inert.
      # Before this step existed, nothing ever passed `--baseline-dir` here,
      # so a PR that quietly weakened a fixture's `[contract]` (lowered
      # `min_subcommands`, dropped a `must_contain_flags` or
      # `must_not_contain_flags` entry, newly marked
      # a fixture `[xfail]`) produced no warning at all — legal per
      # `corpus/README.md`'s documented lifecycle, but silent, which is
      # exactly what that detector exists to stop.
      #
      # `git archive <base-sha> -- corpus | tar -x` is the runner's own git
      # access reaching into the base ref, never this repo's code doing it
      # (`xtask`/`corpus.rs`'s own doc comment: no `std::process` outside
      # `mandible-extract/src/exec/`, so the binary itself can't shell out to
      # git). `continue-on-error: true`: a failure here (an unusually shallow
      # fork, a rebased PR whose base sha isn't reachable, ...) must never
      # take down the hard gate below over a report-only feature — the next
      # step falls back to "no baseline" exactly as if `--baseline-dir` had
      # never been passed.
      - name: Populate contract baseline from the PR's base ref
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p corpus-baseline
          git archive ${{ github.event.pull_request.base.sha }} -- corpus | tar -x -C corpus-baseline
      - name: Replay corpus fixtures
        shell: bash
        run: |
          set -o pipefail
          baseline_args=()
          if [ -d corpus-baseline/corpus ]; then
            baseline_args=(--baseline-dir corpus-baseline/corpus)
          fi
          cargo xtask corpus --format markdown "${baseline_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  # A released changelog section is history. This checks that every `## [X.Y.Z]`
  # with a matching `vX.Y.Z` tag still says what that tag published.
  #
  # The failure it prevents happened on 2026-08-12: a change appended ~56 lines
  # of unreleased work under `## [0.2.2]`, a version tagged and published weeks
  # earlier, and nothing noticed. Because the release body is generated from a
  # changelog section, that misattribution would have shipped.
  changelog:
    name: changelog (released sections are immutable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard compares each section against the tag that published it,
          # so it needs the tags and their history. The default shallow,
          # tagless checkout would make every section look unreleased and the
          # check would pass vacuously.
          fetch-depth: 0
      - run: ./scripts/changelog_guard.sh
