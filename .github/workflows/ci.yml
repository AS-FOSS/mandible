name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux + macOS are the two supported platforms (spec §16 [M-8]-style
  # honesty: Windows is out of scope for now, see README). macOS is a
  # *real* native runner here, not a cross-compile target — this actually
  # exercises the `cfg(unix)` paths in mandible-extract/src/exec/spawn.rs
  # and mandible-cache/src/key.rs on Darwin, not just Linux. GitHub's
  # `macos-latest` is Apple Silicon (arm64) as of this writing.
  fmt:
    name: fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: msrv build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-version` in Cargo.toml.
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  # Coverage harness diff (spec §13.1), gated on a *fixed* tool list rather
  # than a full-PATH scan: scanning every executable on PATH is inherently
  # environment-dependent (GitHub's runner image's tool inventory doesn't
  # match this batch's sandbox, so a full-PATH baseline would fail
  # spuriously on inventory differences rather than a real regression).
  # `--tools` pins a dozen tools that are present on ubuntu-latest by
  # default (docker and gh included — both ship on GitHub-hosted runners)
  # and together span every active tier: known-specs+help-text (git,
  # curl, tar), help-text only (ip, openssl, sed, find, less, dd), and
  # native (docker, gh). `coverage-scoreboard.ci.txt` is this fixed set's
  # own baseline — a different file from the full-PATH `coverage-
  # scoreboard.txt`, since the two scans cover different tool sets and
  # aren't comparable.
  #
  # Ubuntu-only, deliberately not matrixed: the pinned tool list (docker,
  # gh, gzip, ...) reflects ubuntu-latest's specific preinstalled
  # inventory, not macOS's — a macOS run of this exact list would fail on
  # inventory differences alone, which is precisely the spurious-failure
  # mode this job's fixed list exists to avoid on Linux. A macOS-specific
  # tool list is future work, not a portability bug in the harness itself.
  coverage:
    name: coverage harness (fixed tool set, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo xtask coverage --check
          --out coverage-scoreboard.ci.txt
          --tools git,curl,tar,ip,openssl,sed,find,less,dd,gzip,docker,gh
