name: release

# Tag-triggered release. Push an annotated tag and this builds binaries for
# both supported platforms on both architectures, publishes a GitHub Release
# whose body is the matching CHANGELOG section, and publishes the workspace
# to crates.io.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Ordering is deliberate: binaries build first, the Release is created only
# if every one of them succeeded, and crates.io publishing happens last.
# **Publishing to crates.io cannot be undone** — a version can be yanked but
# never replaced or re-uploaded — so it runs only after everything that
# *can* fail safely already has.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the leading v), e.g. 0.1.0"
        required: true
      publish_crates:
        description: "Also publish to crates.io (irreversible)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# One in-flight release per ref. Re-pushing a tag (to pick up a workflow
# fix, which took several attempts to get this pipeline right) supersedes
# the previous attempt rather than leaving it queued forever — three
# ten-hour zombie runs accumulated that way. Grouped by ref, so releasing
# 0.2.0 never cancels an in-flight 0.1.0.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing is built, released, or published until the full suite passes.
  # These reuse ci.yml and frameworks.yml via `workflow_call` rather than
  # restating their steps here: a second copy of the checks would drift
  # from the real ones, and a release gate that verifies something slightly
  # different from what CI verifies is a gate you cannot trust.
  verify:
    name: verify
    uses: ./.github/workflows/ci.yml

  verify-frameworks:
    name: verify frameworks
    uses: ./.github/workflows/frameworks.yml

  # Native runners wherever GitHub still has them, because this project
  # spawns subprocesses and reads binaries off PATH — a cross-compiled
  # artifact that has never executed on its target architecture is not
  # evidence of much.
  #
  # The one exception is x86_64-apple-darwin. GitHub retired the Intel
  # macOS runners, and `macos-13` now waits for capacity that no longer
  # exists: every release run sat with that single job queued for ten hours
  # while all fifteen others passed. It is cross-compiled from the arm64
  # runner instead, and `native: false` marks it as the one artifact whose
  # smoke test is best-effort — running an x86_64 binary there needs
  # Rosetta, which the runner image does not guarantee. Shipping an Intel
  # build that compiled but never ran beats shipping none at all, as long
  # as the difference is stated rather than implied.
  build:
    name: build ${{ matrix.target }}
    needs: [verify, verify-frameworks]
    runs-on: ${{ matrix.os }}
    # Note what this does and does not cover: `timeout-minutes` starts
    # counting when a job begins *executing* on a runner, so it bounds a
    # runaway build but not a job that never gets scheduled at all. The
    # ten-hour stall that prompted it — `macos-13` waiting on retired Intel
    # capacity — would not have been caught by this. What fixes that is not
    # referencing a dead runner label, plus the `concurrency` group above,
    # which lets a re-pushed tag supersede a stuck run instead of leaving
    # zombies queued behind it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            native: true
          - os: macos-latest
            target: x86_64-apple-darwin
            native: false
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin mandible

      # A release binary that cannot start is the one failure mode worth
      # catching here, and `--doctor` exercises the real extraction pipeline
      # without needing a tty. Skipped for the cross-compiled target, which
      # this runner cannot execute.
      - name: Smoke-test the artifact
        if: matrix.native
        run: |
          ./target/${{ matrix.target }}/release/mandible --version
          ./target/${{ matrix.target }}/release/mandible --doctor tar

      - name: Package
        run: |
          staging="mandible-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp target/${{ matrix.target }}/release/mandible "$staging/"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE "$staging/"
          cp packaging/mandible.1 "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

          # A second copy under a version-less name, so
          # /releases/latest/download/mandible-<target>.tar.gz is a URL that
          # keeps working across releases. Without it every download link
          # embeds a version and breaks on the next tag — GitHub resolves
          # /latest/ to the newest release, but only for an asset filename
          # that actually exists there. This is what a README link or an
          # install script can point at.
          stable="mandible-${{ matrix.target }}"
          cp "$staging.tar.gz" "$stable.tar.gz"
          shasum -a 256 "$stable.tar.gz" > "$stable.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mandible-${{ matrix.target }}
          path: |
            mandible-*.tar.gz
            mandible-*.tar.gz.sha256
          if-no-files-found: error

  # Distro packages, built from the metadata already in mandible/Cargo.toml.
  # x86_64 only for now: cargo-deb/cargo-generate-rpm would need a separate
  # matrix entry per architecture, and shipping an arm64 .deb nobody has
  # tested is worse than not shipping one.
  packages:
    name: deb + rpm (x86_64)
    needs: [verify, verify-frameworks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Prebuilt binaries rather than `cargo install`, which compiled both
      # packagers from source on every release and was most of this job's
      # 168 seconds. Versions are pinned, so this is a download of a known
      # artifact, not a moving target.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3.7.0,cargo-generate-rpm@0.16.0
      - name: Build packages
        run: |
          cargo build --release --locked --bin mandible
          cargo deb --no-build -p mandible
          cargo generate-rpm -p mandible
      - uses: actions/upload-artifact@v4
        with:
          name: mandible-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error

  # Skipped on a bare `workflow_dispatch` with no tag, so dispatching this
  # workflow is a safe rehearsal of the build half: you get binaries and
  # packages as artifacts without creating a Release or touching crates.io.
  release:
    name: github release
    needs: [build, packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Body comes from the CHANGELOG section matching the tag, falling back
      # to Unreleased. Generated by a checked-in script so it can be run
      # locally — a broken release body should not be something you discover
      # only after tagging.
      - name: Build release notes
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          {
            echo "## Install"
            echo
            echo '```console'
            echo "cargo install mandible"
            echo '```'
            echo
            echo "Or download a binary below. Verify with the accompanying \`.sha256\`."
            echo
            echo "---"
            echo
            scripts/changelog_section.sh "$version"
          } > release-notes.md
          wc -l release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version || github.ref_name }}"
          tag="${version}"
          [[ "$tag" == v* ]] || tag="v${tag}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            --verify-tag \
            $(find artifacts -type f | sort)

  # Last, and only on a real tag: crates.io publishing is irreversible.
  # Order follows the dependency graph — a dependency must exist on the
  # registry before anything that depends on it can be published. Modern
  # cargo waits for each publish to become available in the index before
  # returning, so no manual sleeps are needed.
  publish-crates:
    name: publish to crates.io
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.publish_crates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in mandible-core mandible-search mandible-extract mandible-tui mandible; do
            echo "::group::publish $crate"
            # `--locked` so what lands on the registry is what CI built and
            # tested, not a freshly-resolved dependency set.
            cargo publish --locked -p "$crate"
            echo "::endgroup::"
          done
