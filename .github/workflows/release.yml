name: release

# Tag-triggered release. Push an annotated tag and this builds binaries for
# both supported platforms on both architectures, publishes a GitHub Release
# whose body is the matching CHANGELOG section, and publishes the workspace
# to crates.io.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Ordering is deliberate: binaries build first, the Release is created only
# if every one of them succeeded, and crates.io publishing happens last.
# **Publishing to crates.io cannot be undone** — a version can be yanked but
# never replaced or re-uploaded — so it runs only after everything that
# *can* fail safely already has.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the leading v), e.g. 0.1.0"
        required: true
      publish_crates:
        description: "Also publish to crates.io (irreversible)"
        type: boolean
        default: false
      submit_copr:
        description: "Also submit the SRPM to COPR (safe to repeat; a tag does this automatically)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# One in-flight release per ref. Re-pushing a tag (to pick up a workflow
# fix, which took several attempts to get this pipeline right) supersedes
# the previous attempt rather than leaving it queued forever — three
# ten-hour zombie runs accumulated that way. Grouped by ref, so releasing
# 0.2.0 never cancels an in-flight 0.1.0.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing is built, released, or published until the full suite passes.
  # These reuse ci.yml and frameworks.yml via `workflow_call` rather than
  # restating their steps here: a second copy of the checks would drift
  # from the real ones, and a release gate that verifies something slightly
  # different from what CI verifies is a gate you cannot trust.
  verify:
    name: verify
    uses: ./.github/workflows/ci.yml

  verify-frameworks:
    name: verify frameworks
    uses: ./.github/workflows/frameworks.yml

  # Native runners wherever GitHub still has them, because this project
  # spawns subprocesses and reads binaries off PATH — a cross-compiled
  # artifact that has never executed on its target architecture is not
  # evidence of much.
  #
  # The one exception is x86_64-apple-darwin. GitHub retired the Intel
  # macOS runners, and `macos-13` now waits for capacity that no longer
  # exists: every release run sat with that single job queued for ten hours
  # while all fifteen others passed. It is cross-compiled from the arm64
  # runner instead, and `native: false` marks it as the one artifact whose
  # smoke test is best-effort — running an x86_64 binary there needs
  # Rosetta, which the runner image does not guarantee. Shipping an Intel
  # build that compiled but never ran beats shipping none at all, as long
  # as the difference is stated rather than implied.
  build:
    name: build ${{ matrix.target }}
    needs: [verify, verify-frameworks]
    runs-on: ${{ matrix.os }}
    # Note what this does and does not cover: `timeout-minutes` starts
    # counting when a job begins *executing* on a runner, so it bounds a
    # runaway build but not a job that never gets scheduled at all. The
    # ten-hour stall that prompted it — `macos-13` waiting on retired Intel
    # capacity — would not have been caught by this. What fixes that is not
    # referencing a dead runner label, plus the `concurrency` group above,
    # which lets a re-pushed tag supersede a stuck run instead of leaving
    # zombies queued behind it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            native: true
          - os: macos-latest
            target: x86_64-apple-darwin
            native: false
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin mandible

      # A release binary that cannot start is the one failure mode worth
      # catching here, and `--doctor` exercises the real extraction pipeline
      # without needing a tty. Skipped for the cross-compiled target, which
      # this runner cannot execute.
      - name: Smoke-test the artifact
        if: matrix.native
        run: |
          ./target/${{ matrix.target }}/release/mandible --version
          ./target/${{ matrix.target }}/release/mandible --doctor tar

      - name: Package
        run: |
          staging="mandible-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp target/${{ matrix.target }}/release/mandible "$staging/"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE "$staging/"
          cp packaging/mandible.1 "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

          # A second copy under a version-less name, so
          # /releases/latest/download/mandible-<target>.tar.gz is a URL that
          # keeps working across releases. Without it every download link
          # embeds a version and breaks on the next tag — GitHub resolves
          # /latest/ to the newest release, but only for an asset filename
          # that actually exists there. This is what a README link or an
          # install script can point at.
          stable="mandible-${{ matrix.target }}"
          cp "$staging.tar.gz" "$stable.tar.gz"
          shasum -a 256 "$stable.tar.gz" > "$stable.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mandible-${{ matrix.target }}
          path: |
            mandible-*.tar.gz
            mandible-*.tar.gz.sha256
          if-no-files-found: error

  # Distro packages, built from the metadata already in mandible/Cargo.toml.
  #
  # Both architectures now, each built natively — this used to be x86_64
  # only, on the stated reason that "an arm64 .deb nobody has tested" is
  # worse than shipping none. That objection is stale: the `build` job above
  # has run natively on `ubuntu-24.04-arm` since it added the
  # aarch64-unknown-linux-gnu target, and its smoke test already proves a
  # native arm64 `mandible` binary runs there. What was actually untested
  # was never the architecture generally, it was `cargo deb`/`cargo
  # generate-rpm`'s *own* arm64 output specifically — so this job's smoke
  # test (below) installs the built `.deb` with `dpkg -i` and runs the same
  # `--version`/`--doctor tar` check `build` already trusts, on both
  # architectures, and separately asserts the package's own declared
  # `Architecture:`/`%{ARCH}` field matches the runner it was built on. That
  # is the thing that was actually missing, not "arm64 support" in the
  # abstract.
  #
  # Neither packager needs an explicit `--target`/arch flag here. Read from
  # each tool's own source rather than assumed: cargo-deb's
  # `PackageConfig::new` computes `architecture` from
  # `debian_architecture_from_rust_triple(rust_target_triple.unwrap_or(DEFAULT_TARGET))`
  # (`src/config.rs`), where `DEFAULT_TARGET` is the triple cargo-deb itself
  # was compiled for — i.e. the runner's native arch, since neither this
  # step nor the `Build` step passes `--target`. cargo-generate-rpm's
  # `BuildTarget::binary_arch` (`src/build_target.rs`) falls back the same
  # way, to `std::env::consts::ARCH` of the process running it, when no
  # `--target`/`--arch` is given. Both are only correct as long as the
  # packager binary itself is native to the runner, which is exactly what
  # this matrix now guarantees — so the arch assertion step below verifies
  # that premise on every run instead of trusting it silently.
  packages:
    name: deb + rpm (${{ matrix.arch }})
    needs: [verify, verify-frameworks]
    runs-on: ${{ matrix.os }}
    # 45, not the 30 this job carried while it was x86_64-only. The aarch64
    # row compiles both packagers from source (see the `install-action`
    # comment below) on top of building `mandible` itself, and a release job
    # that times out is a release that has to be re-tagged. Raising a bound
    # whose old value was measured against a strictly cheaper job is not the
    # same as loosening a gate.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Prebuilt binaries rather than `cargo install`, which compiled both
      # packagers from source on every release and was most of this job's
      # 168 seconds. Versions are pinned, so this is a download of a known
      # artifact, not a moving target.
      #
      # That's the x86_64 story, though, not the arm64 one. Checked against
      # `taiki-e/install-action`'s own manifests (which is what this action
      # actually reads before falling back to anything else): cargo-deb's
      # manifest carries a prebuilt binary for `x86_64_linux_gnu` only, no
      # `aarch64_linux_gnu` entry at all, and cargo-generate-rpm has no
      # manifest in that repo whatsoever (`manifests/cargo-generate-rpm.json`
      # 404s) — consistent with upstream `cat-in-136/cargo-generate-rpm`
      # publishing no binary release assets at all, for any architecture.
      # `install-action`'s documented fallback for exactly this case is
      # `cargo install`/`cargo-binstall`, automatic and silent, not an
      # error — so the aarch64 row of this matrix compiles both packagers
      # from source on every run rather than downloading them. Slower (adds
      # real minutes to this job on that row), not broken; `rust-cache`
      # above at least caches the compiled dependency graph between runs.
      # Left as-is rather than switched to `cargo install` explicitly,
      # because that's already the effective behavior and this comment is
      # the honest record of it — not something to silently paper over by
      # having the workflow *say* it uses prebuilt binaries when the arm64
      # row does not.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3.7.0,cargo-generate-rpm@0.16.0
      - name: Build packages
        run: |
          cargo build --release --locked --bin mandible
          # Both manifests install these by literal path; nothing else
          # creates them. See the comment above the asset lists in
          # mandible/Cargo.toml for why they are not globbed out of the
          # build tree any more.
          scripts/gen_completions.sh
          cargo deb --no-build -p mandible
          cargo generate-rpm -p mandible

      # Verify rather than assume. The comment above this job explains why
      # native-build-implies-correct-arch is the right expectation for both
      # packagers, but that's a read of their source, not a guarantee this
      # exact toolchain/runner combination honors it — and a wrong
      # `Architecture:`/`%{ARCH}` stamp is not something apt/dnf ever
      # complains about at build time, only at install time on the arch it
      # lied about. So assert both fields against the value this matrix row
      # declares, and fail the job rather than ship a mislabeled package.
      - name: Verify package architecture metadata
        run: |
          deb_file=$(ls target/debian/*.deb)
          rpm_file=$(ls target/generate-rpm/*.rpm)

          deb_arch=$(dpkg-deb -f "$deb_file" Architecture)
          if [ "$deb_arch" != "${{ matrix.deb_arch }}" ]; then
            echo "::error::${deb_file}: Architecture is '${deb_arch}', expected '${{ matrix.deb_arch }}' for ${{ matrix.arch }}" >&2
            exit 1
          fi

          # `rpm` (the query tool) isn't preinstalled on either GitHub
          # Ubuntu runner image; it ships no build dependency on it, only
          # `cargo generate-rpm`'s own pure-Rust writer.
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends rpm
          rpm_arch=$(rpm -qp --qf '%{ARCH}' "$rpm_file")
          if [ "$rpm_arch" != "${{ matrix.rpm_arch }}" ]; then
            echo "::error::${rpm_file}: %{ARCH} is '${rpm_arch}', expected '${{ matrix.rpm_arch }}' for ${{ matrix.arch }}" >&2
            exit 1
          fi

          echo "deb: ${deb_file} (${deb_arch}); rpm: ${rpm_file} (${rpm_arch})"

      # Same proof the `build` job's own smoke test relies on (see its
      # comment: "a release binary that cannot start is the one failure mode
      # worth catching here"), but for the packaged artifact specifically —
      # installing through `dpkg` exercises the control file, the asset
      # list and the completion-script paths in `mandible/Cargo.toml`'s
      # `[package.metadata.deb]`, none of which the raw binary smoke test
      # above touches at all.
      - name: Install and smoke-test the .deb
        run: |
          sudo dpkg -i target/debian/*.deb
          mandible --version
          mandible --doctor tar

      # Distinct artifact name per architecture: actions/upload-artifact@v4
      # refuses to let two jobs upload under the same name, which a matrix
      # over two runners would otherwise do here. The downstream `release`
      # job merges every artifact into one directory
      # (`download-artifact@v4` with `merge-multiple: true`), which is safe
      # here specifically because the *files* inside don't collide either:
      # both packagers stamp the architecture into the filename itself
      # (cargo-deb: `{name}_{version}-1_{architecture}.deb`;
      # cargo-generate-rpm: `{name}-{version}-{release}.{arch}.rpm`), so
      # `mandible_0.3.2-1_amd64.deb` and `mandible_0.3.2-1_arm64.deb` land as
      # two distinct files in the merged directory rather than one
      # overwriting the other.
      - uses: actions/upload-artifact@v4
        with:
          name: mandible-packages-${{ matrix.arch }}
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error

  # `cargo vendor` output, shipped as a release asset so the RPM spec can
  # reference it as Source1 (packaging/copr/mandible.spec explains why the
  # SRPM carries its dependencies rather than fetching them).
  #
  # Deliberately gated on nothing. This job downloads and repacks crates;
  # it makes no claim about whether the code works, so making it wait for
  # the test suite would only lengthen the critical path. Nothing is
  # submitted anywhere on the strength of this job alone — the COPR job
  # below still requires the release, and therefore the full suite, on any
  # real tag.
  vendor:
    name: vendor the crate dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the vendor tarball
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          # --locked so the vendored set is the one Cargo.lock pins, which
          # is what every other job in this workflow builds against.
          cargo vendor --versioned-dirs --locked vendor > vendor-config.toml
          tar -cJf "mandible-${version}-vendor.tar.xz" vendor
          ls -lh "mandible-${version}-vendor.tar.xz"
          # The spec appends its own equivalent of this; print it so a
          # mismatch between what cargo generates and what the spec writes
          # is visible in the log rather than only at build time.
          cat vendor-config.toml
      - uses: actions/upload-artifact@v4
        with:
          name: mandible-vendor
          path: mandible-*-vendor.tar.xz
          if-no-files-found: error

  # Skipped on a bare `workflow_dispatch` with no tag, so dispatching this
  # workflow is a safe rehearsal of the build half: you get binaries and
  # packages as artifacts without creating a Release or touching crates.io.
  release:
    name: github release
    needs: [build, packages, vendor]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Body: title, install block, rule, then the CHANGELOG section matching
      # the tag (falling back to Unreleased) — the structure the maintainer
      # settled on for 0.5.0, produced by one checked-in script so the exact
      # body can be rendered locally (`scripts/release_notes.sh 0.6.1`) rather
      # than discovered after tagging.
      - name: Build release notes
        run: |
          version="${{ inputs.version || github.ref_name }}"
          scripts/release_notes.sh "$version" > release-notes.md
          wc -l release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version || github.ref_name }}"
          tag="${version}"
          [[ "$tag" == v* ]] || tag="v${tag}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            --verify-tag \
            $(find artifacts -type f | sort)

  # Point the Homebrew tap at the release that was just published.
  #
  # The checksums are *downloaded from the release*, not recomputed. A
  # rebuild here would be a different build: if it ever disagreed with the
  # tarball the release actually serves, the formula would describe a
  # binary nobody can install, and the mismatch would surface as a failed
  # `brew install` rather than as a failed release. `scripts/render_formula.sh`
  # therefore reads the published `.sha256` assets and cross-checks that
  # each digest was computed over the asset the formula's URL points at.
  #
  # The commit is made through GitHub's GraphQL `createCommitOnBranch`
  # rather than `git push`. Commits created that way are signed by GitHub
  # and show as Verified; a push from a runner would be unsigned, and an
  # unsigned commit is not something this project ships — least of all into
  # the repository that tells `brew` which binary to trust.
  homebrew:
    name: bump homebrew tap
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Render the formula from the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"

          mkdir -p sums
          gh release download "v${version}" \
            --repo "${{ github.repository }}" \
            --dir sums \
            --pattern "mandible-v${version}-*.tar.gz.sha256"

          scripts/render_formula.sh "$version" sums > mandible.rb
          cat mandible.rb

      # Skipped rather than failed when the token is absent, so a fork or a
      # rehearsal dispatch does not turn a good release red over a tap it
      # was never going to be allowed to write to. The log line names the
      # secret, because a silently skipped step is how a tap quietly stops
      # tracking releases.
      - name: Commit the formula to AS-FOSS/homebrew-mandible
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_REGISTRY_TOKEN }}
          TAP_OWNER: AS-FOSS
          TAP_NAME: homebrew-mandible
          TAP_BRANCH: main
          FORMULA_PATH: Formula/mandible.rb
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::HOMEBREW_REGISTRY_TOKEN is not set — the Homebrew tap was not updated for v${VERSION}. Set that secret, or edit ${TAP_OWNER}/${TAP_NAME}'s ${FORMULA_PATH} by hand."
            exit 0
          fi

          tap="${TAP_OWNER}/${TAP_NAME}"

          # Identical content means there is nothing to say. Without this,
          # a re-pushed tag would land an empty commit on the tap every
          # time.
          if gh api "repos/${tap}/contents/${FORMULA_PATH}?ref=${TAP_BRANCH}" \
               --jq .content 2>/dev/null | base64 -d > current.rb; then
            if cmp -s current.rb mandible.rb; then
              echo "${tap} ${FORMULA_PATH} already describes v${VERSION}; nothing to commit."
              exit 0
            fi
          fi

          # `expectedHeadOid` makes the write a compare-and-swap: if
          # anything else committed to the tap between this read and the
          # mutation, the API rejects the commit instead of clobbering it.
          head_oid="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$ref:String!){
              repository(owner:$owner,name:$name){ ref(qualifiedName:$ref){ target{ oid } } }
            }' \
            -F owner="${TAP_OWNER}" -F name="${TAP_NAME}" -F ref="refs/heads/${TAP_BRANCH}" \
            --jq '.data.repository.ref.target.oid')"

          if [ -z "$head_oid" ] || [ "$head_oid" = "null" ]; then
            echo "::error::could not read ${tap}@${TAP_BRANCH} — check that HOMEBREW_REGISTRY_TOKEN still grants contents access to it" >&2
            exit 1
          fi

          jq -n \
            --arg repo "$tap" \
            --arg branch "${TAP_BRANCH}" \
            --arg oid "$head_oid" \
            --arg path "${FORMULA_PATH}" \
            --arg contents "$(base64 -w0 mandible.rb)" \
            --arg headline "chore(formula): mandible ${VERSION}" \
            --arg body "Prebuilt-binary URLs and checksums for the v${VERSION} release assets, on all four supported targets." \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  expectedHeadOid: $oid,
                  message: { headline: $headline, body: $body },
                  fileChanges: { additions: [ { path: $path, contents: $contents } ] }
                }
              }
            }' > commit.json

          gh api graphql --input commit.json > commit-result.json
          jq -r '.data.createCommitOnBranch.commit.url' commit-result.json

  # Tell AS-FOSS/mandible-apt to rebuild the apt repository around the
  # release that was just published. That repository indexes the .deb
  # assets from this project's releases and serves them over GitHub Pages;
  # it holds no packages of its own, so it has nothing to publish until
  # this release exists.
  #
  # This needs a token that can dispatch to a *different* repository, which
  # `github.token` cannot do and `HOMEBREW_REGISTRY_TOKEN` is not scoped
  # for — it grants contents on the Homebrew tap and nothing else. So the
  # step names its own secret, `APT_DISPATCH_TOKEN`, and skips with a
  # warning while that does not exist. Skipping is right here in a way it
  # would not be for the signing key: the apt repository can be rebuilt at
  # any time by hand, and the release itself is already published and
  # correct.
  #
  #   gh workflow run publish.yml -R AS-FOSS/mandible-apt -f tag=vX.Y.Z
  #
  # is the manual equivalent, and it is the whole fallback.
  apt-repo:
    name: refresh the apt repository
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch a rebuild to AS-FOSS/mandible-apt
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
          APT_REPO: AS-FOSS/mandible-apt
        run: |
          version="${{ inputs.version || github.ref_name }}"
          tag="${version#v}"
          tag="v${tag}"

          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::APT_DISPATCH_TOKEN is not set — the apt repository was not refreshed for ${tag}. Either add a token with contents:write on ${APT_REPO}, or run: gh workflow run publish.yml -R ${APT_REPO} -f tag=${tag}"
            exit 0
          fi

          gh api "repos/${APT_REPO}/dispatches" \
            --method POST \
            -f event_type=release \
            -F "client_payload[tag]=${tag}"

          echo "dispatched a rebuild of ${APT_REPO} for ${tag}"

  # Build the SRPM and hand it to COPR, which does the per-chroot builds.
  #
  # The SRPM is assembled here rather than by COPR's custom-source method,
  # and packaging/copr/mandible.spec explains that choice at length: it
  # carries its own vendored dependencies, so it builds offline in mock,
  # in koji, or under a plain `rpmbuild --rebuild` on any machine, and it
  # is a complete description of the build rather than a recipe only COPR
  # can follow.
  #
  # On a tag this waits for the release. On a `workflow_dispatch` with
  # submit_copr it needs only the vendor tarball, which makes resubmitting
  # one version cheap — COPR builds are idempotent per (project, version)
  # in the sense that a repeat submission simply supersedes the previous
  # build, so re-running this is safe.
  copr:
    name: submit to copr
    needs: [vendor, release]
    if: |
      always() && needs.vendor.result == 'success' && (
        (startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.submit_copr)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: fedora:41
    defaults:
      run:
        shell: bash
    steps:
      # Before the checkout, not after. actions/checkout uses git when it
      # can find one and otherwise silently falls back to downloading a
      # source tarball through the REST API — which leaves no .git, and
      # the `git archive` below then fails with "not a git repository".
      # The fedora image ships no git, so this ordering is what makes the
      # checkout an actual clone.
      - name: Install the rpm and copr tooling
        run: dnf install -y --setopt=install_weak_deps=False rpm-build rpmdevtools copr-cli git tar

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mandible-vendor

      - name: Build the SRPM
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"

          mkdir -p rpmbuild/SOURCES rpmbuild/SPECS

          # The same content GitHub serves at the spec's Source0 URL: the
          # tag's tree under a `mandible-<version>/` prefix. Produced with
          # git archive so this job does not depend on GitHub having
          # generated that archive yet.
          git config --global --add safe.directory "$PWD"
          git archive --prefix="mandible-${version}/" \
            -o "rpmbuild/SOURCES/mandible-${version}.tar.gz" HEAD

          mv "mandible-${version}-vendor.tar.xz" rpmbuild/SOURCES/

          # `Version:` in the checked-in spec tracks the workspace version
          # so the spec is buildable by hand from a clean checkout. What
          # reaches COPR is the tag being released, which is the only
          # value that can be right here.
          sed -e "s/^Version:.*/Version:        ${version}/" \
            packaging/copr/mandible.spec > rpmbuild/SPECS/mandible.spec
          grep '^Version:' rpmbuild/SPECS/mandible.spec

          rpmbuild --define "_topdir ${PWD}/rpmbuild" -bs rpmbuild/SPECS/mandible.spec
          ls -lh rpmbuild/SRPMS/

      # Skipped, not failed, when the secret is absent: a fork has no COPR
      # to submit to, and the release itself is already published and
      # correct. The log line names the secret so a silently missing
      # submission is not mistaken for a successful one.
      - name: Submit to COPR
        env:
          COPR_REGISTRY_TOKEN: ${{ secrets.COPR_REGISTRY_TOKEN }}
          # Set this repository variable to override where builds are
          # submitted. Left unset, the project is `<username>/mandible`,
          # with the username read from the API config itself.
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          if [ -z "${COPR_REGISTRY_TOKEN}" ]; then
            echo "::warning::COPR_REGISTRY_TOKEN is not set — the SRPM for ${VERSION} was built but not submitted to COPR. Add that secret (the contents of the API config from https://copr.fedorainfracloud.org/api/) to enable submission."
            exit 0
          fi

          mkdir -p ~/.config
          printf '%s\n' "${COPR_REGISTRY_TOKEN}" > ~/.config/copr
          chmod 600 ~/.config/copr

          # The owner is read from the config rather than written down
          # here. The COPR project lives under the maintainer's Fedora
          # account, which is not the GitHub organisation name, and a
          # hardcoded owner would be a second place for that to be wrong.
          project="${COPR_PROJECT}"
          if [ -z "$project" ]; then
            owner="$(awk -F'=' '/^[[:space:]]*username[[:space:]]*=/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' ~/.config/copr)"
            if [ -z "$owner" ]; then
              echo "::error::COPR_REGISTRY_TOKEN holds no 'username =' line, so the project owner cannot be derived. Set the COPR_PROJECT repository variable to '<owner>/<project>' instead." >&2
              exit 1
            fi
            project="${owner}/mandible"
          fi
          echo "submitting to ${project}"

          srpm="$(ls rpmbuild/SRPMS/mandible-${VERSION}-*.src.rpm)"
          copr-cli build "${project}" "${srpm}"

  # Last, and only on a real tag: crates.io publishing is irreversible.
  # Order follows the dependency graph — a dependency must exist on the
  # registry before anything that depends on it can be published. Modern
  # cargo waits for each publish to become available in the index before
  # returning, so no manual sleeps are needed.
  publish-crates:
    name: publish to crates.io
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.publish_crates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in mandible-core mandible-search mandible-extract mandible-tui mandible; do
            echo "::group::publish $crate"
            # `--locked` so what lands on the registry is what CI built and
            # tested, not a freshly-resolved dependency set.
            cargo publish --locked -p "$crate"
            echo "::endgroup::"
          done
